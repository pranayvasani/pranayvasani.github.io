he date or datetime of when the observation was obtained, not the date of the observation starting. For example, if the patient reports that they had a heart attack when they were 50, the observation date or datetime is the date of the report, the heart attack observation can have a value_as_concept which captures how long ago the observation applied to the patient.","pk":["observation_id"],"columns":[{"name":"observation_id","type":"integer","dictType":"integer","required":true,"pk":true,"dictPk":true,"desc":"The unique key given to an Observation record for a Person. Refer to the ETL for how duplicate Observations during the same Visit were handled.","etl":"Each instance of an observation present in the source data should be assigned this unique key.","flags":[]},{"name":"person_id","type":"integer","dictType":"integer","required":true,"pk":false,"dictPk":false,"desc":"The PERSON_ID of the Person for whom the Observation is recorded. This may be a system generated code.","etl":"","flags":[]},{"name":"observation_concept_id","type":"integer","dictType":"integer","required":true,"pk":false,"dictPk":false,"desc":"The OBSERVATION_CONCEPT_ID field is recommended for primary use in analyses, and must be used for network studies.","etl":"The standard CONCEPT_ID that represents the OBSERVATION_SOURCE_VALUE. The concept id should be derived either from mapping from the source concept id or by picking the concept representing the most amount of detail you have. There is no specified domain that the Concepts in this table must adhere to. The only rule is that records with Concepts in the Condition, Procedure, Drug, Measurement, or Device domains MUST go to the corresponding table.","flags":[]},{"name":"observation_date","type":"date","dictType":"date","required":true,"pk":false,"dictPk":false,"desc":"The date of when the Observation was obtained. Depending on what the Observation represents this could be the date of a lab test, the date of a survey, or the date a patient's family history was taken.","etl":"For some observations the ETL may need to make a choice as to which date to choose.","flags":[]},{"name":"observation_datetime","type":"TIMESTAMP","dictType":"datetime","required":false,"pk":false,"dictPk":false,"desc":"If no time is given set to NULL.","etl":"If no time is given set to NULL.","flags":[],"descFrom":"etlConventions (userGuidance empty)"},{"name":"observation_type_concept_id","type":"integer","dictType":"integer","required":true,"pk":false,"dictPk":false,"desc":"This field can be used to determine the provenance of the Observation record, as in whether the measurement was from an EHR system, insurance claim, registry, or other sources.","etl":"Choose the OBSERVATION_TYPE_CONCEPT_ID that best represents the provenance of the record, for example whether it came from an EHR record or billing claim. [Accepted Concepts](https://athena.ohdsi.org/search-terms/terms?domain=Type+Concept&standardConcept=Standard&page=1&pageSize=15&query=). A more detailed explanation of each Type Concept can be found on the [vocabulary wiki](https://github.com/OHDSI/Vocabulary-v5.0/wiki/Vocab.-TYPE_CONCEPT).","flags":[]},{"name":"value_as_number","type":"NUMERIC","dictType":"float","required":false,"pk":false,"dictPk":false,"desc":"This is the numerical value of the Result of the Observation, if applicable and available. It is not expected that all Observations will have numeric results, rather, this field is here to house values should they exist.","etl":"","flags":[]},{"name":"value_as_string","type":"varchar(60)","dictType":"varchar(60)","required":false,"pk":false,"dictPk":false,"desc":"This is the categorical value of the Result of the Observation, if applicable and available.","etl":"","flags":[]},{"name":"value_as_concept_id","type":"integer","dictType":"integer","required":false,"pk":false,"dictPk":false,"desc":"It is possible that some records destined for the Observation table have two clinical ideas represented in one source code. This is common with ICD10 codes that describe a family history of some Condition, for example. In OMOP the Vocabulary breaks these two clinical ideas into two codes; one becomes the OBSERVATION_CONCEPT_ID and the other becomes the VALUE_AS_CONCEPT_ID. It is important when using the Observation table to keep this possibility in mind and to examine the VALUE_AS_CONCEPT_ID field for relevant information.","etl":"Note that the value of VALUE_AS_CONCEPT_ID may be provided through mapping from a source Concept which contains the content of the Observation. In those situations, the CONCEPT_RELATIONSHIP table in addition to the 'Maps to' record contains a second record with the relationship_id set to 'Maps to value'. For example, ICD10 [Z82.4](https://athena.ohdsi.org/search-terms/terms/45581076) 'Family history of ischaemic heart disease and other diseases of the circulatory system' has a 'Maps to' relationship to [4167217](https://athena.ohdsi.org/search-terms/terms/4167217) 'Family history of clinical finding' as well as a 'Maps to value' record to [134057](https://athena.ohdsi.org/search-terms/terms/134057) 'Disorder of cardiovascular system'. If there's no categorial result in a source_data, set value_as_concept_id to NULL, if there is a categorial result in a source_data but without mapping, set value_as_concept_id to 0.","flags":[]},{"name":"qualifier_concept_id","type":"integer","dictType":"integer","required":false,"pk":false,"dictPk":false,"desc":"This field contains all attributes specifying the clinical fact further, such as as degrees, severities, drug-drug interaction alerts etc.","etl":"Use your best judgement as to what Concepts to use here and if they are necessary to accurately represent the clinical record. There is no restriction on the domain of these Concepts, they just need to be Standard.","flags":[]},{"name":"unit_concept_id","type":"integer","dictType":"integer","required":false,"pk":false,"dictPk":false,"desc":"There is currently no recommended unit for individual observation concepts. UNIT_SOURCE_VALUES should be mapped to a Standard Concept in the Unit domain that best represents the unit as given in the source data.","etl":"There is no standardization requirement for units associated with OBSERVATION_CONCEPT_IDs, however, it is the responsibility of the ETL to choose the most plausible unit. If the source unit is NULL (applicable to cases when there's no numerical value or when it doesn't require a unit), keep unit_concept_id NULL as well. If there's no mapping of a source unit, populate unit_concept_id with 0.","flags":[]},{"name":"provider_id","type":"integer","dictType":"integer","required":false,"pk":false,"dictPk":false,"desc":"The provider associated with the observation record, e.g. the provider who ordered the test or the provider who recorded the result.","etl":"The ETL may need to make a choice as to which PROVIDER_ID to put here. Based on what is available this may or may not be different than the provider associated with the overall VISIT_OCCURRENCE record. For example the admitting vs attending physician on an EHR record.","flags":[]},{"name":"visit_occurrence_id","type":"integer","dictType":"integer","required":false,"pk":false,"dictPk":false,"desc":"The visit during which the Observation occurred.","etl":"Depending on the structure of the source data, this may have to be determined based on dates. If an OBSERVATION_DATE occurs within the start and end date of a Visit it is a valid ETL choice to choose the VISIT_OCCURRENCE_ID from the visit that subsumes it, even if not explicitly stated in the data. While not required, an attempt should be made to locate the VISIT_OCCURRENCE_ID of the observation record. If an observation is related to a visit explicitly in the source data, it is possible that the result date of the Observation falls outside of the bounds of the Visit dates.","flags":[]},{"name":"visit_detail_id","type":"integer","dictType":"integer","required":false,"pk":false,"dictPk":false,"desc":"The VISIT_DETAIL record during which the Observation occurred. For example, if the Person was in the ICU at the time the VISIT_OCCURRENCE record would reflect the overall hospital stay and the VISIT_DETAIL record would reflect the ICU stay during the hospital visit.","etl":"Same rules apply as for the VISIT_OCCURRENCE_ID.","flags":[]},{"name":"observation_source_value","type":"varchar(50)","dictType":"varchar(50)","required":false,"pk":false,"dictPk":false,"desc":"This field houses the verbatim value from the source data representing the Observation that occurred. For example, this could be an ICD10 or Read code.","etl":"This code is mapped to a Standard Concept in the Standardized Vocabularies and the original code is stored here for reference.","flags":[]},{"name":"observation_source_concept_id","type":"integer","dictType":"integer","required":false,"pk":false,"dictPk":false,"desc":"This is the concept representing the OBSERVATION_SOURCE_VALUE and may not necessarily be standard. This field is discouraged from use in analysis because it is not required to contain Standard Concepts that are used across the OHDSI community, and should only be used when Standard Concepts do not adequately represent the source detail for the Observation necessary for a given analytic use case. Consider using OBSERVATION_CONCEPT_ID instead to enable standardized analytics that can be consistent across the network.","etl":"If the OBSERVATION_SOURCE_VALUE is coded in the source data using an OMOP supported vocabulary put the concept id representing the source value here.","flags":[]},{"name":"unit_source_value","type":"varchar(50)","dictType":"varchar(50)","required":false,"pk":false,"dictPk":false,"desc":"This field houses the verbatim value from the source data representing the unit of the Observation that occurred.","etl":"This code is mapped to a Standard Concept in the Standardized Vocabularies and the original code is stored here for reference.","flags":[]},{"name":"qualifier_source_value","type":"varchar(50)","dictType":"varchar(50)","required":false,"pk":false,"dictPk":false,"desc":"This field houses the verbatim value from the source data representing the qualifier of the Observation that occurred.","etl":"This code is mapped to a Standard Concept in the Standardized Vocabularies and the original code is stored here for reference.","flags":[]},{"name":"value_source_value","type":"varchar(50)","dictType":"varchar(50)","required":false,"pk":false,"dictPk":false,"desc":"This field houses the verbatim result value of the Observation from the source data.  Do not get confused with the Observation_source_value which captures source value of the observation mapped to observation_concept_id. This field is the observation result value from the source.","etl":"If the observation_source_value was a question, for example,  or an observation that requires a result then this field is the answer/ result from the source data. Store the verbatim value that represents the result of the observation_source_value.","flags":[]},{"name":"observation_event_id","type":"integer","dictType":"integer","required":false,"pk":false,"dictPk":false,"desc":"If the Observation record is related to another record in the database, this field is the primary key of the linked record.","etl":"Put the primary key of the linked record, if applicable, here. See the [ETL Conventions for the OBSERVATION](https://ohdsi.github.io/CommonDataModel/cdm54.html#observation) table for more details.","flags":[]},{"name":"obs_event_field_concept_id","type":"integer","dictType":"integer","required":false,"pk":false,"dictPk":false,"desc":"If the Observation record is related to another record in the database, this field is the CONCEPT_ID that identifies which table the primary key of the linked record came from.","etl":"Put the CONCEPT_ID that identifies which table and field the OBSERVATION_EVENT_ID came from.","flags":[]}],"isLookup":false,"pos":null,"summary":"21 columns, PK observation_id. References 5 table(s) incl. CONCEPT via 7 *_concept_id columns. Referenced by 1 table(s).","hub":false},{"id":"observation_period","schema":"CDM","name":"observation_period","area":"clinical","description":"This table contains records which define spans of time during which two conditions are expected to hold: (i) Clinical Events that happened to the Person are recorded in the Event tables, and (ii) absence of records indicate such Events did not occur during this span of time.","guidance":"For each Person, one or more OBSERVATION_PERIOD records may be present, but they will not overlap or be back to back to each other. Events may exist outside all of the time spans of the OBSERVATION_PERIOD records for a patient, however, absence of an Event outside these time spans cannot be construed as evidence of absence of an Event. Incidence or prevalence rates should only be calculated for the time of active OBSERVATION_PERIOD records. When constructing cohorts, outside Events can be used for inclusion criteria definition, but without any guarantee for the performance of these criteria. Also, OBSERVATION_PERIOD records can be as short as a single day, greatly disturbing the denominator of any rate calculation as part of cohort characterizations. To avoid that, apply minimal observation time as a requirement for any cohort definition.","pk":["observation_period_id"],"columns":[{"name":"observation_period_id","type":"integer","dictType":"integer","required":true,"pk":true,"dictPk":true,"desc":"A Person can have multiple discrete Observation Periods which are identified by the Observation_Period_Id.","etl":"Assign a unique observation_period_id to each discrete Observation Period for a Person.","flags":[]},{"name":"person_id","type":"integer","dictType":"integer","required":true,"pk":false,"dictPk":false,"desc":"The Person ID of the PERSON record for which the Observation Period is recorded.","etl":"","flags":[]},{"name":"observation_period_start_date","type":"date","dictType":"date","required":true,"pk":false,"dictPk":false,"desc":"Use this date to determine the start date of the Observation Period.","etl":"It is often the case that the idea of Observation Periods does not exist in source data. In those cases, the observation_period_start_date can be inferred as the earliest Event date available for the Person. In insurance claim data, the Observation Period can be considered as the time period the Person is enrolled with a payer. If a Person switches plans but stays with the same payer, and therefore capturing of data continues, that change would be captured in [PAYER_PLAN_PERIOD](https://ohdsi.github.io/CommonDataModel/cdm54.html#payer_plan_period).","flags":[]},{"name":"observation_period_end_date","type":"date","dictType":"date","required":true,"pk":false,"dictPk":false,"desc":"Use this date to determine the end date of the period for which we can assume that all events for a Person are recorded.","etl":"It is often the case that the idea of Observation Periods does not exist in source data. In those cases, the observation_period_end_date can be inferred as the last Event date available for the Person. In insurance claim data, the Observation Period can be considered as the time period the Person is enrolled with a payer.","flags":[]},{"name":"period_type_concept_id","type":"integer","dictType":"integer","required":true,"pk":false,"dictPk":false,"desc":"This field can be used to determine the provenance of the Observation Period as in whether the period was determined from an insurance enrollment file, EHR healthcare encounters, or other sources.","etl":"Choose the observation_period_type_concept_id that best represents how the period was determined. [Accepted Concepts](https://athena.ohdsi.org/search-terms/terms?domain=Type+Concept&standardConcept=Standard&page=1&pageSize=15&query=). A more detailed explanation of each Type Concept can be found on the [vocabulary wiki](https://github.com/OHDSI/Vocabulary-v5.0/wiki/Vocab.-TYPE_CONCEPT).","flags":[]}],"isLookup":false,"pos":null,"summary":"5 columns, PK observation_period_id. References 2 table(s) incl. CONCEPT via 1 *_concept_id columns.","hub":false},{"id":"payer_plan_period","schema":"CDM","name":"payer_plan_period","area":"econ","description":"The PAYER_PLAN_PERIOD table captures details of the period of time that a Person is continuously enrolled under a specific health Plan benefit structure from a given Payer. Each Person receiving healthcare is typically covered by a health benefit plan, which pays for (fully or partially), or directly provides, the care. These benefit plans are provided by payers, such as health insurances or state or government agencies. In each plan the details of the health benefits are defined for the Person or her family, and the health benefit Plan might change over time typically with increasing utilization (reaching certain cost thresholds such as deductibles), plan availability and purchasing choices of the Person. The unique combinations of Payer organizations, health benefit Plans and time periods in which they are valid for a Person are recorded in this table.","guidance":"A Person can have multiple, overlapping, Payer_Plan_Periods in this table. For example, medical and drug coverage in the US can be represented by two Payer_Plan_Periods. The details of the benefit structure of the Plan is rarely known, the idea is just to identify that the Plans are different.","pk":["payer_plan_period_id"],"columns":[{"name":"payer_plan_period_id","type":"integer","dictType":"integer","required":true,"pk":true,"dictPk":true,"desc":"A unique identifier for each unique combination of a Person, Payer, Plan, and Period of time.","etl":"","flags":[]},{"name":"person_id","type":"integer","dictType":"integer","required":true,"pk":false,"dictPk":false,"desc":"The Person covered by the Plan.","etl":"A single Person can have multiple, overlapping, PAYER_PLAN_PERIOD records","flags":[]},{"name":"payer_plan_period_start_date","type":"date","dictType":"date","required":true,"pk":false,"dictPk":false,"desc":"Start date of Plan coverage.","etl":"","flags":[]},{"name":"payer_plan_period_end_date","type":"date","dictType":"date","required":true,"pk":false,"dictPk":false,"desc":"End date of Plan coverage.","etl":"","flags":[]},{"name":"payer_concept_id","type":"integer","dictType":"integer","required":false,"pk":false,"dictPk":false,"desc":"This field represents the organization who reimburses the provider which administers care to the Person.","etl":"Map the payer directly to a standard CONCEPT_ID with the domain_id of 'Payer' ([Accepted Concepts](https://athena.ohdsi.org/search-terms/terms?domain=Payer&standardConcept=Standard&page=1&pageSize=15&query=)). This vocabulary is not exhaustive so if there is a value missing, please see the [custom concepts](https://ohdsi.github.io/CommonDataModel/customConcepts.html) page.","flags":[]},{"name":"payer_source_value","type":"varchar(50)","dictType":"varchar(50)","required":false,"pk":false,"dictPk":false,"desc":"This is the Payer as it appears in the source data.","etl":"","flags":[]},{"name":"payer_source_concept_id","type":"integer","dictType":"integer","required":false,"pk":false,"dictPk":false,"desc":"If the source data codes the Payer in an OMOP supported vocabulary store the concept_id here.","etl":"If the source data codes the Payer in an OMOP supported vocabulary store the concept_id here.","flags":[],"descFrom":"etlConventions (userGuidance empty)"},{"name":"plan_concept_id","type":"integer","dictType":"integer","required":false,"pk":false,"dictPk":false,"desc":"This field represents the specific health benefit Plan the Person is enrolled in.","etl":"Map the Plan directly to a standard CONCEPT_ID in the 'Plan' vocabulary ([Accepted Concepts](http://athena.ohdsi.org/search-terms/terms?domain=Plan&standardConcept=Standard&page=1&pageSize=15&query=)). This vocabulary is not exhaustive so if there is a value missing, please see the [custom concepts](https://ohdsi.github.io/CommonDataModel/customConcepts.html) page.","flags":[]},{"name":"plan_source_value","type":"varchar(50)","dictType":"varchar(50)","required":false,"pk":false,"dictPk":false,"desc":"This is the health benefit Plan of the Person as it appears in the source data.","etl":"","flags":[]},{"name":"plan_source_concept_id","type":"integer","dictType":"integer","required":false,"pk":false,"dictPk":false,"desc":"If the source data codes the Plan in an OMOP supported vocabulary store the concept_id here.","etl":"If the source data codes the Plan in an OMOP supported vocabulary store the concept_id here.","flags":[],"descFrom":"etlConventions (userGuidance empty)"},{"name":"sponsor_concept_id","type":"integer","dictType":"integer","required":false,"pk":false,"dictPk":false,"desc":"This field represents the sponsor of the Plan who finances the Plan. This includes self-insured, small group health plan and large group health plan.","etl":"Map the sponsor directly to a standard CONCEPT_ID with the domain_id of 'Sponsor' ([Accepted Concepts](https://athena.ohdsi.org/search-terms/terms?domain=Sponsor&standardConcept=Standard&page=1&pageSize=15&query=)). This vocabulary is not exhaustive so if there is a value missing, please see the [custom concepts](https://ohdsi.github.io/CommonDataModel/customConcepts.html) page.","flags":[]},{"name":"sponsor_source_value","type":"varchar(50)","dictType":"varchar(50)","required":false,"pk":false,"dictPk":false,"desc":"The Plan sponsor as it appears in the source data.","etl":"","flags":[]},{"name":"sponsor_source_concept_id","type":"integer","dictType":"integer","required":false,"pk":false,"dictPk":false,"desc":"If the source data codes the sponsor in an OMOP supported vocabulary store the concept_id here.","etl":"If the source data codes the sponsor in an OMOP supported vocabulary store the concept_id here.","flags":[],"descFrom":"etlConventions (userGuidance empty)"},{"name":"family_source_value","type":"varchar(50)","dictType":"varchar(50)","required":false,"pk":false,"dictPk":false,"desc":"The common identifier for all people (often a family) that covered by the same policy.","etl":"Often these are the common digits of the enrollment id of the policy members.","flags":[]},{"name":"stop_reason_concept_id","type":"integer","dictType":"integer","required":false,"pk":false,"dictPk":false,"desc":"This field represents the reason the Person left the Plan, if known.","etl":"Map the stop reason directly to a standard CONCEPT_ID with a domain of 'Plan Stop Reason' ([Accepted Concepts](http://athena.ohdsi.org/search-terms/terms?domain=Plan+Stop+Reason&standardConcept=Standard&page=1&pageSize=15&query=)). If one does not exist visit the [Custom Concepts](https://ohdsi.github.io/CommonDataModel/customConcepts.html) pate for more information.","flags":[]},{"name":"stop_reason_source_value","type":"varchar(50)","dictType":"varchar(50)","required":false,"pk":false,"dictPk":false,"desc":"The Plan stop reason as it appears in the source data.","etl":"","flags":[]},{"name":"stop_reason_source_concept_id","type":"integer","dictType":"integer","required":false,"pk":false,"dictPk":false,"desc":"If the source data codes the stop reason in an OMOP supported vocabulary store the concept_id here.","etl":"If the source data codes the stop reason in an OMOP supported vocabulary store the concept_id here.","flags":[],"descFrom":"etlConventions (userGuidance empty)"}],"isLookup":false,"pos":null,"summary":"17 columns, PK payer_plan_period_id. References 2 table(s) incl. CONCEPT via 8 *_concept_id columns. Referenced by 1 table(s).","hub":false},{"id":"person","schema":"CDM","name":"person","area":"clinical","description":"This table serves as the central identity management for all Persons in the database. It contains records that uniquely identify each person or patient, and some demographic information.","guidance":"All records in this table are independent Persons.","pk":["person_id"],"columns":[{"name":"person_id","type":"integer","dictType":"integer","required":true,"pk":true,"dictPk":true,"desc":"It is assumed that every person with a different unique identifier is in fact a different person and should be treated independently.","etl":"Any person linkage that needs to occur to uniquely identify Persons ought to be done prior to writing this table. This identifier can be the original id from the source data provided if it is an integer, otherwise it can be an autogenerated number.","flags":[]},{"name":"gender_concept_id","type":"integer","dictType":"integer","required":true,"pk":false,"dictPk":false,"desc":"This field is meant to capture the biological sex at birth of the Person. This field should not be used to study gender identity issues.","etl":"Use the gender or sex value present in the data under the assumption that it is the biological sex at birth. If the source data captures gender identity it should be stored in the [OBSERVATION](https://ohdsi.github.io/CommonDataModel/cdm54.html#observation) table. [Accepted gender concepts](http://athena.ohdsi.org/search-terms/terms?domain=Gender&standardConcept=Standard&page=1&pageSize=15&query=). Please refer to the [THEMIS repository](https://ohdsi.github.io/Themis/tag_gender_concept_id.html) for detailed conventions on how to populate this field.","flags":[]},{"name":"year_of_birth","type":"integer","dictType":"integer","required":true,"pk":false,"dictPk":false,"desc":"Compute age using year_of_birth.","etl":"For data sources with date of birth, the year should be extracted. If no year of birth is available all the person's data should be dropped from the CDM instance. For additional information on how to populate this field, please refer to the [THEMIS repository](https://ohdsi.github.io/Themis/tag_year_of_birth.html).","flags":[]},{"name":"month_of_birth","type":"integer","dictType":"integer","required":false,"pk":false,"dictPk":false,"desc":"For data sources that provide the precise date of birth, the month should be extracted and stored in this field.","etl":"For data sources that provide the precise date of birth, the month should be extracted and stored in this field.","flags":[],"descFrom":"etlConventions (userGuidance empty)"},{"name":"day_of_birth","type":"integer","dictType":"integer","required":false,"pk":false,"dictPk":false,"desc":"For data sources that provide the precise date of birth, the day should be extracted and stored in this field.","etl":"For data sources that provide the precise date of birth, the day should be extracted and stored in this field.","flags":[],"descFrom":"etlConventions (userGuidance empty)"},{"name":"birth_datetime","type":"TIMESTAMP","dictType":"datetime","required":false,"pk":false,"dictPk":false,"desc":"This field is not required but highly encouraged. For data sources that provide the precise datetime of birth, that value should be stored in this field. For more information on how to populate this field, please refer to the [THEMIS repository](https://ohdsi.github.io/Themis/person.html).","etl":"This field is not required but highly encouraged. For data sources that provide the precise datetime of birth, that value should be stored in this field. For more information on how to populate this field, please refer to the [THEMIS repository](https://ohdsi.github.io/Themis/person.html).","flags":[],"descFrom":"etlConventions (userGuidance empty)"},{"name":"race_concept_id","type":"integer","dictType":"integer","required":true,"pk":false,"dictPk":false,"desc":"This field captures race or ethnic background of the person.","etl":"Only use this field if you have information about race or ethnic background. The Vocabulary contains Concepts about the main races and ethnic backgrounds in a hierarchical system. Due to the imprecise nature of human races and ethnic backgrounds, this is not a perfect system. Mixed races are not supported. If a clear race or ethnic background cannot be established, use Concept_Id 0. [Accepted Race Concepts](http://athena.ohdsi.org/search-terms/terms?domain=Race&standardConcept=Standard&page=1&pageSize=15&query=).","flags":[]},{"name":"ethnicity_concept_id","type":"integer","dictType":"integer","required":true,"pk":false,"dictPk":false,"desc":"This field captures Ethnicity as defined by the Office of Management and Budget (OMB) of the US Government: it distinguishes only between \"Hispanic\" and \"Not Hispanic\". Races and ethnic backgrounds are not stored here.","etl":"Only use this field if you have US-based data and a source of this information. Do not attempt to infer Ethnicity from the race or ethnic background of the Person. [Accepted ethnicity concepts](http://athena.ohdsi.org/search-terms/terms?domain=Ethnicity&standardConcept=Standard&page=1&pageSize=15&query=)","flags":[]},{"name":"location_id","type":"integer","dictType":"integer","required":false,"pk":false,"dictPk":false,"desc":"The location refers to the physical address of the person. This field should capture the last known location of the person.","etl":"Put the location_id from the [LOCATION](https://ohdsi.github.io/CommonDataModel/cdm54.html#location) table here that represents the most granular location information for the person. For additional information on how to populate this field, please refer to the [THEMIS repository](https://ohdsi.github.io/Themis/populate_person_location_id.html).","flags":[]},{"name":"provider_id","type":"integer","dictType":"integer","required":false,"pk":false,"dictPk":false,"desc":"The Provider refers to the last known primary care provider (General Practitioner).","etl":"Put the provider_id from the [PROVIDER](https://ohdsi.github.io/CommonDataModel/cdm54.html#provider) table of the last known general practitioner of the person. If there are multiple providers, it is up to the ETL to decide which to put here.","flags":[]},{"name":"care_site_id","type":"integer","dictType":"integer","required":false,"pk":false,"dictPk":false,"desc":"The Care Site refers to where the Provider typically provides the primary care.","etl":"","flags":[]},{"name":"person_source_value","type":"varchar(50)","dictType":"varchar(50)","required":false,"pk":false,"dictPk":false,"desc":"Use this field to link back to persons in the source data. This is typically used for error checking of ETL logic.","etl":"Some use cases require the ability to link back to persons in the source data. This field allows for the storing of the person value as it appears in the source. This field is not required but strongly recommended.","flags":[]},{"name":"gender_source_value","type":"varchar(50)","dictType":"varchar(50)","required":false,"pk":false,"dictPk":false,"desc":"This field is used to store the biological sex of the person from the source data. It is not intended for use in standard analytics but for reference only.","etl":"Put the assigned sex at birth of the person as it appears in the source data.","flags":[]},{"name":"gender_source_concept_id","type":"integer","dictType":"integer","required":false,"pk":false,"dictPk":false,"desc":"Due to the small number of options, this tends to be zero.","etl":"If the source data codes assigned sex at birth in a non-standard vocabulary, store the concept_id here.","flags":[]},{"name":"race_source_value","type":"varchar(50)","dictType":"varchar(50)","required":false,"pk":false,"dictPk":false,"desc":"This field is used to store the race of the person from the source data. It is not intended for use in standard analytics but for reference only.","etl":"Put the race of the person as it appears in the source data.","flags":[]},{"name":"race_source_concept_id","type":"integer","dictType":"integer","required":false,"pk":false,"dictPk":false,"desc":"Due to the small number of options, this tends to be zero.","etl":"If the source data codes race in an OMOP supported vocabulary store the concept_id here.","flags":[]},{"name":"ethnicity_source_value","type":"varchar(50)","dictType":"varchar(50)","required":false,"pk":false,"dictPk":false,"desc":"This field is used to store the ethnicity of the person from the source data. It is not intended for use in standard analytics but for reference only.","etl":"If the person has an ethnicity other than the OMB standard of \"Hispanic\" or \"Not Hispanic\" store that value from the source data here.","flags":[]},{"name":"ethnicity_source_concept_id","type":"integer","dictType":"integer","required":false,"pk":false,"dictPk":false,"desc":"Due to the small number of options, this tends to be zero.","etl":"If the source data codes ethnicity in an OMOP supported vocabulary, store the concept_id here.","flags":[]}],"isLookup":false,"pos":null,"summary":"18 columns, PK person_id. References 4 table(s) incl. CONCEPT via 6 *_concept_id columns. Referenced by 17 table(s).","hub":false},{"id":"procedure_occurrence","schema":"CDM","name":"procedure_occurrence","area":"clinical","description":"This table contains records of activities or processes ordered by, or carried out by, a healthcare provider on the patient with a diagnostic or therapeutic purpose.","guidance":"Lab tests are not a procedure, if something is observed with an expected resulting amount and unit then it should be a measurement. Phlebotomy is a procedure but so trivial that it tends to be rarely captured. It can be assumed that there is a phlebotomy procedure associated with many lab tests, therefore it is unnecessary to add them as separate procedures.","pk":["procedure_occurrence_id"],"columns":[{"name":"procedure_occurrence_id","type":"integer","dictType":"integer","required":true,"pk":true,"dictPk":true,"desc":"The unique key given to a procedure record for a person. Refer to the ETL for how duplicate procedures during the same visit were handled.","etl":"Each instance of a procedure occurrence in the source data should be assigned this unique key. In some cases, a person can have multiple records of the same procedure within the same visit. It is valid to keep these duplicates and assign them individual, unique, PROCEDURE_OCCURRENCE_IDs, though it is up to the ETL how they should be handled.","flags":[]},{"name":"person_id","type":"integer","dictType":"integer","required":true,"pk":false,"dictPk":false,"desc":"The PERSON_ID of the PERSON for whom the procedure is recorded. This may be a system generated code.","etl":"","flags":[]},{"name":"procedure_concept_id","type":"integer","dictType":"integer","required":true,"pk":false,"dictPk":false,"desc":"The PROCEDURE_CONCEPT_ID field is recommended for primary use in analyses, and must be used for network studies. This is the standard concept mapped from the source value which represents a procedure","etl":"The standard CONCEPT_ID that represents the PROCEDURE_SOURCE_VALUE. The concept id should be derived either from mapping from the source concept id or by picking the procedure concept representing the most amount of detail you have. Only records whose source values map to standard concepts with a domain of \"Procedure\" should go in this table. [Accepted Concepts](https://athena.ohdsi.org/search-terms/terms?domain=Procedure&standardConcept=Standard&page=1&pageSize=15&query=).","flags":[]},{"name":"procedure_date","type":"date","dictType":"date","required":true,"pk":false,"dictPk":false,"desc":"Use this date to determine the date the procedure started.","etl":"This is meant to be the **start date** of the procedure. It will be renamed in a future version to **PROCEDURE_START_DATE**.","flags":[]},{"name":"procedure_datetime","type":"TIMESTAMP","dictType":"datetime","required":false,"pk":false,"dictPk":false,"desc":"If the procedure has a start time in the native date, use this field to house that information. This will be renamed in a future version to **PROCEDURE_START_DATETIME**.","etl":"If the procedure has a start time in the native date, use this field to house that information. This will be renamed in a future version to **PROCEDURE_START_DATETIME**.","flags":[],"descFrom":"etlConventions (userGuidance empty)"},{"name":"procedure_end_date","type":"date","dictType":"date","required":false,"pk":false,"dictPk":false,"desc":"Use this field to house the date that the procedure ended.","etl":"This is meant to be the end date of the procedure. It is not required and for most cases will be the same as the PROCEDURE_START_DATE.","flags":[]},{"name":"procedure_end_datetime","type":"TIMESTAMP","dictType":"datetime","required":false,"pk":false,"dictPk":false,"desc":"Use this field to house the datetime that the procedure ended.","etl":"This is meant to house the end datetime of the procedure and will most often be used in conjunction with the procedure_start_datetime to determine the length of the procedure.","flags":[]},{"name":"procedure_type_concept_id","type":"integer","dictType":"integer","required":true,"pk":false,"dictPk":false,"desc":"This field can be used to determine the provenance of the Procedure record, as in whether the procedure was from an EHR system, insurance claim, registry, or other sources.","etl":"Choose the PROCEDURE_TYPE_CONCEPT_ID that best represents the provenance of the record, for example whether it came from an EHR record or billing claim. If a procedure is recorded as an EHR encounter, the PROCEDURE_TYPE_CONCEPT would be 'EHR encounter record'. [Accepted Concepts](https://athena.ohdsi.org/search-terms/terms?domain=Type+Concept&standardConcept=Standard&page=1&pageSize=15&query=). A more detailed explanation of each Type Concept can be found on the [vocabulary wiki](https://github.com/OHDSI/Vocabulary-v5.0/wiki/Vocab.-TYPE_CONCEPT).","flags":[]},{"name":"modifier_concept_id","type":"integer","dictType":"integer","required":false,"pk":false,"dictPk":false,"desc":"The modifiers are intended to give additional information about the procedure but as of now the vocabulary is under review.","etl":"It is up to the ETL to choose how to map modifiers if they exist in source data. These concepts are typically distinguished by 'Modifier' concept classes (e.g., 'CPT4 Modifier' as part of the 'CPT4' vocabulary). If there is more than one modifier on a record, one should be chosen that pertains to the procedure rather than provider. [Accepted Concepts](https://athena.ohdsi.org/search-terms/terms?conceptClass=CPT4+Modifier&conceptClass=HCPCS+Modifier&vocabulary=CPT4&vocabulary=HCPCS&standardConcept=Standard&page=1&pageSize=15&query=).","flags":[]},{"name":"quantity","type":"integer","dictType":"integer","required":false,"pk":false,"dictPk":false,"desc":"If the quantity value is omitted, a single procedure is assumed.","etl":"If a Procedure has a quantity of '0' in the source, this should default to '1' in the ETL. If there is a record in the source it can be assumed the exposure occurred at least once","flags":[]},{"name":"provider_id","type":"integer","dictType":"integer","required":false,"pk":false,"dictPk":false,"desc":"The provider associated with the procedure record, e.g. the provider who performed the Procedure.","etl":"The ETL may need to make a choice as to which PROVIDER_ID to put here. Based on what is available this may or may not be different than the provider associated with the overall VISIT_OCCURRENCE record, for example the admitting vs attending physician on an EHR record.","flags":[]},{"name":"visit_occurrence_id","type":"integer","dictType":"integer","required":false,"pk":false,"dictPk":false,"desc":"The visit during which the procedure occurred.","etl":"Depending on the structure of the source data, this may have to be determined based on dates. If a PROCEDURE_DATE occurs within the start and end date of a Visit it is a valid ETL choice to choose the VISIT_OCCURRENCE_ID from the Visit that subsumes it, even if not explicitly stated in the data. While not required, an attempt should be made to locate the VISIT_OCCURRENCE_ID of the PROCEDURE_OCCURRENCE record.","flags":[]},{"name":"visit_detail_id","type":"integer","dictType":"integer","required":false,"pk":false,"dictPk":false,"desc":"The VISIT_DETAIL record during which the Procedure occurred. For example, if the Person was in the ICU at the time of the Procedure the VISIT_OCCURRENCE record would reflect the overall hospital stay and the VISIT_DETAIL record would reflect the ICU stay during the hospital visit.","etl":"Same rules apply as for the VISIT_OCCURRENCE_ID.","flags":[]},{"name":"procedure_source_value","type":"varchar(50)","dictType":"varchar(50)","required":false,"pk":false,"dictPk":false,"desc":"This field houses the verbatim value from the source data representing the procedure that occurred. For example, this could be an CPT4 or OPCS4 code.","etl":"Use this value to look up the source concept id and then map the source concept id to a standard concept id.","flags":[]},{"name":"procedure_source_concept_id","type":"integer","dictType":"integer","required":false,"pk":false,"dictPk":false,"desc":"This is the concept representing the procedure source value and may not necessarily be standard. This field is discouraged from use in analysis because it is not required to contain Standard Concepts that are used across the OHDSI community, and should only be used when Standard Concepts do not adequately represent the source detail for the Procedure necessary for a given analytic use case. Consider using PROCEDURE_CONCEPT_ID instead to enable standardized analytics that can be consistent across the network.","etl":"If the PROCEDURE_SOURCE_VALUE is coded in the source data using an OMOP supported vocabulary put the concept id representing the source value here.","flags":[]},{"name":"modifier_source_value","type":"varchar(50)","dictType":"varchar(50)","required":false,"pk":false,"dictPk":false,"desc":"This field houses the verbatim value from the source data representing the modifier code for the procedure that occurred.","etl":"The value stored here is mapped to a MODIFIER_CONCEPT_ID.","flags":[]}],"isLookup":false,"pos":null,"summary":"16 columns, PK procedure_occurrence_id. References 5 table(s) incl. CONCEPT via 4 *_concept_id columns. Referenced by 4 table(s).","hub":false},{"id":"provider","schema":"CDM","name":"provider","area":"system","description":"The PROVIDER table contains a list of uniquely identified healthcare providers; duplication is not allowed. These are individuals providing hands-on healthcare to patients, such as physicians, nurses, midwives, physical therapists etc.","guidance":"Many sources do not make a distinction between individual and institutional providers. The PROVIDER table contains the individual providers. If the source only provides limited information such as specialty instead of uniquely identifying individual providers, generic or 'pooled' Provider records are listed in the PROVIDER table.","pk":["provider_id"],"columns":[{"name":"provider_id","type":"integer","dictType":"integer","required":true,"pk":true,"dictPk":true,"desc":"It is assumed that every provider with a different unique identifier is in fact a different person and should be treated independently.","etl":"This identifier can be the original id from the source data provided it is an integer, otherwise it can be an autogenerated number.","flags":[]},{"name":"provider_name","type":"varchar(255)","dictType":"varchar(255)","required":false,"pk":false,"dictPk":false,"desc":"This field contains information that describes a healthcare provider.","etl":"This field is not required for identifying the Provider's actual identity. Instead, its purpose is to uniquely and/or anonymously identify providers of care across the database.","flags":[]},{"name":"npi","type":"varchar(20)","dictType":"varchar(20)","required":false,"pk":false,"dictPk":false,"desc":"This is the National Provider Number issued to health care providers in the US by the Centers for Medicare and Medicaid Services (CMS).","etl":"","flags":[]},{"name":"dea","type":"varchar(20)","dictType":"varchar(20)","required":false,"pk":false,"dictPk":false,"desc":"This is the identifier issued by the DEA, a US federal agency, that allows a provider to write prescriptions for controlled substances.","etl":"","flags":[]},{"name":"specialty_concept_id","type":"integer","dictType":"integer","required":false,"pk":false,"dictPk":false,"desc":"This field either represents the most common specialty that occurs in the data or the most specific concept that represents all specialties listed, should the provider have more than one. This includes physician specialties such as internal medicine, emergency medicine, etc. and allied health professionals such as nurses, midwives, and pharmacists.","etl":"If a Provider has more than one Specialty, there are two options: 1. Choose a concept_id which is a common ancestor to the multiple specialties, or, 2. Choose the specialty that occurs most often for the provider. Concepts in this field should be Standard with a domain of Provider. [Accepted Concepts](http://athena.ohdsi.org/search-terms/terms?domain=Provider&standardConcept=Standard&page=1&pageSize=15&query=).","flags":[]},{"name":"care_site_id","type":"integer","dictType":"integer","required":false,"pk":false,"dictPk":false,"desc":"This is the CARE_SITE_ID for the location that the provider primarily practices in.","etl":"If a Provider has more than one Care Site, the main or most often exerted CARE_SITE_ID should be recorded.","flags":[]},{"name":"year_of_birth","type":"integer","dictType":"integer","required":false,"pk":false,"dictPk":false,"desc":"","etl":"","flags":[]},{"name":"gender_concept_id","type":"integer","dictType":"integer","required":false,"pk":false,"dictPk":false,"desc":"This field represents the recorded gender of the provider in the source data.","etl":"If given, put a concept from the gender domain representing the recorded gender of the provider. [Accepted Concepts](http://athena.ohdsi.org/search-terms/terms?domain=Gender&standardConcept=Standard&page=1&pageSize=15&query=).","flags":[]},{"name":"provider_source_value","type":"varchar(50)","dictType":"varchar(50)","required":false,"pk":false,"dictPk":false,"desc":"Use this field to link back to providers in the source data. This is typically used for error checking of ETL logic.","etl":"Some use cases require the ability to link back to providers in the source data. This field allows for the storing of the provider identifier as it appears in the source.","flags":[]},{"name":"specialty_source_value","type":"varchar(50)","dictType":"varchar(50)","required":false,"pk":false,"dictPk":false,"desc":"This refers to the specific type of healthcare provider or field of expertise listed in the source data, encompassing physician specialties like internal medicine, emergency medicine, etc., as well as allied health professionals such as nurses, midwives, and pharmacists. It covers medical specialties like surgery, internal medicine, and radiology, while other services like prosthetics, acupuncture, and physical therapy fall under the domain of \"Service.\"","etl":"The type of provider and their specialty should be entered as they appear in the source data. The decision to use either the coded value or the text description is left to the discretion of the ETL-er.","flags":[]},{"name":"specialty_source_concept_id","type":"integer","dictType":"integer","required":false,"pk":false,"dictPk":false,"desc":"This is often zero as many sites use proprietary codes to store physician speciality.","etl":"If the source data codes provider specialty in an OMOP supported vocabulary store the concept_id here.","flags":[]},{"name":"gender_source_value","type":"varchar(50)","dictType":"varchar(50)","required":false,"pk":false,"dictPk":false,"desc":"This is provider's gender as it appears in the source data.","etl":"Put the provider's gender as it appears in the source data. This field is up to the discretion of the ETL-er as to whether this should be the coded value from the source or the text description of the lookup value.","flags":[]},{"name":"gender_source_concept_id","type":"integer","dictType":"integer","required":false,"pk":false,"dictPk":false,"desc":"This is often zero as many sites use proprietary codes to store provider gender.","etl":"If the source data codes provider gender in an OMOP supported vocabulary store the concept_id here.","flags":[]}],"isLookup":false,"pos":null,"summary":"13 columns, PK provider_id. References 2 table(s) incl. CONCEPT via 4 *_concept_id columns. Referenced by 10 table(s).","hub":false},{"id":"relationship","schema":"VOCAB","name":"relationship","area":"vocab","description":"The RELATIONSHIP table provides a reference list of all types of relationships that can be used to associate any two Concepts in the CONCEPT_RELATIONSHIP table, the respective reverse relationships, and their hierarchical characteristics. Note, that Concepts representing relationships between the clinical facts, used for filling in the FACT_RELATIONSHIP table are stored in the CONCEPT table and belong to the Relationship Domain.","guidance":"Users can leverage the RELATIONSHIP table to explore the full list of direct and reverse relationships within the OMOP vocabulary system. Also, users can get insight into how these relationships can be used in ETL, cohort creation, and other tasks according to their ancestral characteristics.","pk":["relationship_id"],"columns":[{"name":"relationship_id","type":"varchar(20)","dictType":"varchar(20)","required":true,"pk":true,"dictPk":true,"desc":"The type of relationship captured by the\nrelationship record.","etl":"","flags":[]},{"name":"relationship_name","type":"varchar(255)","dictType":"varchar(255)","required":true,"pk":false,"dictPk":false,"desc":"","etl":"","flags":[]},{"name":"is_hierarchical","type":"varchar(1)","dictType":"varchar(1)","required":true,"pk":false,"dictPk":false,"desc":"Defines whether a relationship defines\nconcepts into classes or hierarchies. Values\nare 1 for hierarchical relationship or 0 if not.","etl":"","flags":[]},{"name":"defines_ancestry","type":"varchar(1)","dictType":"varchar(1)","required":true,"pk":false,"dictPk":false,"desc":"Defines whether a hierarchical relationship\ncontributes to the concept_ancestor table.\nThese are subsets of the hierarchical\nrelationships. Valid values are 1 or 0.","etl":"","flags":[]},{"name":"reverse_relationship_id","type":"varchar(20)","dictType":"varchar(20)","required":true,"pk":false,"dictPk":false,"desc":"The identifier for the relationship used to\ndefine the reverse relationship between two\nconcepts.","etl":"","flags":[]},{"name":"relationship_concept_id","type":"integer","dictType":"integer","required":true,"pk":false,"dictPk":false,"desc":"A foreign key that refers to an identifier in\nthe [CONCEPT](https://ohdsi.github.io/CommonDataModel/cdm54.html#concept) table for the unique\nrelationship concept.","etl":"","flags":[]}],"isLookup":true,"pos":null,"summary":"6 columns, PK relationship_id. References 1 table(s) incl. CONCEPT via 1 *_concept_id columns. Referenced by 1 table(s).","hub":false},{"id":"source_to_concept_map","schema":"VOCAB","name":"source_to_concept_map","area":"vocab","description":"The source to concept map table is recommended for use in ETL processes to maintain local source codes which are not available as Concepts in the Standardized Vocabularies, and to establish mappings for each source code into a Standard Concept as target_concept_ids that can be used to populate the Common Data Model tables. The SOURCE_TO_CONCEPT_MAP table is no longer populated with content within the Standardized Vocabularies published to the OMOP community. **There are OHDSI tools to help you populate this table; [Usagi](https://github.com/OHDSI/Usagi) and [Perseus](https://github.com/ohdsi/Perseus). You can read more about OMOP vocabulary mapping in [The Book of OHDSI Chapter 6.3](https://ohdsi.github.io/TheBookOfOhdsi/ExtractTransformLoad.html#step-2-create-the-code-mappings).**","guidance":"","pk":[],"columns":[{"name":"source_code","type":"varchar(50)","dictType":"varchar(50)","required":true,"pk":false,"dictPk":false,"desc":"The source code being translated\ninto a Standard Concept.","etl":"","flags":[]},{"name":"source_concept_id","type":"integer","dictType":"integer","required":true,"pk":false,"dictPk":false,"desc":"A foreign key to the Source\nConcept that is being translated\ninto a Standard Concept.","etl":"This is either 0 or should be a number above 2 billion, which are the Concepts reserved for site-specific codes and mappings.","flags":[]},{"name":"source_vocabulary_id","type":"varchar(20)","dictType":"varchar(20)","required":true,"pk":false,"dictPk":false,"desc":"A foreign key to the\nVOCABULARY table defining the\nvocabulary of the source code that\nis being translated to a Standard\nConcept.","etl":"","flags":[]},{"name":"source_code_description","type":"varchar(255)","dictType":"varchar(255)","required":false,"pk":false,"dictPk":false,"desc":"An optional description for the\nsource code. This is included as a\nconvenience to compare the\ndescription of the source code to\nthe name of the concept.","etl":"","flags":[]},{"name":"target_concept_id","type":"integer","dictType":"integer","required":true,"pk":false,"dictPk":false,"desc":"The target Concept\nto which the source code is being\nmapped.","etl":"","flags":[]},{"name":"target_vocabulary_id","type":"varchar(20)","dictType":"varchar(20)","required":true,"pk":false,"dictPk":false,"desc":"The Vocabulary of the target Concept.","etl":"","flags":[]},{"name":"valid_start_date","type":"date","dictType":"date","required":true,"pk":false,"dictPk":false,"desc":"The date when the mapping\ninstance was first recorded.","etl":"","flags":[]},{"name":"valid_end_date","type":"date","dictType":"date","required":true,"pk":false,"dictPk":false,"desc":"The date when the mapping\ninstance became invalid because it\nwas deleted or superseded\n(updated) by a new relationship.\nDefault value is 31-Dec-2099.","etl":"","flags":[]},{"name":"invalid_reason","type":"varchar(1)","dictType":"varchar(1)","required":false,"pk":false,"dictPk":false,"desc":"Reason the mapping instance was invalidated. Possible values are D (deleted), U (replaced with an update) or NULL when valid_end_date has the default value.","etl":"","flags":[]}],"isLookup":true,"pos":null,"summary":"9 columns, PK none. References 2 table(s) incl. CONCEPT via 2 *_concept_id columns.","hub":false},{"id":"specimen","schema":"CDM","name":"specimen","area":"clinical","description":"The specimen domain contains the records identifying biological samples from a person.","guidance":"","pk":["specimen_id"],"columns":[{"name":"specimen_id","type":"integer","dictType":"integer","required":true,"pk":true,"dictPk":true,"desc":"Unique identifier for each specimen.","etl":"","flags":[]},{"name":"person_id","type":"integer","dictType":"integer","required":true,"pk":false,"dictPk":false,"desc":"The person from whom the specimen is collected.","etl":"","flags":[]},{"name":"specimen_concept_id","type":"integer","dictType":"integer","required":true,"pk":false,"dictPk":false,"desc":"The standard CONCEPT_ID that the SPECIMEN_SOURCE_VALUE maps to in the specimen domain. [Accepted Concepts](https://athena.ohdsi.org/search-terms/terms?domain=Specimen&standardConcept=Standard&page=1&pageSize=15&query=)","etl":"The standard CONCEPT_ID that the SPECIMEN_SOURCE_VALUE maps to in the specimen domain. [Accepted Concepts](https://athena.ohdsi.org/search-terms/terms?domain=Specimen&standardConcept=Standard&page=1&pageSize=15&query=)","flags":[],"descFrom":"etlConventions (userGuidance empty)"},{"name":"specimen_type_concept_id","type":"integer","dictType":"integer","required":true,"pk":false,"dictPk":false,"desc":"Put the source of the specimen record, as in an EHR system. [Accepted Concepts](https://athena.ohdsi.org/search-terms/terms?standardConcept=Standard&domain=Type+Concept&page=1&pageSize=15&query=). A more detailed explanation of each Type Concept can be found on the [vocabulary wiki](https://github.com/OHDSI/Vocabulary-v5.0/wiki/Vocab.-TYPE_CONCEPT).","etl":"Put the source of the specimen record, as in an EHR system. [Accepted Concepts](https://athena.ohdsi.org/search-terms/terms?standardConcept=Standard&domain=Type+Concept&page=1&pageSize=15&query=). A more detailed explanation of each Type Concept can be found on the [vocabulary wiki](https://github.com/OHDSI/Vocabulary-v5.0/wiki/Vocab.-TYPE_CONCEPT).","flags":[],"descFrom":"etlConventions (userGuidance empty)"},{"name":"specimen_date","type":"date","dictType":"date","required":true,"pk":false,"dictPk":false,"desc":"The date the specimen was collected.","etl":"","flags":[]},{"name":"specimen_datetime","type":"TIMESTAMP","dictType":"datetime","required":false,"pk":false,"dictPk":false,"desc":"","etl":"","flags":[]},{"name":"quantity","type":"NUMERIC","dictType":"float","required":false,"pk":false,"dictPk":false,"desc":"The amount of specimen collected from the person.","etl":"","flags":[]},{"name":"unit_concept_id","type":"integer","dictType":"integer","required":false,"pk":false,"dictPk":false,"desc":"The unit for the quantity of the specimen.","etl":"Map the UNIT_SOURCE_VALUE to a Standard Concept in the Unit domain. [Accepted Concepts](https://athena.ohdsi.org/search-terms/terms?domain=Unit&standardConcept=Standard&page=1&pageSize=15&query=). If the source unit is NULL (applicable to cases when there's no numerical value or when it doesn't require a unit), keep unit_concept_id NULL as well. If there's no mapping of a source unit, populate unit_concept_id with 0.","flags":[]},{"name":"anatomic_site_concept_id","type":"integer","dictType":"integer","required":false,"pk":false,"dictPk":false,"desc":"This is the site on the body where the specimen is from.","etl":"Map the ANATOMIC_SITE_SOURCE_VALUE to a Standard Concept in the Spec Anatomic Site domain. This should be coded at the lowest level of granularity [Accepted Concepts](https://athena.ohdsi.org/search-terms/terms?standardConcept=Standard&domain=Spec+Anatomic+Site&conceptClass=Body+Structure&page=4&pageSize=15&query=)","flags":[]},{"name":"disease_status_concept_id","type":"integer","dictType":"integer","required":false,"pk":false,"dictPk":false,"desc":"","etl":"","flags":[]},{"name":"specimen_source_id","type":"varchar(50)","dictType":"varchar(50)","required":false,"pk":false,"dictPk":false,"desc":"This is the identifier for the specimen from the source system.","etl":"","flags":[]},{"name":"specimen_source_value","type":"varchar(50)","dictType":"varchar(50)","required":false,"pk":false,"dictPk":false,"desc":"","etl":"","flags":[]},{"name":"unit_source_value","type":"varchar(50)","dictType":"varchar(50)","required":false,"pk":false,"dictPk":false,"desc":"This unit for the quantity of the specimen, as represented in the source.","etl":"This unit for the quantity of the specimen, as represented in the source.","flags":[],"descFrom":"etlConventions (userGuidance empty)"},{"name":"anatomic_site_source_value","type":"varchar(50)","dictType":"varchar(50)","required":false,"pk":false,"dictPk":false,"desc":"This is the site on the body where the specimen was taken from, as represented in the source.","etl":"This is the site on the body where the specimen was taken from, as represented in the source.","flags":[],"descFrom":"etlConventions (userGuidance empty)"},{"name":"disease_status_source_value","type":"varchar(50)","dictType":"varchar(50)","required":false,"pk":false,"dictPk":false,"desc":"","etl":"","flags":[]}],"isLookup":false,"pos":null,"summary":"15 columns, PK specimen_id. References 2 table(s) incl. CONCEPT via 5 *_concept_id columns.","hub":false},{"id":"visit_detail","schema":"CDM","name":"visit_detail","area":"clinical","description":"The VISIT_DETAIL table is an optional table used to represents details of each record in the parent VISIT_OCCURRENCE table. A good example of this would be the movement between units in a hospital during an inpatient stay or claim lines associated with a one insurance claim. For every record in the VISIT_OCCURRENCE table there may be 0 or more records in the VISIT_DETAIL table with a 1:n relationship where n may be 0. The VISIT_DETAIL table is structurally very similar to VISIT_OCCURRENCE table and belongs to the visit domain.","guidance":"The configuration defining the Visit Detail is described by Concepts in the Visit Domain, which form a hierarchical structure. The Visit Detail record will have an associated to the Visit Occurrence record in two ways: <br> 1. The Visit Detail record will have the VISIT_OCCURRENCE_ID it is associated to 2. The VISIT_DETAIL_CONCEPT_ID  will be a descendant of the VISIT_CONCEPT_ID for the Visit.","pk":["visit_detail_id"],"columns":[{"name":"visit_detail_id","type":"integer","dictType":"integer","required":true,"pk":true,"dictPk":true,"desc":"Use this to identify unique interactions between a person and the health care system. This identifier links across the other CDM event tables to associate events with a visit detail.","etl":"This should be populated by creating a unique identifier for each unique interaction between a person and the healthcare system where the person receives a medical good or service over a span of time.","flags":[]},{"name":"person_id","type":"integer","dictType":"integer","required":true,"pk":false,"dictPk":false,"desc":"","etl":"","flags":[]},{"name":"visit_detail_concept_id","type":"integer","dictType":"integer","required":true,"pk":false,"dictPk":false,"desc":"This field contains a concept id representing the kind of visit detail, like inpatient or outpatient. All concepts in this field should be standard and belong to the Visit domain.","etl":"Populate this field based on the kind of visit that took place for the person. For example this could be \"Inpatient Visit\", \"Outpatient Visit\", \"Ambulatory Visit\", etc. This table will contain standard concepts in the Visit domain. These concepts are arranged in a hierarchical structure to facilitate cohort definitions by rolling up to generally familiar Visits adopted in most healthcare systems worldwide. [Accepted Concepts](https://athena.ohdsi.org/search-terms/terms?domain=Visit&standardConcept=Standard&page=1&pageSize=15&query=).","flags":[]},{"name":"visit_detail_start_date","type":"date","dictType":"date","required":true,"pk":false,"dictPk":false,"desc":"This is the date of the start of the encounter. This may or may not be equal to the date of the Visit the Visit Detail is associated with.","etl":"When populating VISIT_DETAIL_START_DATE, you should think about the patient experience to make decisions on how to define visits. Most likely this should be the date of the patient-provider interaction.","flags":[]},{"name":"visit_detail_start_datetime","type":"TIMESTAMP","dictType":"datetime","required":false,"pk":false,"dictPk":false,"desc":"If no time is given for the start date of a visit, set to NULL.","etl":"If no time is given for the start date of a visit, set to NULL.","flags":[],"descFrom":"etlConventions (userGuidance empty)"},{"name":"visit_detail_end_date","type":"date","dictType":"date","required":true,"pk":false,"dictPk":false,"desc":"This the end date of the patient-provider interaction.  If a Person is still an inpatient in the hospital at the time of the data extract and does not have a visit_end_date, then set the visit_end_date to the date of the data pull.","etl":"Visit Detail end dates are mandatory. If end dates are not provided in the source there are three ways in which to derive them:<br>\n- Outpatient Visit Detail: visit_detail_end_datetime = visit_detail_start_datetime\n- Emergency Room Visit Detail: visit_detail_end_datetime = visit_detail_start_datetime\n- Inpatient Visit Detail: Usually there is information about discharge. If not, you should be able to derive the end date from the sudden decline of activity or from the absence of inpatient procedures/drugs.\n- Non-hospital institution Visit Details: Particularly for claims data, if end dates are not provided assume the visit is for the duration of month that it occurs.<br>\nFor Inpatient Visit Details ongoing at the date of ETL, put date of processing the data into visit_detai_end_datetime and visit_detail_type_concept_id with 32220 \"Still patient\" to identify the visit as incomplete.\nAll other Visits Details: visit_detail_end_datetime = visit_detail_start_datetime.","flags":[]},{"name":"visit_detail_end_datetime","type":"TIMESTAMP","dictType":"datetime","required":false,"pk":false,"dictPk":false,"desc":"If a Person is still an inpatient in the hospital at the time of the data extract and does not have a visit_end_datetime, then set the visit_end_datetime to the datetime of the data pull.","etl":"If no time is given for the end date of a visit, set to NULL.","flags":[]},{"name":"visit_detail_type_concept_id","type":"integer","dictType":"integer","required":true,"pk":false,"dictPk":false,"desc":"Use this field to understand the provenance of the visit detail record, or where the record comes from.","etl":"Populate this field based on the provenance of the visit detail record, as in whether it came from an EHR record or billing claim. [Accepted Concepts](https://athena.ohdsi.org/search-terms/terms?domain=Type+Concept&standardConcept=Standard&page=1&pageSize=15&query=). A more detailed explanation of each Type Concept can be found on the [vocabulary wiki](https://github.com/OHDSI/Vocabulary-v5.0/wiki/Vocab.-TYPE_CONCEPT).","flags":[]},{"name":"provider_id","type":"integer","dictType":"integer","required":false,"pk":false,"dictPk":false,"desc":"There will only be one provider per  **visit** record and the ETL document should clearly state how they were chosen (attending, admitting, etc.). This is a typical reason for leveraging the VISIT_DETAIL table as even though each VISIT_DETAIL record can only have one provider, there is no limit to the number of VISIT_DETAIL records that can be associated to a VISIT_OCCURRENCE record.","etl":"The additional providers associated to a Visit can be stored in this table where each VISIT_DETAIL record represents a different provider.","flags":[]},{"name":"care_site_id","type":"integer","dictType":"integer","required":false,"pk":false,"dictPk":false,"desc":"This field provides information about the Care Site where the Visit Detail took place.","etl":"There should only be one Care Site associated with a Visit Detail.","flags":[]},{"name":"visit_detail_source_value","type":"varchar(50)","dictType":"varchar(50)","required":false,"pk":false,"dictPk":false,"desc":"This field houses the verbatim value from the source data representing the kind of visit detail that took place (inpatient, outpatient, emergency, etc.)","etl":"If there is information about the kind of visit detail in the source data that value should be stored here. If a visit is an amalgamation of visits from the source then use a hierarchy to choose the VISIT_DETAIL_SOURCE_VALUE, such as IP -> ER-> OP. This should line up with the logic chosen to determine how visits are created.","flags":[]},{"name":"visit_detail_source_concept_id","type":"integer","dictType":"integer","required":false,"pk":false,"dictPk":false,"desc":"If the VISIT_DETAIL_SOURCE_VALUE is coded in the source data using an OMOP supported vocabulary put the concept id representing the source value here.","etl":"If the VISIT_DETAIL_SOURCE_VALUE is coded in the source data using an OMOP supported vocabulary put the concept id representing the source value here.","flags":[],"descFrom":"etlConventions (userGuidance empty)"},{"name":"admitted_from_concept_id","type":"integer","dictType":"integer","required":false,"pk":false,"dictPk":false,"desc":"Use this field to determine where the patient was admitted from. This concept is part of the visit domain and can indicate if a patient was admitted to the hospital from a long-term care facility, for example.","etl":"If available, map the admitted_from_source_value to a standard concept in the visit domain. [Accepted Concepts](https://athena.ohdsi.org/search-terms/terms?domain=Visit&standardConcept=Standard&page=1&pageSize=15&query=). If a person was admitted from home or was self-referred, set this to 0.","flags":[]},{"name":"admitted_from_source_value","type":"varchar(50)","dictType":"varchar(50)","required":false,"pk":false,"dictPk":false,"desc":"This information may be called something different in the source data but the field is meant to contain a value indicating where a person was admitted from. Typically this applies only to visits that have a length of stay, like inpatient visits or long-term care visits.","etl":"This information may be called something different in the source data but the field is meant to contain a value indicating where a person was admitted from. Typically this applies only to visits that have a length of stay, like inpatient visits or long-term care visits.","flags":[],"descFrom":"etlConventions (userGuidance empty)"},{"name":"discharged_to_source_value","type":"varchar(50)","dictType":"varchar(50)","required":false,"pk":false,"dictPk":false,"desc":"This information may be called something different in the source data but the field is meant to contain a value indicating where a person was discharged to after a visit, as in they went home or were moved to long-term care. Typically this applies only to visits that have a length of stay of a day or more.","etl":"This information may be called something different in the source data but the field is meant to contain a value indicating where a person was discharged to after a visit, as in they went home or were moved to long-term care. Typically this applies only to visits that have a length of stay of a day or more.","flags":[],"descFrom":"etlConventions (userGuidance empty)"},{"name":"discharged_to_concept_id","type":"integer","dictType":"integer","required":false,"pk":false,"dictPk":false,"desc":"Use this field to determine where the patient was discharged to after a visit. This concept is part of the visit domain and can indicate if a patient was transferred to another hospital or sent to a long-term care facility, for example.  It is assumed that a person is discharged to home therefore there is not a standard concept id for \"home\".  Use concept id = 0 when a person is discharged to home.","etl":"If available, map the DISCHARGE_TO_SOURCE_VALUE to a Standard Concept in the Visit domain. [Accepted Concepts](https://athena.ohdsi.org/search-terms/terms?domain=Visit&standardConcept=Standard&page=1&pageSize=15&query=).","flags":[]},{"name":"preceding_visit_detail_id","type":"integer","dictType":"integer","required":false,"pk":false,"dictPk":false,"desc":"Use this field to find the visit detail that occurred for the person prior to the given visit detail record. There could be a few days or a few years in between.","etl":"The PRECEDING_VISIT_DETAIL_ID can be used to link a visit immediately preceding the current Visit Detail. Note this is not symmetrical, and there is no such thing as a \"following_visit_id\".","flags":[]},{"name":"parent_visit_detail_id","type":"integer","dictType":"integer","required":false,"pk":false,"dictPk":false,"desc":"Use this field to find the visit detail that subsumes the given visit detail record. This is used in the case that a visit detail record needs to be nested beyond the VISIT_OCCURRENCE/VISIT_DETAIL relationship.","etl":"If there are multiple nested levels to how Visits are represented in the source, the VISIT_DETAIL_PARENT_ID can be used to record this relationship.","flags":[]},{"name":"visit_occurrence_id","type":"integer","dictType":"integer","required":true,"pk":false,"dictPk":false,"desc":"Use this field to link the VISIT_DETAIL record to its VISIT_OCCURRENCE.","etl":"Put the VISIT_OCCURRENCE_ID that subsumes the VISIT_DETAIL record here.","flags":[]}],"isLookup":false,"pos":null,"summary":"19 columns, PK visit_detail_id. References 5 table(s) incl. CONCEPT via 5 *_concept_id columns. Referenced by 7 table(s).","hub":false},{"id":"visit_occurrence","schema":"CDM","name":"visit_occurrence","area":"clinical","description":"This table contains Events where Persons engage with the healthcare system for a duration of time. They are often also called \"Encounters\". Visits are defined by a configuration of circumstances under which they occur, such as (i) whether the patient comes to a healthcare institution, the other way around, or the interaction is remote, (ii) whether and what kind of trained medical staff is delivering the service during the Visit, and (iii) whether the Visit is transient or for a longer period involving a stay in bed.","guidance":"The configuration defining the Visit are described by Concepts in the Visit Domain, which form a hierarchical structure, but rolling up to generally familiar Visits adopted in most healthcare systems worldwide:\n\n- [Inpatient Visit](https://athena.ohdsi.org/search-terms/terms/9201): Person visiting hospital, at a Care Site, in bed, for duration of more than one day, with physicians and other Providers permanently available to deliver service around the clock\n- [Emergency Room Visit](https://athena.ohdsi.org/search-terms/terms/9203): Person visiting dedicated healthcare institution for treating emergencies, at a Care Site, within one day, with physicians and Providers permanently available to deliver service around the clock\n- [Emergency Room and Inpatient Visit](https://athena.ohdsi.org/search-terms/terms/262): Person visiting ER followed by a subsequent Inpatient Visit, where Emergency department is part of hospital, and transition from the ER to other hospital departments is undefined\n- [Non-hospital institution Visit](https://athena.ohdsi.org/search-terms/terms/42898160): Person visiting dedicated institution for reasons of poor health, at a Care Site, long-term or permanently, with no physician but possibly other Providers permanently available to deliver service around the clock\n- [Outpatient Visit](https://athena.ohdsi.org/search-terms/terms/9202): Person visiting dedicated ambulatory healthcare institution, at a Care Site, within one day, with physicians or medical Providers delivering service during Visit\n- [Home Visit](https://athena.ohdsi.org/search-terms/terms/581476): Provider visiting Person, without a Care Site, within one day, delivering service\n- [Telehealth Visit](https://athena.ohdsi.org/search-terms/terms/722455): Patient engages with Provider through communication media\n- [Pharmacy Visit](https://athena.ohdsi.org/search-terms/terms/581458): Person visiting pharmacy for dispensing of Drug, at a Care Site, within one day\n- [Laboratory Visit](https://athena.ohdsi.org/search-terms/terms/32036): Patient visiting dedicated institution, at a Care Site, within one day, for the purpose of a Measurement.\n- [Ambulance Visit](https://athena.ohdsi.org/search-terms/terms/581478): Person using transportation service for the purpose of initiating one of the other Visits, without a Care Site, within one day, potentially with Providers accompanying the Visit and delivering service\n- [Case Management Visit](https://athena.ohdsi.org/search-terms/terms/38004193): Person interacting with healthcare system, without a Care Site, within a day, with no Providers involved, for administrative purposes\n\nThe Visit duration, or 'length of stay', is defined as VISIT_END_DATE - VISIT_START_DATE. For all Visits this is <1 day, except Inpatient Visits and Non-hospital institution Visits. The CDM also contains the VISIT_DETAIL table where additional information about the Visit is stored, for example, transfers between units during an inpatient Visit.","pk":["visit_occurrence_id"],"columns":[{"name":"visit_occurrence_id","type":"integer","dictType":"integer","required":true,"pk":true,"dictPk":true,"desc":"Use this to identify unique interactions between a person and the health care system. This identifier links across the other CDM event tables to associate events with a visit.","etl":"This should be populated by creating a unique identifier for each unique interaction between a person and the healthcare system where the person receives a medical good or service over a span of time.","flags":[]},{"name":"person_id","type":"integer","dictType":"integer","required":true,"pk":false,"dictPk":false,"desc":"","etl":"","flags":[]},{"name":"visit_concept_id","type":"integer","dictType":"integer","required":true,"pk":false,"dictPk":false,"desc":"This field contains a concept id representing the kind of visit, like inpatient or outpatient. All concepts in this field should be standard and belong to the Visit domain.","etl":"Populate this field based on the kind of visit that took place for the person. For example this could be \"Inpatient Visit\", \"Outpatient Visit\", \"Ambulatory Visit\", etc. This table will contain standard concepts in the Visit domain. These concepts are arranged in a hierarchical structure to facilitate cohort definitions by rolling up to generally familiar Visits adopted in most healthcare systems worldwide. [Accepted Concepts](https://athena.ohdsi.org/search-terms/terms?domain=Visit&standardConcept=Standard&page=1&pageSize=15&query=).","flags":[]},{"name":"visit_start_date","type":"date","dictType":"date","required":true,"pk":false,"dictPk":false,"desc":"For inpatient visits, the start date is typically the admission date. For outpatient visits the start date and end date will be the same.","etl":"When populating VISIT_START_DATE, you should think about the patient experience to make decisions on how to define visits. In the case of an inpatient visit this should be the date the patient was admitted to the hospital or institution. In all other cases this should be the date of the patient-provider interaction.  If this information is not available the record should be dropped.","flags":[]},{"name":"visit_start_datetime","type":"TIMESTAMP","dictType":"datetime","required":false,"pk":false,"dictPk":false,"desc":"If no time is given for the start date of a visit, set to NULL.","etl":"If no time is given for the start date of a visit, set to NULL.","flags":[],"descFrom":"etlConventions (userGuidance empty)"},{"name":"visit_end_date","type":"date","dictType":"date","required":true,"pk":false,"dictPk":false,"desc":"For inpatient visits the end date is typically the discharge date.  If a Person is still an inpatient in the hospital at the time of the data extract and does not have a visit_end_date, then set the visit_end_date to the date of the data pull.","etl":"Visit end dates are mandatory. If end dates are not provided in the source there are three ways in which to derive them:\n\n- Outpatient Visit: visit_end_datetime = visit_start_datetime\n- Emergency Room Visit: visit_end_datetime = visit_start_datetime\n- Inpatient Visit: Usually there is information about discharge. If not, you should be able to derive the end date from the sudden decline of activity or from the absence of inpatient procedures/drugs.\n- Non-hospital institution Visits: Particularly for claims data, if end dates are not provided assume the visit is for the duration of month that it occurs.\n- For Inpatient Visits ongoing at the date of ETL, put date of processing the data into visit_end_datetime\n- All other Visits: visit_end_datetime = visit_start_datetime. If this is a one-day visit the end date should match the start date.","flags":[]},{"name":"visit_end_datetime","type":"TIMESTAMP","dictType":"datetime","required":false,"pk":false,"dictPk":false,"desc":"If a Person is still an inpatient in the hospital at the time of the data extract and does not have a visit_end_datetime, then set the visit_end_datetime to the datetime of the data pull.","etl":"If no time is given for the end date of a visit, set to NULL.","flags":[]},{"name":"visit_type_concept_id","type":"Integer","dictType":"Integer","required":true,"pk":false,"dictPk":false,"desc":"Use this field to understand the provenance of the visit record, or where the record comes from.","etl":"Populate this field based on the provenance of the visit record, as in whether it came from
