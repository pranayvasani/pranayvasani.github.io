<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OMOP CDM 5.4 Explorer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: drafting-table app. Filter rail | diagram canvas | inspector. Under 900px the rail becomes a drawer and the inspector a bottom sheet. */
:root{
  --bg:#F3F5F7; --surface:#FFFFFF; --surface-2:#E9EDF2; --ink:#16212C; --muted:#5A6777; --line:#D3DAE2;
  --accent:#2950B8; --edge:#3F5266; --inf:#A86200; --hover:rgba(41,80,184,.07); --hlbg:rgba(41,80,184,.14); --lane:rgba(63,82,102,.045);
  --crit:#B8322A; --warn:#A86200; --low:#5A6777; --info:#24705F; --on-sev:#FFFFFF;
  --a1:#2950B8; --a2:#24705F; --a3:#8A5A00; --a4:#71489F; --a5:#5A6777; --a6:#A3436B;
  --ui:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E141A; --surface:#161F28; --surface-2:#1E2A36; --ink:#E3E9F0; --muted:#92A0B0; --line:#2B3846;
  --accent:#86A6FF; --edge:#8D9FB3; --inf:#E2A445; --hover:rgba(134,166,255,.08); --hlbg:rgba(134,166,255,.18); --lane:rgba(141,159,179,.05);
  --crit:#EF7A70; --warn:#E2A445; --low:#92A0B0; --info:#5CC0A6; --on-sev:#0E141A;
  --a1:#86A6FF; --a2:#5CC0A6; --a3:#E2A445; --a4:#B596E6; --a5:#92A0B0; --a6:#E58BB0; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0E141A; --surface:#161F28; --surface-2:#1E2A36; --ink:#E3E9F0; --muted:#92A0B0; --line:#2B3846;
  --accent:#86A6FF; --edge:#8D9FB3; --inf:#E2A445; --hover:rgba(134,166,255,.08); --hlbg:rgba(134,166,255,.18); --lane:rgba(141,159,179,.05);
  --crit:#EF7A70; --warn:#E2A445; --low:#92A0B0; --info:#5CC0A6; --on-sev:#0E141A;
  --a1:#86A6FF; --a2:#5CC0A6; --a3:#E2A445; --a4:#B596E6; --a5:#92A0B0; --a6:#E58BB0; color-scheme:dark }
[hidden]{display:none!important}
html{height:100%;box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:13.5px/1.45 var(--ui);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
#app{height:100%;display:grid;grid-template-rows:auto 1fr;min-height:0}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
code,.mono{font-family:var(--mono);font-size:.92em}

/* top bar */
.bar{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;padding-block:10px;border-bottom:1px solid var(--line)}
.brand{display:flex;gap:10px;align-items:center;min-width:0;flex:1 1 260px}
.brand svg{flex:none}
.brand h1{font-size:15px;line-height:1.2;margin:0;font-weight:650;letter-spacing:-.01em;text-wrap:balance}
.brand p{margin:0;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ctl{height:32px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:0 10px}
select.ctl{padding-right:6px}
.btn{height:32px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:0 12px;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-right:4px}
.search{position:relative}
.search input{width:240px;max-width:100%}
#qres{position:absolute;z-index:30;top:36px;left:0;width:340px;max-width:86vw;max-height:360px;overflow:auto;margin:0;padding:4px;list-style:none;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 10px 30px rgba(0,0,0,.18)}
#qres li{padding:6px 8px;border-radius:4px;cursor:pointer;display:flex;gap:8px;justify-content:space-between}
#qres li[aria-selected="true"],#qres li:hover{background:var(--hlbg)}
#qres .k{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.menu{position:relative}
.menu ul{position:absolute;right:0;top:36px;z-index:30;list-style:none;margin:0;padding:4px;min-width:230px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 10px 30px rgba(0,0,0,.18)}
.menu li button{width:100%;text-align:left;border:0;background:none;padding:7px 10px;border-radius:4px}
.menu li button:hover,.menu li button:focus-visible{background:var(--hlbg)}
.narrow{display:none}

/* main grid */
main{display:grid;grid-template-columns:230px minmax(0,1fr) 400px;min-height:0;gap:0}
#filters{border-right:1px solid var(--line);overflow:auto;padding:12px 14px 12px 0;min-height:0}
#filters h2{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin:14px 0 6px;font-weight:600}
#filters h2:first-child{margin-top:2px}
.fl{display:flex;align-items:center;gap:8px;padding:3px 0;cursor:pointer}
.fl input{margin:0;accent-color:var(--accent)}
.fl .n{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--muted);font-size:12px}
.sw{width:10px;height:10px;border-radius:2px;flex:none}
.ar0{background:var(--a1)}.ar1{background:var(--a2)}.ar2{background:var(--a3)}.ar3{background:var(--a4)}.ar4{background:var(--a5)}.ar5{background:var(--a6)}
.note{font-size:12px;color:var(--muted);margin:6px 0 0}

#stage{position:relative;min-width:0;min-height:0;overflow:hidden;background:var(--bg)}
#svg{width:100%;height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}
#svg.grabbing{cursor:grabbing}
.zoom{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;gap:4px}
.zoom .btn{width:36px;justify-content:center;padding:0}
#status{position:absolute;left:12px;bottom:10px;font-size:12px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:4px 8px;font-variant-numeric:tabular-nums;max-width:calc(100% - 24px)}
#legend{position:absolute;right:12px;bottom:10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:6px 10px;font-size:11.5px;color:var(--muted);display:flex;gap:12px;align-items:center;flex-wrap:wrap}
#legend span{display:inline-flex;gap:6px;align-items:center}
#tip{position:absolute;z-index:20;pointer-events:none;max-width:340px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 8px 24px rgba(0,0,0,.18);padding:8px 10px;font-size:12.5px}
#tip h4{margin:0 0 2px;font-size:13px}
#tip .m{color:var(--muted);font-size:11.5px}
#tip p{margin:4px 0 0}
#toast{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:6px 12px;border-radius:999px;font-size:12.5px;z-index:25}

/* inspector */
#panel{border-left:1px solid var(--line);display:grid;grid-template-rows:auto 1fr;min-height:0;background:var(--surface)}
.tabs{display:flex;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 12px;border-bottom:2px solid transparent;color:var(--muted);white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.tabs .close{margin-left:auto;display:none}
.pane{overflow:auto;padding:14px 16px 24px;min-height:0}
.pane h2{font-size:18px;margin:2px 0 4px;font-family:var(--mono);font-weight:600;word-break:break-word}
.pane h3{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin:18px 0 6px;font-weight:600;display:flex;gap:8px;align-items:center}
.pane p{margin:4px 0}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;border:1px solid var(--line);border-radius:999px;padding:1px 8px;color:var(--muted)}
.tag{font-size:10px;letter-spacing:.06em;text-transform:uppercase;border:1px dashed var(--muted);border-radius:3px;padding:0 4px;color:var(--muted);font-weight:500}
.sev{display:inline-block;min-width:44px;text-align:center;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border-radius:3px;padding:1px 5px;color:var(--on-sev)}
.sev.high{background:var(--crit)}.sev.med{background:var(--warn)}.sev.low{background:var(--low)}.sev.info{background:var(--info)}
.src{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:0 4px;border-radius:3px;border:1px solid}
.src.doc{color:var(--accent);border-color:var(--accent)}.src.inf{color:var(--inf);border-color:var(--inf);border-style:dashed}
.lnk{border:0;background:none;padding:0;color:var(--accent);font-family:var(--mono);font-size:12.5px;text-decoration:underline;text-underline-offset:2px;text-decoration-thickness:1px}
ul.list{list-style:none;margin:0;padding:0;display:grid;gap:6px}
ul.list li{line-height:1.4}
.sub{color:var(--muted);font-size:12px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:8px 0 0}
.kv dt{color:var(--muted);font-size:12px}.kv dd{margin:0;font-family:var(--mono);font-size:12.5px;word-break:break-word}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:12px 0}
.stat{border:1px solid var(--line);border-radius:var(--r);padding:8px 10px}
.stat b{display:block;font-size:20px;font-variant-numeric:tabular-nums;line-height:1.1}
.stat span{font-size:11.5px;color:var(--muted)}
.ctab{width:100%;border-collapse:collapse;font-size:12.5px}
.ctab th{text-align:left;font-weight:600;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;border-bottom:1px solid var(--line);padding:4px 6px;position:sticky;top:-14px;background:var(--surface)}
.ctab td{border-bottom:1px solid var(--line);padding:5px 6px;vertical-align:top}
.ctab tr.r{cursor:pointer}.ctab tr.r:hover td{background:var(--hover)}
.ctab .nm{font-family:var(--mono);word-break:break-all}
.ctab .ds{color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ctab tr.x td{background:var(--surface-2);font-size:12.5px}
.ctab tr.flag .nm{color:var(--warn)}
.ktag{font:700 9.5px var(--mono);color:var(--accent)}
.wrap{overflow-x:auto}
details>summary{cursor:pointer;color:var(--muted)}
.grp{border:1px solid var(--line);border-radius:var(--r);margin:0 0 8px}
.grp>summary{padding:8px 10px;display:flex;gap:8px;align-items:center;color:var(--ink);font-weight:600}
.grp>summary .n{margin-left:auto;color:var(--muted);font-weight:400;font-variant-numeric:tabular-nums}
.grp ul{padding:0 10px 10px}
.iss{display:grid;grid-template-columns:auto 1fr;gap:2px 8px;align-items:start}
.iss .ev{grid-column:2;font-size:11.5px;color:var(--muted)}
.path{border:1px solid var(--line);border-radius:var(--r);padding:10px;display:grid;gap:4px}
.path.on{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.path h4{margin:0;font-size:13.5px}
.chk{display:grid;grid-template-columns:auto 1fr;gap:4px 8px;font-size:12.5px}
.ok{color:var(--info);font-weight:700}.bad{color:var(--crit);font-weight:700}
input.filter{width:100%;margin:2px 0 8px}

/* modal */
#modal{position:fixed;inset:0;z-index:50;background:rgba(10,14,18,.45);display:grid;place-items:center;padding:20px max(16px,env(safe-area-inset-left,0px))}
#modal .box{background:var(--surface);border:1px solid var(--line);border-radius:10px;width:min(760px,100%);max-height:88%;display:grid;grid-template-rows:auto 1fr auto;min-height:0}
#modal header,#modal footer{padding:12px 16px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#modal header h2{margin:0;font-size:15px;flex:1}
#modal .mb{overflow:auto;padding:0 16px;min-height:0}
#modal textarea{width:100%;min-height:260px;font:12px/1.4 var(--mono);border:1px solid var(--line);border-radius:var(--r);background:var(--bg);padding:8px}
#modal img{max-width:100%;border:1px solid var(--line);border-radius:var(--r);background:var(--bg)}

@media (max-width:900px){
  main{grid-template-columns:minmax(0,1fr);position:relative}
  .narrow{display:inline-flex}
  .search input{width:170px}
  #filters{position:absolute;z-index:40;left:0;top:0;bottom:0;width:min(280px,85%);background:var(--surface);padding:12px 14px;border:1px solid var(--line);box-shadow:8px 0 24px rgba(0,0,0,.2);transform:translateX(-110%);transition:transform .2s}
  #filters.open{transform:none}
  #panel{position:absolute;z-index:35;left:0;right:0;bottom:0;height:56%;border:1px solid var(--line);border-radius:12px 12px 0 0;box-shadow:0 -8px 24px rgba(0,0,0,.18);transform:translateY(105%);transition:transform .2s;padding-bottom:env(safe-area-inset-bottom,0px)}
  #panel.open{transform:none}
  .tabs .close{display:inline-flex;position:sticky;right:0}
  .tabs button{padding:10px 9px}
  #legend{display:none}
}
@media (max-width:520px){ .lblw{display:none} .brand p{white-space:normal} }
@media (prefers-reduced-motion:reduce){ *{transition:none!important} }
</style>
</head>
<body>


<div id="app">
  <header class="bar">
    <div class="brand">
      <svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true"><rect x="1" y="5" width="11" height="20" rx="2" fill="none" stroke="currentColor" stroke-width="1.6"/><rect x="18" y="5" width="11" height="20" rx="2" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M12 15h6M12 11l3 4-3 4M18 12v6" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
      <div style="min-width:0"><h1 id="mname"></h1><p id="msub"></p></div>
    </div>
    <div class="tools">
      <div class="search">
        <input id="q" class="ctl" type="search" placeholder="Search tables, columns  ( / )" aria-label="Search tables and columns" role="combobox" aria-expanded="false" aria-controls="qres" aria-autocomplete="list" autocomplete="off">
        <ul id="qres" role="listbox" hidden></ul>
      </div>
      <label><span class="lbl lblw">Columns</span><select id="colmode" class="ctl" aria-label="Column display">
        <option value="names">Names only</option><option value="keys">Keys only</option><option value="all">All columns</option></select></label>
      <label><span class="lbl lblw">Layout</span><select id="layout" class="ctl" aria-label="Layout">
        <option value="original">Original</option><option value="area">By subject area</option><option value="auto">Auto-arrange</option>
        <option value="focus">Focus</option><option value="custom">Custom</option></select></label>
      <select id="hops" class="ctl" aria-label="Focus depth" hidden><option value="1">1 hop</option><option value="2">2 hops</option></select>
      <div class="menu">
        <button id="btnExport" class="btn" aria-haspopup="true" aria-expanded="false" aria-controls="exMenu">Export</button>
        <ul id="exMenu" hidden>
          <li><button data-ex="png">PNG of visible diagram</button></li>
          <li><button data-ex="rels">Relationships CSV</button></li>
          <li><button data-ex="cols">Merged columns CSV</button></li>
          <li><button data-ex="issues">Data issues CSV</button></li>
          <li><button data-ex="layout">Layout JSON</button></li>
          <li><button data-ex="import">Import layout JSON</button></li>
        </ul>
      </div>
      <button id="btnTheme" class="btn" aria-label="Theme: follow system">Theme: Auto</button>
      <button id="btnFilters" class="btn narrow" aria-controls="filters" aria-expanded="false">Filters</button>
      <button id="btnPanel" class="btn narrow" aria-controls="panel" aria-expanded="false">Details</button>
    </div>
  </header>
  <main>
    <aside id="filters" aria-label="Filters"></aside>
    <section id="stage" aria-label="Diagram">
      <svg id="svg" role="application" aria-label="Entity relationship diagram. Drag to pan, scroll or pinch to zoom.">
        <g id="vp"><g id="lanes"></g><g id="edges"></g><g id="nodes"></g></g>
      </svg>
      <div class="zoom">
        <button id="zin" class="btn" aria-label="Zoom in">+</button>
        <button id="zout" class="btn" aria-label="Zoom out">&minus;</button>
        <button id="zfit" class="btn" aria-label="Fit diagram to screen" style="font-size:12px">Fit</button>
      </div>
      <div id="legend" aria-label="Legend">
        <span><svg width="34" height="10" aria-hidden="true"><path d="M2 5H32" stroke="var(--edge)" stroke-width="1.6"/></svg>Documented</span>
        <span><svg width="34" height="10" aria-hidden="true"><path d="M2 5H32" stroke="var(--inf)" stroke-width="1.6" stroke-dasharray="6 4"/></svg>Inferred</span>
        <span><svg width="26" height="14" aria-hidden="true"><path d="M2 2L12 7L2 12M2 7H24M18 3V11M21 3V11" fill="none" stroke="var(--edge)" stroke-width="1.4"/></svg>many to one</span>
      </div>
      <div id="status" aria-live="polite"></div>
      <div id="tip" role="tooltip" hidden></div>
      <div id="toast" role="status" hidden></div>
    </section>
    <aside id="panel" aria-label="Inspector">
      <div class="tabs" role="tablist">
        <button role="tab" id="t-table" aria-controls="p-table" aria-selected="true">Table</button>
        <button role="tab" id="t-paths" aria-controls="p-paths" aria-selected="false">Query paths</button>
        <button role="tab" id="t-issues" aria-controls="p-issues" aria-selected="false">Data issues</button>
        <button role="tab" id="t-help" aria-controls="p-help" aria-selected="false">Help</button>
        <button class="close btn" id="panelClose" aria-label="Close inspector" style="margin:4px;padding:0 10px;flex:none">&times;</button>
      </div>
      <div class="pane" id="p-table" role="tabpanel" aria-labelledby="t-table"></div>
      <div class="pane" id="p-paths" role="tabpanel" aria-labelledby="t-paths" hidden></div>
      <div class="pane" id="p-issues" role="tabpanel" aria-labelledby="t-issues" hidden></div>
      <div class="pane" id="p-help" role="tabpanel" aria-labelledby="t-help" hidden></div>
    </aside>
  </main>
  <div id="modal" hidden role="dialog" aria-modal="true" aria-labelledby="mtitle">
    <div class="box"><header><h2 id="mtitle"></h2><button class="btn" id="mclose">Close</button></header><div class="mb" id="mbody"></div><footer id="mfoot"></footer></div>
  </div>

esc":"The name of the care_site as it appears in the source data","etl":"","flags":[]},{"name":"place_of_service_concept_id","type":"integer","dictType":"integer","required":false,"pk":false,"dictPk":false,"desc":"This is a high-level way of characterizing a Care Site. Typically, however, Care Sites can provide care in multiple settings (inpatient, outpatient, etc.) and this granularity should be reflected in the visit.","etl":"Choose the concept in the visit domain that best represents the setting in which healthcare is provided in the Care Site. If most visits in a Care Site are Inpatient, then the place_of_service_concept_id should represent Inpatient. If information is present about a unique Care Site (e.g. Pharmacy) then a Care Site record should be created. [Accepted Concepts](https://athena.ohdsi.org/search-terms/terms?domain=Visit&standardConcept=Standard&page=2&pageSize=15&query=). For information about how to populate this field please see the [THEMIS Conventions](https://ohdsi.github.io/Themis/tag_place_of_service.html).","flags":[]},{"name":"location_id","type":"integer","dictType":"integer","required":false,"pk":false,"dictPk":false,"desc":"The location_id from the LOCATION table representing the physical location of the care_site.","etl":"","flags":[]},{"name":"care_site_source_value","type":"varchar(50)","dictType":"varchar(50)","required":false,"pk":false,"dictPk":false,"desc":"The identifier of the care_site as it appears in the source data. This could be an identifier separate from the name of the care_site.","etl":"","flags":[]},{"name":"place_of_service_source_value","type":"varchar(50)","dictType":"varchar(50)","required":false,"pk":false,"dictPk":false,"desc":"Put the place of service of the care_site as it appears in the source data.","etl":"Put the place of service of the care_site as it appears in the source data.","flags":[],"descFrom":"etlConventions (userGuidance empty)"}],"isLookup":false,"pos":null,"summary":"6 columns, PK care_site_id. References 2 table(s) incl. CONCEPT via 1 *_concept_id columns. Referenced by 4 table(s).","hub":false},{"id":"cdm_source","schema":"CDM","name":"cdm_source","area":"meta","description":"The CDM_SOURCE table contains detail about the source database and the process used to transform the data into the OMOP Common Data Model.","guidance":"","pk":[],"columns":[{"name":"cdm_source_name","type":"varchar(255)","dictType":"varchar(255)","required":true,"pk":false,"dictPk":false,"desc":"The name of the CDM instance.","etl":"","flags":[]},{"name":"cdm_source_abbreviation","type":"varchar(25)","dictType":"varchar(25)","required":true,"pk":false,"dictPk":false,"desc":"The abbreviation of the CDM instance.","etl":"","flags":[]},{"name":"cdm_holder","type":"varchar(255)","dictType":"varchar(255)","required":true,"pk":false,"dictPk":false,"desc":"The holder of the CDM instance.","etl":"","flags":[]},{"name":"source_description","type":"TEXT","dictType":"varchar(MAX)","required":false,"pk":false,"dictPk":false,"desc":"The description of the CDM instance.","etl":"","flags":[]},{"name":"source_documentation_reference","type":"varchar(255)","dictType":"varchar(255)","required":false,"pk":false,"dictPk":false,"desc":"Refers to a publication or web resource describing the source data, e.g. a data dictionary.","etl":"","flags":[]},{"name":"cdm_etl_reference","type":"varchar(255)","dictType":"varchar(255)","required":false,"pk":false,"dictPk":false,"desc":"Version of the ETL script used. e.g. link to the Git release","etl":"","flags":[]},{"name":"source_release_date","type":"date","dictType":"date","required":true,"pk":false,"dictPk":false,"desc":"The date the data was extracted from the source system. In some systems that is the same as the date the ETL was run. Typically the latest even date in the source is on the source_release_date.","etl":"","flags":[]},{"name":"cdm_release_date","type":"date","dictType":"date","required":true,"pk":false,"dictPk":false,"desc":"The date the ETL script was completed. Typically this is after the source_release_date.","etl":"","flags":[]},{"name":"cdm_version","type":"varchar(10)","dictType":"varchar(10)","required":false,"pk":false,"dictPk":false,"desc":"Version of the OMOP CDM used as string. e.g. v5.4","etl":"","flags":[]},{"name":"cdm_version_concept_id","type":"integer","dictType":"integer","required":true,"pk":false,"dictPk":false,"desc":"The Concept Id representing the version of the CDM.","etl":"You can find all concepts that represent the CDM versions using the query: `SELECT * FROM CONCEPT WHERE   VOCABULARY_ID = 'CDM' AND CONCEPT_CLASS = 'CDM'`","flags":[]},{"name":"vocabulary_version","type":"varchar(20)","dictType":"varchar(20)","required":true,"pk":false,"dictPk":false,"desc":"Version of the OMOP standardised vocabularies loaded","etl":"You can find the version of your Vocabulary using the query: `SELECT vocabulary_version from vocabulary  where vocabulary_id = 'None'`","flags":[]}],"isLookup":false,"pos":null,"summary":"11 columns, PK none. References 1 table(s) incl. CONCEPT via 1 *_concept_id columns.","hub":false},{"id":"cohort","schema":"RESULTS","name":"cohort","area":"derived","description":"The subject of a cohort can have multiple, discrete records in the cohort table per cohort_definition_id, subject_id, and non-overlapping time periods. The definition of the cohort is contained within the COHORT_DEFINITION table. It is listed as part of the RESULTS schema because it is a table that users of the database as well as tools such as ATLAS need to be able to write to. The CDM and Vocabulary tables are all read-only so it is suggested that the COHORT and COHORT_DEFINTION tables are kept in a separate schema to alleviate confusion.","guidance":"","pk":[],"columns":[{"name":"cohort_definition_id","type":"integer","dictType":"integer","required":true,"pk":false,"dictPk":false,"desc":"","etl":"","flags":[]},{"name":"subject_id","type":"integer","dictType":"integer","required":true,"pk":false,"dictPk":false,"desc":"","etl":"","flags":[]},{"name":"cohort_start_date","type":"date","dictType":"date","required":true,"pk":false,"dictPk":false,"desc":"","etl":"","flags":[]},{"name":"cohort_end_date","type":"date","dictType":"date","required":true,"pk":false,"dictPk":false,"desc":"","etl":"","flags":[]}],"isLookup":false,"pos":null,"summary":"4 columns, PK none.","hub":false},{"id":"cohort_definition","schema":"RESULTS","name":"cohort_definition","area":"derived","description":"The COHORT_DEFINITION table contains records defining a Cohort derived from the data through the associated description and syntax and upon instantiation (execution of the algorithm) placed into the COHORT table. Cohorts are a set of subjects that satisfy a given combination of inclusion criteria for a duration of time. The COHORT_DEFINITION table provides a standardized structure for maintaining the rules governing the inclusion of a subject into a cohort, and can store operational programming code to instantiate the cohort within the OMOP Common Data Model.","guidance":"","pk":[],"columns":[{"name":"cohort_definition_id","type":"integer","dictType":"integer","required":true,"pk":false,"dictPk":false,"desc":"This is the identifier given to the cohort, usually by the ATLAS application","etl":"","flags":[]},{"name":"cohort_definition_name","type":"varchar(255)","dictType":"varchar(255)","required":true,"pk":false,"dictPk":false,"desc":"A short description of the cohort","etl":"","flags":[]},{"name":"cohort_definition_description","type":"TEXT","dictType":"varchar(MAX)","required":false,"pk":false,"dictPk":false,"desc":"A complete description of the cohort.","etl":"","flags":[]},{"name":"definition_type_concept_id","type":"integer","dictType":"integer","required":true,"pk":false,"dictPk":false,"desc":"Type defining what kind of Cohort Definition the record represents and how the syntax may be executed.","etl":"","flags":[]},{"name":"cohort_definition_syntax","type":"TEXT","dictType":"varchar(MAX)","required":false,"pk":false,"dictPk":false,"desc":"Syntax or code to operationalize the Cohort Definition.","etl":"","flags":[]},{"name":"subject_concept_id","type":"integer","dictType":"integer","required":true,"pk":false,"dictPk":false,"desc":"This field contains a Concept that represents the domain of the subjects that are members of the cohort (e.g., Person, Provider, Visit).","etl":"","flags":[]},{"name":"cohort_initiation_date","type":"date","dictType":"date","required":false,"pk":false,"dictPk":false,"desc":"A date to indicate when the Cohort was initiated in the COHORT table.","etl":"","flags":[]}],"isLookup":false,"pos":null,"summary":"7 columns, PK none. References 1 table(s) incl. CONCEPT via 2 *_concept_id columns.","hub":false},{"id":"concept","schema":"VOCAB","name":"concept","area":"vocab","description":"The Standardized Vocabularies contains records, or Concepts, that uniquely identify each fundamental unit of meaning used to express clinical information in all domain tables of the CDM. Concepts are derived from vocabularies, which represent clinical information across a domain (e.g. conditions, drugs, procedures) through the use of codes and associated descriptions. Some Concepts are designated Standard Concepts, meaning these Concepts can be used as normative expressions of a clinical entity within the OMOP Common Data Model and standardized analytics. Each Standard Concept belongs to one Domain, which defines the location where the Concept would be expected to occur within the data tables of the CDM. Concepts can represent broad categories ('Cardiovascular disease'), detailed clinical elements ('Myocardial infarction of the anterolateral wall'), or modifying characteristics and attributes that define Concepts at various levels of detail (severity of a disease, associated morphology, etc.). Records in the Standardized Vocabularies tables are derived from national or international vocabularies such as SNOMED-CT, RxNorm, and LOINC, or custom OMOP Concepts defined to cover various aspects of observational data analysis.","guidance":"The primary purpose of the CONCEPT table is to provide a standardized representation of medical Concepts, allowing for consistent querying and analysis across the healthcare databases. Users can join the CONCEPT table with other tables in the CDM to enrich clinical data with standardized Concept information or use the CONCEPT table as a reference for mapping clinical data from source terminologies to Standard Concepts.","pk":["concept_id"],"columns":[{"name":"concept_id","type":"integer","dictType":"integer","required":true,"pk":true,"dictPk":true,"desc":"A unique identifier for each Concept across all domains.","etl":"","flags":[]},{"name":"concept_name","type":"varchar(255)","dictType":"varchar(255)","required":true,"pk":false,"dictPk":false,"desc":"An unambiguous, meaningful and descriptive name for the Concept.","etl":"","flags":[]},{"name":"domain_id","type":"varchar(20)","dictType":"varchar(20)","required":true,"pk":false,"dictPk":false,"desc":"A foreign key to the [DOMAIN](https://ohdsi.github.io/CommonDataModel/cdm54.html#domain) table the Concept belongs to.","etl":"","flags":[]},{"name":"vocabulary_id","type":"varchar(20)","dictType":"varchar(20)","required":true,"pk":false,"dictPk":false,"desc":"A foreign key to the [VOCABULARY](https://ohdsi.github.io/CommonDataModel/cdm54.html#vocabulary)\ntable indicating from which source the\nConcept has been adapted.","etl":"","flags":[]},{"name":"concept_class_id","type":"varchar(20)","dictType":"varchar(20)","required":true,"pk":false,"dictPk":false,"desc":"The attribute or concept class of the\nConcept. Examples are 'Clinical Drug',\n'Ingredient', 'Clinical Finding' etc.","etl":"","flags":[]},{"name":"standard_concept","type":"varchar(1)","dictType":"varchar(1)","required":false,"pk":false,"dictPk":false,"desc":"This flag determines where a Concept is\na Standard Concept, i.e. is used in the\ndata, a Classification Concept, or a\nnon-standard Source Concept. The\nallowable values are 'S' (Standard\nConcept) and 'C' (Classification\nConcept), otherwise the content is NULL.","etl":"","flags":[]},{"name":"concept_code","type":"varchar(50)","dictType":"varchar(50)","required":true,"pk":false,"dictPk":false,"desc":"The concept code represents the identifier\nof the Concept in the source vocabulary,\nsuch as SNOMED-CT concept IDs,\nRxNorm RXCUIs etc. Note that concept\ncodes are not unique across vocabularies.","etl":"","flags":[]},{"name":"valid_start_date","type":"date","dictType":"date","required":true,"pk":false,"dictPk":false,"desc":"The date when the Concept was first\nrecorded. The default value is\n1-Jan-1970, meaning, the Concept has no\n(known) date of inception.","etl":"","flags":[]},{"name":"valid_end_date","type":"date","dictType":"date","required":true,"pk":false,"dictPk":false,"desc":"The date when the Concept became\ninvalid because it was deleted or\nsuperseded (updated) by a new concept.\nThe default value is 31-Dec-2099,\nmeaning, the Concept is valid until it\nbecomes deprecated.","etl":"","flags":[]},{"name":"invalid_reason","type":"varchar(1)","dictType":"varchar(1)","required":false,"pk":false,"dictPk":false,"desc":"Reason the Concept was invalidated.\nPossible values are D (deleted), U\n(replaced with an update) or NULL when\nvalid_end_date has the default value.","etl":"","flags":[]}],"isLookup":true,"pos":null,"summary":"10 columns, PK concept_id. References 3 table(s). Referenced by 37 table(s).","hub":true},{"id":"concept_ancestor","schema":"VOCAB","name":"concept_ancestor","area":"vocab","description":"The CONCEPT_ANCESTOR table is designed to simplify observational analysis by providing the complete hierarchical relationships between Concepts. Only direct parent-child relationships between Concepts are stored in the CONCEPT_RELATIONSHIP table. To determine higher-level ancestry connections, all individual direct relationships would have to be navigated at analysis time. The CONCEPT_ANCESTOR table includes records for all parent-child relationships, as well as grandparent-grandchild relationships and those of any other level of lineage for Standard or Classification concepts. Using the CONCEPT_ANCESTOR table allows for querying for all descendants of a hierarchical concept, and the other way around. For example, drug ingredients and drug products, beneath them in the hierarchy, are all descendants of a drug class ancestor. This table is entirely derived from the CONCEPT, CONCEPT_RELATIONSHIP, and RELATIONSHIP tables.","guidance":"The CONCEPT_ANCESTOR table can be used to explore the hierarchical relationships captured in the table to gain insights into the hierarchical structure of clinical concepts. Understanding the hierarchical relationships of concepts can facilitate accurate interpretation and analysis of healthcare data. Also, by incorporating hierarchical relationships from the CONCEPT_ANCESTOR table, users can create cohorts containing related concepts within a hierarchical structure, enabling more comprehensive cohort definitions.","pk":[],"columns":[{"name":"ancestor_concept_id","type":"integer","dictType":"integer","required":true,"pk":false,"dictPk":false,"desc":"The Concept Id for the higher-level concept\nthat forms the ancestor in the relationship.","etl":"","flags":[]},{"name":"descendant_concept_id","type":"integer","dictType":"integer","required":true,"pk":false,"dictPk":false,"desc":"The Concept Id for the lower-level concept\nthat forms the descendant in the\nrelationship.","etl":"","flags":[]},{"name":"min_levels_of_separation","type":"integer","dictType":"integer","required":true,"pk":false,"dictPk":false,"desc":"The minimum separation in number of\nlevels of hierarchy between ancestor and\ndescendant concepts. This is an attribute\nthat is used to simplify hierarchic analysis.","etl":"","flags":[]},{"name":"max_levels_of_separation","type":"integer","dictType":"integer","required":true,"pk":false,"dictPk":false,"desc":"The maximum separation in number of\nlevels of hierarchy between ancestor and\ndescendant concepts. This is an attribute\nthat is used to simplify hierarchic analysis.","etl":"","flags":[]}],"isLookup":true,"pos":null,"summary":"4 columns, PK none. References 1 table(s) incl. CONCEPT via 2 *_concept_id columns.","hub":false},{"id":"concept_class","schema":"VOCAB","name":"concept_class","area":"vocab","description":"The CONCEPT_CLASS table includes semantic categories that reference the source structure of each Vocabulary. Concept Classes represent so-called horizontal (e.g. MedDRA, RxNorm) or vertical levels (e.g. SNOMED) of the vocabulary structure. Vocabularies without any Concept Classes, such as HCPCS, use the vocabulary_id as the Concept Class. This reference table is populated with a single record for each Concept Class, which includes a Concept Class ID and a fully specified Concept Class name.","guidance":"Users can utilize the CONCEPT_CLASS table to explore the different classes or categories of concepts within the OHDSI vocabularies.","pk":["concept_class_id"],"columns":[{"name":"concept_class_id","type":"varchar(20)","dictType":"varchar(20)","required":true,"pk":true,"dictPk":true,"desc":"A unique key for each class.","etl":"","flags":[]},{"name":"concept_class_name","type":"varchar(255)","dictType":"varchar(255)","required":true,"pk":false,"dictPk":false,"desc":"The name describing the Concept Class, e.g.\nClinical Finding, Ingredient, etc.","etl":"","flags":[]},{"name":"concept_class_concept_id","type":"integer","dictType":"integer","required":true,"pk":false,"dictPk":false,"desc":"A Concept that represents the Concept Class.","etl":"","flags":[]}],"isLookup":true,"pos":null,"summary":"3 columns, PK concept_class_id. References 1 table(s) incl. CONCEPT via 1 *_concept_id columns. Referenced by 1 table(s).","hub":false},{"id":"concept_relationship","schema":"VOCAB","name":"concept_relationship","area":"vocab","description":"The CONCEPT_RELATIONSHIP table contains records that define relationships between any two Concepts and the nature or type of the relationship. This table captures various types of relationships, including hierarchical, associative, and other semantic connections, enabling comprehensive analysis and interpretation of clinical concepts. Every kind of relationship is defined in the RELATIONSHIP table.","guidance":"The CONCEPT_RELATIONSHIP table can be used to explore hierarchical or attribute relationships between concepts to understand the hierarchical structure of clinical concepts and uncover implicit connections and associations within healthcare data. For example, users can utilize mapping relationships ('Maps to') to harmonize data from different sources and terminologies, enabling interoperability and data integration across disparate datasets.","pk":[],"columns":[{"name":"concept_id_1","type":"integer","dictType":"integer","required":true,"pk":false,"dictPk":false,"desc":"","etl":"","flags":[]},{"name":"concept_id_2","type":"integer","dictType":"integer","required":true,"pk":false,"dictPk":false,"desc":"","etl":"","flags":[]},{"name":"relationship_id","type":"varchar(20)","dictType":"varchar(20)","required":true,"pk":false,"dictPk":false,"desc":"The relationship between CONCEPT_ID_1 and CONCEPT_ID_2. Please see the [Vocabulary Conventions](https://ohdsi.github.io/CommonDataModel/dataModelConventions.html#concept_relationships). for more information.","etl":"","flags":[]},{"name":"valid_start_date","type":"date","dictType":"date","required":true,"pk":false,"dictPk":false,"desc":"The date when the relationship is first recorded.","etl":"","flags":[]},{"name":"valid_end_date","type":"date","dictType":"date","required":true,"pk":false,"dictPk":false,"desc":"The date when the relationship is invalidated.","etl":"","flags":[]},{"name":"invalid_reason","type":"varchar(1)","dictType":"varchar(1)","required":false,"pk":false,"dictPk":false,"desc":"Reason the relationship was invalidated. Possible values are 'D' (deleted), 'U' (updated) or NULL.","etl":"","flags":[]}],"isLookup":true,"pos":null,"summary":"6 columns, PK none. References 2 table(s) incl. CONCEPT via 2 *_concept_id columns.","hub":false},{"id":"concept_synonym","schema":"VOCAB","name":"concept_synonym","area":"vocab","description":"The CONCEPT_SYNONYM table captures alternative terms, synonyms, and translations of Concept Name into various languages linked to specific concepts, providing users with a comprehensive view of how Concepts may be expressed or referenced.","guidance":"Users can leverage the CONCEPT_SYNONYM table to expand search capabilities and improve query accuracy by incorporating synonymous terms into data analysis and retrieval processes. Also, users can enhance their mapping efforts between local terminologies and standardized concepts by identifying synonymous terms associated with concepts in the CONCEPT_SYNONYM table.","pk":[],"columns":[{"name":"concept_id","type":"integer","dictType":"integer","required":true,"pk":false,"dictPk":false,"desc":"","etl":"","flags":[]},{"name":"concept_synonym_name","type":"varchar(1000)","dictType":"varchar(1000)","required":true,"pk":false,"dictPk":false,"desc":"","etl":"","flags":[]},{"name":"language_concept_id","type":"integer","dictType":"integer","required":true,"pk":false,"dictPk":false,"desc":"","etl":"","flags":[]}],"isLookup":true,"pos":null,"summary":"3 columns, PK none. References 1 table(s) incl. CONCEPT via 2 *_concept_id columns.","hub":false},{"id":"condition_era","schema":"CDM","name":"condition_era","area":"derived","description":"A Condition Era is defined as a span of time when the Person is assumed to have a given condition. Similar to Drug Eras, Condition Eras are chronological periods of Condition Occurrence and every Condition Occurrence record should be part of a Condition Era. Combining individual Condition Occurrences into a single Condition Era serves two purposes:\n\n- It allows aggregation of chronic conditions that require frequent ongoing care, instead of treating each Condition Occurrence as an independent event.\n- It allows aggregation of multiple, closely timed doctor visits for the same Condition to avoid double-counting the Condition Occurrences.\nFor example, consider a Person who visits her Primary Care Physician (PCP) and who is referred to a specialist. At a later time, the Person visits the specialist, who confirms the PCP's original diagnosis and provides the appropriate treatment to resolve the condition. These two independent doctor visits should be aggregated into one Condition Era.","guidance":"","pk":["condition_era_id"],"columns":[{"name":"condition_era_id","type":"integer","dictType":"integer","required":true,"pk":true,"dictPk":true,"desc":"","etl":"","flags":[]},{"name":"person_id","type":"integer","dictType":"integer","required":true,"pk":false,"dictPk":false,"desc":"","etl":"","flags":[]},{"name":"condition_concept_id","type":"integer","dictType":"integer","required":true,"pk":false,"dictPk":false,"desc":"The Concept Id representing the Condition.","etl":"","flags":[]},{"name":"condition_era_start_date","type":"date","dictType":"date","required":true,"pk":false,"dictPk":false,"desc":"The start date for the Condition Era\nconstructed from the individual\ninstances of Condition Occurrences.\nIt is the start date of the very first\nchronologically recorded instance of\nthe condition with at least 31 days since any prior record of the same Condition.","etl":"","flags":[]},{"name":"condition_era_end_date","type":"date","dictType":"date","required":true,"pk":false,"dictPk":false,"desc":"The end date for the Condition Era\nconstructed from the individual\ninstances of Condition Occurrences.\nIt is the end date of the final\ncontinuously recorded instance of the\nCondition.","etl":"","flags":[]},{"name":"condition_occurrence_count","type":"integer","dictType":"integer","required":false,"pk":false,"dictPk":false,"desc":"The number of individual Condition\nOccurrences used to construct the\ncondition era.","etl":"","flags":[]}],"isLookup":false,"pos":null,"summary":"6 columns, PK condition_era_id. References 2 table(s) incl. CONCEPT via 1 *_concept_id columns.","hub":false},{"id":"condition_occurrence","schema":"CDM","name":"condition_occurrence","area":"clinical","description":"This table contains records of Events of a Person suggesting the presence of a disease or medical condition stated as a diagnosis, a sign, or a symptom, which is either observed by a Provider or reported by the patient.","guidance":"Conditions are defined by Concepts from the Condition domain, which form a complex hierarchy. As a result, the same Person with the same disease may have multiple Condition records, which belong to the same hierarchical family. Most Condition records are mapped from diagnostic codes, but recorded signs, symptoms and summary descriptions also contribute to this table. Rule out diagnoses should not be recorded in this table, but in reality their negating nature is not always captured in the source data, and other precautions must be taken when when identifying Persons who should suffer from the recorded Condition. Record all conditions as they exist in the source data. Any decisions about diagnosis/phenotype definitions would be done through cohort specifications. These cohorts can be housed in the [COHORT](https://ohdsi.github.io/CommonDataModel/cdm54.html#payer_plan_period) table. Conditions span a time interval from start to end, but are typically recorded as single snapshot records with no end date. The reason is twofold: (i) At the time of the recording the duration is not known and later not recorded, and (ii) the Persons typically cease interacting with the healthcare system when they feel better, which leads to incomplete capture of resolved Conditions. The [CONDITION_ERA](https://ohdsi.github.io/CommonDataModel/cdm54.html#condition_era) table addresses this issue. Family history and past diagnoses ('history of') are not recorded in this table. Instead, they are listed in the [OBSERVATION](https://ohdsi.github.io/CommonDataModel/cdm54.html#observation) table. Codes written in the process of establishing the diagnosis, such as 'question of' of and 'rule out', should not represented here. Instead, they should be recorded in the [OBSERVATION](https://ohdsi.github.io/CommonDataModel/cdm54.html#observation) table, if they are used for analyses. However, this information is not always available.","pk":["condition_occurrence_id"],"columns":[{"name":"condition_occurrence_id","type":"integer","dictType":"integer","required":true,"pk":true,"dictPk":true,"desc":"The unique key given to a condition record for a person. Refer to the ETL for how duplicate conditions during the same visit were handled.","etl":"Each instance of a condition present in the source data should be assigned this unique key. In some cases, a person can have multiple records of the same condition within the same visit. It is valid to keep these duplicates and assign them individual, unique, CONDITION_OCCURRENCE_IDs, though it is up to the ETL how they should be handled.","flags":[]},{"name":"person_id","type":"integer","dictType":"integer","required":true,"pk":false,"dictPk":false,"desc":"The PERSON_ID of the PERSON for whom the condition is recorded.","etl":"","flags":[]},{"name":"condition_concept_id","type":"integer","dictType":"integer","required":true,"pk":false,"dictPk":false,"desc":"The CONDITION_CONCEPT_ID field is recommended for primary use in analyses, and must be used for network studies. This is the standard concept mapped from the source value which represents a condition","etl":"The standard CONCEPT_ID that represents the CONDITION_SOURCE_VALUE. The concept id should be derived either from mapping from the source concept id or by picking the condition concept representing the most amount of detail you have. Only records whose source values map to concepts with a domain of \"Condition\" should go in this table. [Accepted Concepts](https://athena.ohdsi.org/search-terms/terms?domain=Condition&standardConcept=Standard&page=1&pageSize=15&query=).","flags":[]},{"name":"condition_start_date","type":"date","dictType":"date","required":true,"pk":false,"dictPk":false,"desc":"Use this date to determine the start date of the condition","etl":"Most often data sources do not have the idea of a start date for a condition. Rather, if a source only has one date associated with a condition record it is acceptable to use that date for both the CONDITION_START_DATE and the CONDITION_END_DATE.","flags":[]},{"name":"condition_start_datetime","type":"TIMESTAMP","dictType":"datetime","required":false,"pk":false,"dictPk":false,"desc":"If a source does not specify datetime the convention is to set to NULL.","etl":"If a source does not specify datetime the convention is to set to NULL.","flags":[],"descFrom":"etlConventions (userGuidance empty)"},{"name":"condition_end_date","type":"date","dictType":"date","required":false,"pk":false,"dictPk":false,"desc":"Use this date to determine the end date of the condition","etl":"Most often data sources do not have the idea of a start date for a condition. Rather, if a source only has one date associated with a condition record it is acceptable to use that date for both the CONDITION_START_DATE and the CONDITION_END_DATE.","flags":[]},{"name":"condition_end_datetime","type":"TIMESTAMP","dictType":"datetime","required":false,"pk":false,"dictPk":false,"desc":"If a source does not specify datetime the convention is to set to NULL.","etl":"If a source does not specify datetime the convention is to set to NULL.","flags":[],"descFrom":"etlConventions (userGuidance empty)"},{"name":"condition_type_concept_id","type":"integer","dictType":"integer","required":true,"pk":false,"dictPk":false,"desc":"This field can be used to determine the provenance of the Condition record, as in whether the condition was from an EHR system, insurance claim, registry, or other sources.","etl":"Choose the CONDITION_TYPE_CONCEPT_ID that best represents the provenance of the record. [Accepted Concepts](https://athena.ohdsi.org/search-terms/terms?domain=Type+Concept&standardConcept=Standard&page=1&pageSize=15&query=). A more detailed explanation of each Type Concept can be found on the [vocabulary wiki](https://github.com/OHDSI/Vocabulary-v5.0/wiki/Vocab.-TYPE_CONCEPT).","flags":[]},{"name":"condition_status_concept_id","type":"integer","dictType":"integer","required":false,"pk":false,"dictPk":false,"desc":"This concept represents the point during the visit the diagnosis was given (admitting diagnosis, final diagnosis), whether the diagnosis was determined due to laboratory findings, if the diagnosis was exclusionary, or if it was a preliminary diagnosis, among others.","etl":"Choose the Concept in the Condition Status domain that best represents the point during the visit when the diagnosis was given. These can include admitting diagnosis, principal diagnosis, and secondary diagnosis. [Accepted Concepts](https://athena.ohdsi.org/search-terms/terms?domain=Condition+Status&standardConcept=Standard&page=1&pageSize=15&query=).","flags":[]},{"name":"stop_reason","type":"varchar(20)","dictType":"varchar(20)","required":false,"pk":false,"dictPk":false,"desc":"The Stop Reason indicates why a Condition is no longer valid with respect to the purpose within the source data. Note that a Stop Reason does not necessarily imply that the condition is no longer occurring.","etl":"This information is often not populated in source data and it is a valid etl choice to leave it blank if the information does not exist.","flags":[]},{"name":"provider_id","type":"integer","dictType":"integer","required":false,"pk":false,"dictPk":false,"desc":"The provider associated with condition record, e.g. the provider who made the diagnosis or the provider who recorded the symptom.","etl":"The ETL may need to make a choice as to which PROVIDER_ID to put here. Based on what is available this may or may not be different than the provider associated with the overall VISIT_OCCURRENCE record, for example the admitting vs attending physician on an EHR record.","flags":[]},{"name":"visit_occurrence_id","type":"integer","dictType":"integer","required":false,"pk":false,"dictPk":false,"desc":"The visit during which the condition occurred.","etl":"Depending on the structure of the source data, this may have to be determined based on dates. If a CONDITION_START_DATE occurs within the start and end date of a Visit it is a valid ETL choice to choose the VISIT_OCCURRENCE_ID from the Visit that subsumes it, even if not explicitly stated in the data. While not required, an attempt should be made to locate the VISIT_OCCURRENCE_ID of the CONDITION_OCCURRENCE record.","flags":[]},{"name":"visit_detail_id","type":"integer","dictType":"integer","required":false,"pk":false,"dictPk":false,"desc":"The VISIT_DETAIL record during which the condition occurred. For example, if the person was in the ICU at the time of the diagnosis the VISIT_OCCURRENCE record would reflect the overall hospital stay and the VISIT_DETAIL record would reflect the ICU stay during the hospital visit.","etl":"Same rules apply as for the VISIT_OCCURRENCE_ID.","flags":[]},{"name":"condition_source_value","type":"varchar(50)","dictType":"varchar(50)","required":false,"pk":false,"dictPk":false,"desc":"This field houses the verbatim value from the source data representing the condition that occurred. For example, this could be an ICD10 or Read code.","etl":"This code is mapped to a Standard Condition Concept in the Standardized Vocabularies and the original code is stored here for reference.","flags":[]},{"name":"condition_source_concept_id","type":"integer","dictType":"integer","required":false,"pk":false,"dictPk":false,"desc":"This is the concept representing the condition source value and may not necessarily be standard. This field is discouraged from use in analysis because it is not required to contain Standard Concepts that are used across the OHDSI community, and should only be used when Standard Concepts do not adequately represent the source detail for the Condition necessary for a given analytic use case. Consider using CONDITION_CONCEPT_ID instead to enable standardized analytics that can be consistent across the network.","etl":"If the CONDITION_SOURCE_VALUE is coded in the source data using an OMOP supported vocabulary put the concept id representing the source value here.","flags":[]},{"name":"condition_status_source_value","type":"varchar(50)","dictType":"varchar(50)","required":false,"pk":false,"dictPk":false,"desc":"This field houses the verbatim value from the source data representing the condition status.","etl":"This information may be called something different in the source data but the field is meant to contain a value indicating when and how a diagnosis was given to a patient. This source value is mapped to a standard concept which is stored in the CONDITION_STATUS_CONCEPT_ID field.","flags":[]}],"isLookup":false,"pos":null,"summary":"16 columns, PK condition_occurrence_id. References 5 table(s) incl. CONCEPT via 4 *_concept_id columns. Referenced by 1 table(s).","hub":false},{"id":"cost","schema":"CDM","name":"cost","area":"econ","description":"The COST table captures records containing the cost of any medical event recorded in one of the OMOP clinical event tables such as DRUG_EXPOSURE, PROCEDURE_OCCURRENCE, VISIT_OCCURRENCE, VISIT_DETAIL, DEVICE_OCCURRENCE, OBSERVATION or MEASUREMENT.\n\nEach record in the cost table account for the amount of money transacted for the clinical event. So, the COST table may be used to represent both receivables (charges) and payments (paid), each transaction type represented by its COST_CONCEPT_ID. The COST_TYPE_CONCEPT_ID field will use concepts in the Standardized Vocabularies to designate the source (provenance) of the cost data. A reference to the health plan information in the PAYER_PLAN_PERIOD table is stored in the record for information used for the adjudication system to determine the persons benefit for the clinical event.","guidance":"When dealing with summary costs, the cost of the goods or services the provider provides is often not known directly, but derived from the hospital charges multiplied by an average cost-to-charge ratio.","pk":["cost_id"],"columns":[{"name":"cost_id","type":"integer","dictType":"integer","required":true,"pk":true,"dictPk":true,"desc":"A unique identifier for each COST record.","etl":"A unique identifier for each COST record.","flags":[],"descFrom":"etlConventions (userGuidance empty)"},{"name":"cost_event_id","type":"integer","dictType":"integer","required":true,"pk":false,"dictPk":false,"desc":"A foreign key identifier to the event (e.g. Measurement, Procedure, Visit, Drug Exposure, etc) record for which cost data are recorded.","etl":"A foreign key identifier to the event (e.g. Measurement, Procedure, Visit, Drug Exposure, etc) record for which cost data are recorded.","flags":[],"descFrom":"etlConventions (userGuidance empty)"},{"name":"cost_domain_id","type":"varchar(20)","dictType":"varchar(20)","required":true,"pk":false,"dictPk":false,"desc":"The concept representing the domain of the cost event, from which the corresponding table can be inferred that contains the entity for which cost information is recorded.","etl":"The concept representing the domain of the cost event, from which the corresponding table can be inferred that contains the entity for which cost information is recorded.","flags":[],"descFrom":"etlConventions (userGuidance empty)"},{"name":"cost_type_concept_id","type":"integer","dictType":"integer","required":true,"pk":false,"dictPk":false,"desc":"The concept referenced in this field defines the source of the cost information, and therefore the perspective. It could be from the perspective of the payer, or the perspective of the provider. Therefore, cost really means either cost or revenue, and the direction of funds (incoming and outgoing) as well as the modus of its calculation is defined by this field.","etl":"A foreign key identifier to a concept in the CONCEPT table for the provenance or the source of the COST data: Calculated from insurance claim information, provider revenue, calculated from cost-to-charge ratio, reported from accounting database, etc.","flags":[]},{"name":"currency_concept_id","type":"integer","dictType":"integer","required":false,"pk":false,"dictPk":false,"desc":"A foreign key identifier to the concept representing the 3-letter code used to delineate international currencies, such as USD for US Dollar.","etl":"A foreign key identifier to the concept representing the 3-letter code used to delineate international currencies, such as USD for US Dollar.","flags":[],"descFrom":"etlConventions (userGuidance empty)"},{"name":"total_charge","type":"NUMERIC","dictType":"float","required":false,"pk":false,"dictPk":false,"desc":"The total amount charged by some provider of goods or services (e.g. hospital, physician pharmacy, dme provider) to payers (insurance companies, the patient).","etl":"The total amount charged by some provider of goods or services (e.g. hospital, physician pharmacy, dme provider) to payers (insurance companies, the patient).","flags":[],"descFrom":"etlConventions (userGuidance empty)"},{"name":"total_cost","type":"NUMERIC","dictType":"float","required":false,"pk":false,"dictPk":false,"desc":"The cost of the goods or services the provider provides is often not known directly, but derived from the hospital charges multiplied by an average cost-to-charge ratio. This data is currently available for NIS datasets, or any other HCUP datasets.","etl":"The cost of the goods or services the provider provides is often not known directly, but derived from the hospital charges multiplied by an average cost-to-charge ratio. This data is currently available for NIS datasets, or any other HCUP datasets.","flags":[]},{"name":"total_paid","type":"NUMERIC","dictType":"float","required":false,"pk":false,"dictPk":false,"desc":"This field is calculated using the following formula: paid_by_payer + paid_by_patient + paid_by_primary. In claims data, this field is considered the calculated field the payer expects the provider to get reimbursed for goods and services, based on the payer's contractual obligations.","etl":"The total amount actually paid from all payers for goods or services of the provider.","flags":[]},{"name":"paid_by_payer","type":"NUMERIC","dictType":"float","required":false,"pk":false,"dictPk":false,"desc":"In claims data, generally there is one field representing the total payment from the payer for the service/device/drug. However, this field could be a calculated field if the source data provides separate payment information for the ingredient cost and the dispensing fee in case of prescription benefits. If there is more than one Payer in the source data, several cost records indicate that fact. The Payer reporting this reimbursement should be indicated under the payer_plan_id field.","etl":"The amount paid by the Payer for the goods or services.","flags":[]},{"name":"paid_by_patient","type":"NUMERIC","dictType":"float","required":false,"pk":false,"dictPk":false,"desc":"This field is most often used in claims data to report the contracted amount the patient is responsible for reimbursing the provider for the goods and services she received. This is a calculated field using the following formula: paid_patient_copay + paid_patient_coinsurance + paid_patient_deductible.","etl":"The total amount paid by the Person as a share of the expenses.","flags":[]},{"name":"paid_patient_copay","type":"NUMERIC","dictType":"float","required":false,"pk":false,"dictPk":false,"desc":"The paid_patient_copay field is only used for reporting a patient's copay amount reported on an insurance claim. This field contributes to the paid_by_patient variable.","etl":"The amount paid by the Person as a fixed contribution to the expenses.","flags":[]},{"name":"paid_patient_coinsurance","type":"NUMERIC","dictType":"float","required":false,"pk":false,"dictPk":false,"desc":"The paid_patient_coinsurance field is only used for reporting a patient's coinsurance amount reported on an insurance claim. This field contributes to the paid_by_patient variable.","etl":"The amount paid by the Person as a joint assumption of risk. Typically, this is a percentage of the expenses defined by the Payer Plan after the Person's deductible is exceeded.","flags":[]},{"name":"paid_patient_deductible","type":"NUMERIC","dictType":"float","required":false,"pk":false,"dictPk":false,"desc":"The paid_patient_deductible field is only used for reporting a patient's deductible amount reported on an insurance claim. This field contributes to the paid_by_patient variable.","etl":"The amount paid by the Person that is counted toward the deductible defined by the Payer Plan. paid_patient_deductible does contribute to the paid_by_patient variable.","flags":[]},{"name":"paid_by_primary","type":"NUMERIC","dictType":"float","required":false,"pk":false,"dictPk":false,"desc":"The paid_by_primary field is only used for reporting a patient's primary insurance payment amount reported on the secondary payer insurance claim. If the source data has actual primary insurance payments, then the primary insurance payment should have its own cost record with a payer_plan_id set to the applicable payer.","etl":"The amount paid by a primary Payer through the coordination of benefits.","flags":[]},{"name":"paid_ingredient_cost","type":"NUMERIC","dictType":"float","required":false,"pk":false,"dictPk":false,"desc":"Drug costs are composed of ingredient cost (the amount charged by the wholesale distributor or manufacturer), the dispensing fee (the amount charged by the pharmacy) and the sales tax.","etl":"Drug costs are composed of ingredient cost (the amount charged by the wholesale distributor or manufacturer), the dispensing fee (the amount charged by the pharmacy) and the sales tax.","flags":[],"descFrom":"etlConventions (userGuidance empty)"},{"name":"paid_dispensing_fee","type":"NUMERIC","dictType":"float","required":false,"pk":false,"dictPk":false,"desc":"Drug costs are composed of ingredient cost (the amount charged by the wholesale distributor or manufacturer), the dispensing fee (the amount charged by the pharmacy) and the sales tax.","etl":"Drug costs are composed of ingredient cost (the amount charged by the wholesale distributor or manufacturer), the dispensing fee (the amount charged by the pharmacy) and the sales tax.","flags":[],"descFrom":"etlConventions (userGuidance empty)"},{"name":"payer_plan_period_id","type":"integer","dictType":"integer","required":false,"pk":false,"dictPk":false,"desc":"A foreign key to the PAYER_PLAN_PERIOD table, where the details of the Payer, Plan and Family are stored. Record the payer_plan_id that relates to the payer who contributed to the paid_by_payer field.","etl":"A foreign key to the PAYER_PLAN_PERIOD table, where the details of the Payer, Plan and Family are stored. Record the payer_plan_id that relates to the payer who contributed to the paid_by_payer field.","flags":[],"descFrom":"etlConventions (userGuidance empty)"},{"name":"amount_allowed","type":"NUMERIC","dictType":"float","required":false,"pk":false,"dictPk":false,"desc":"This information is generally available in claims data. This is similar to the total_paid amount in that it shows what the payer expects the provider to be reimbursed after the payer and patient pay. This differs from the total_paid amount in that it is not a calculated field, but a field available directly in claims data. The field is payer-specific and the payer should be indicated by the payer_plan_id field.","etl":"The contracted amount agreed between the payer and provider.","flags":[]},{"name":"revenue_code_concept_id","type":"integer","dictType":"integer","required":false,"pk":false,"dictP
