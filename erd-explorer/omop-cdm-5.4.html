,"required":false,"pk":false,"dictPk":false,"desc":"If available, put the source code representing the cause of death here.","etl":"If available, put the source code representing the cause of death here.","flags":[],"descFrom":"etlConventions (userGuidance empty)"},{"name":"cause_source_concept_id","type":"integer","dictType":"integer","required":false,"pk":false,"dictPk":false,"desc":"If the cause of death was coded using a Vocabulary present in the OMOP Vocabularies (not necessarily a standard concept) put the CONCEPT_ID representing the cause of death here.","etl":"If the cause of death was coded using a Vocabulary present in the OMOP Vocabularies (not necessarily a standard concept) put the CONCEPT_ID representing the cause of death here.","flags":[],"descFrom":"etlConventions (userGuidance empty)"}],"isLookup":false,"pos":null,"summary":"7 columns, PK none. References 2 table(s) incl. CONCEPT via 3 *_concept_id columns.","hub":false},{"id":"device_exposure","schema":"CDM","name":"device_exposure","area":"clinical","description":"The Device domain captures information about a person's exposure to a foreign physical object or instrument which is used for diagnostic or therapeutic purposes through a mechanism beyond chemical action. Devices include implantable objects (e.g. pacemakers, stents, artificial joints), medical equipment and supplies (e.g. bandages, crutches, syringes), other instruments used in medical procedures (e.g. sutures, defibrillators) and material used in clinical care (e.g. adhesives, body material, dental material, surgical material).","guidance":"The distinction between Devices or supplies and Procedures are sometimes blurry, but the former are physical objects while the latter are actions, often to apply a Device or supply.","pk":["device_exposure_id"],"columns":[{"name":"device_exposure_id","type":"integer","dictType":"integer","required":true,"pk":true,"dictPk":true,"desc":"The unique key given to records a person's exposure to a foreign physical object or instrument.","etl":"Each instance of an exposure to a foreign object or device present in the source data should be assigned this unique key.","flags":[]},{"name":"person_id","type":"integer","dictType":"integer","required":true,"pk":false,"dictPk":false,"desc":"","etl":"","flags":[]},{"name":"device_concept_id","type":"integer","dictType":"integer","required":true,"pk":false,"dictPk":false,"desc":"The DEVICE_CONCEPT_ID field is recommended for primary use in analyses, and must be used for network studies. This is the standard concept mapped from the source concept id which represents a foreign object or instrument the person was exposed to.","etl":"The standard CONCEPT_ID that represents the DEVICE_SOURCE_VALUE. The concept id should be derived either from mapping from the source concept id or by picking the device concept representing the most amount of detail you have. [Accepted concepts](https://athena.ohdsi.org/search-terms/terms?domain=Device%2FDrug&domain=Device&domain=Device%2FProcedure&page=1&pageSize=15&query=)","flags":[]},{"name":"device_exposure_start_date","type":"date","dictType":"date","required":true,"pk":false,"dictPk":false,"desc":"Use this date to determine the start date of the device record.","etl":"Valid entries include a start date of a procedure to implant a device, the date of a prescription for a device, or the date of device administration.","flags":[]},{"name":"device_exposure_start_datetime","type":"TIMESTAMP","dictType":"datetime","required":false,"pk":false,"dictPk":false,"desc":"","etl":"","flags":[]},{"name":"device_exposure_end_date","type":"date","dictType":"date","required":false,"pk":false,"dictPk":false,"desc":"The DEVICE_EXPOSURE_END_DATE denotes the day the device exposure ended for the patient, if given.","etl":"Put the end date or discontinuation date as it appears from the source data or leave blank if unavailable.","flags":[]},{"name":"device_exposure_end_datetime","type":"TIMESTAMP","dictType":"datetime","required":false,"pk":false,"dictPk":false,"desc":"","etl":"","flags":[]},{"name":"device_type_concept_id","type":"integer","dictType":"integer","required":true,"pk":false,"dictPk":false,"desc":"You can use the TYPE_CONCEPT_ID to denote the provenance of the record, as in whether the record is from administrative claims or EHR.","etl":"Choose the device_type_concept_id that best represents the provenance of the record. [Accepted Concepts](https://athena.ohdsi.org/search-terms/terms?domain=Type+Concept&standardConcept=Standard&page=1&pageSize=15&query=). A more detailed explanation of each Type Concept can be found on the [vocabulary wiki](https://github.com/OHDSI/Vocabulary-v5.0/wiki/Vocab.-TYPE_CONCEPT).","flags":[]},{"name":"unique_device_id","type":"varchar(255)","dictType":"varchar(255)","required":false,"pk":false,"dictPk":false,"desc":"This is the Unique Device Identification (UDI-DI) number for devices regulated by the FDA, if given.","etl":"For medical devices that are regulated by the FDA, a Unique Device Identification (UDI) is provided if available in the data source and is recorded in the UNIQUE_DEVICE_ID field.","flags":[]},{"name":"production_id","type":"varchar(255)","dictType":"varchar(255)","required":false,"pk":false,"dictPk":false,"desc":"This is the Production Identifier (UDI-PI) portion of the Unique Device Identification.","etl":"","flags":[]},{"name":"quantity","type":"integer","dictType":"integer","required":false,"pk":false,"dictPk":false,"desc":"If there is a record of device exposure in the source but no quantity value, then set to 1.","etl":"If there is a record of device exposure in the source but no quantity value, then set to 1.","flags":[],"descFrom":"etlConventions (userGuidance empty)"},{"name":"provider_id","type":"integer","dictType":"integer","required":false,"pk":false,"dictPk":false,"desc":"The Provider associated with device record, e.g. the provider who wrote the prescription or the provider who implanted the device.","etl":"The ETL may need to make a choice as to which PROVIDER_ID to put here. Based on what is available this may or may not be different than the provider associated with the overall VISIT_OCCURRENCE record.","flags":[]},{"name":"visit_occurrence_id","type":"integer","dictType":"integer","required":false,"pk":false,"dictPk":false,"desc":"The Visit during which the device was prescribed or given.","etl":"To populate this field device exposures must be explicitly initiated in the visit.","flags":[]},{"name":"visit_detail_id","type":"integer","dictType":"integer","required":false,"pk":false,"dictPk":false,"desc":"The Visit Detail during which the device was prescribed or given.","etl":"To populate this field device exposures must be explicitly initiated in the visit detail record.","flags":[]},{"name":"device_source_value","type":"varchar(50)","dictType":"varchar(50)","required":false,"pk":false,"dictPk":false,"desc":"This field houses the verbatim value from the source data representing the device exposure that occurred. For example, this could be an NDC or Gemscript code.","etl":"This code is mapped to a Standard Device Concept in the Standardized Vocabularies and the original code is stored here for reference.","flags":[]},{"name":"device_source_concept_id","type":"integer","dictType":"integer","required":false,"pk":false,"dictPk":false,"desc":"This is the concept representing the device source value and may not necessarily be standard. This field is discouraged from use in analysis because it is not required to contain Standard Concepts that are used across the OHDSI community, and should only be used when Standard Concepts do not adequately represent the source detail for the Device necessary for a given analytic use case. Consider using DEVICE_CONCEPT_ID instead to enable standardized analytics that can be consistent across the network.","etl":"If the DEVICE_SOURCE_VALUE is coded in the source data using an OMOP supported vocabulary put the concept id representing the source value here.","flags":[]},{"name":"unit_concept_id","type":"integer","dictType":"integer","required":false,"pk":false,"dictPk":false,"desc":"UNIT_SOURCE_VALUES should be mapped to a Standard Concept in the Unit domain that best represents the unit as given in the source data.","etl":"There is no standardization requirement for units associated with DEVICE_CONCEPT_IDs, however, it is the responsibility of the ETL to choose the most plausible unit. If the source unit is NULL (applicable to cases when there's no numerical value or when it doesn't require a unit), keep unit_concept_id NULL as well. If there's no mapping of a source unit, populate unit_concept_id with 0.","flags":[]},{"name":"unit_source_value","type":"varchar(50)","dictType":"varchar(50)","required":false,"pk":false,"dictPk":false,"desc":"This field houses the verbatim value from the source data representing the unit of the Device. For example, blood transfusions are considered devices and can be given in mL quantities.","etl":"This code is mapped to a Standard Unit Concept in the Standardized Vocabularies and the original code is stored here for reference. Using the blood transfusion example, blood transfusion is represented by the DEVICE_CONCEPT_ID and the unit (mL) would be housed in the UNIT_SOURCE_VALUE and mapped to a standard concept in the unit domain.","flags":[]},{"name":"unit_source_concept_id","type":"integer","dictType":"integer","required":false,"pk":false,"dictPk":false,"desc":"This is the concept representing the UNIT_SOURCE_VALUE and may not necessarily be standard. This field is discouraged from use in analysis because it is not required to contain Standard Concepts that are used across the OHDSI community, and should only be used when Standard Concepts do not adequately represent the source detail for the Unit necessary for a given analytic use case. Consider using UNIT_CONCEPT_ID instead to enable standardized analytics that can be consistent across the network.","etl":"If the UNIT_SOURCE_VALUE is coded in the source data using an OMOP supported vocabulary put the concept id representing the source value here.","flags":[]}],"isLookup":false,"pos":null,"summary":"19 columns, PK device_exposure_id. References 5 table(s) incl. CONCEPT via 5 *_concept_id columns. Referenced by 1 table(s).","hub":false},{"id":"domain","schema":"VOCAB","name":"domain","area":"vocab","description":"The DOMAIN table includes a list of OMOP-defined Domains to which the Concepts of the Standardized Vocabularies can belong. A Domain represents a clinical definition whereby we assign matching Concepts for the standardized fields in the CDM tables. For example, the Condition Domain contains Concepts that describe a patient condition, and these Concepts can only be used in the condition_concept_id field of the CONDITION_OCCURRENCE and CONDITION_ERA tables. This reference table is populated with a single record for each Domain, including a Domain ID and a descriptive name for every Domain.","guidance":"Users can leverage the DOMAIN table to explore the full spectrum of health-related data Domains available in the Standardized Vocabularies. Also, the information in the DOMAIN table may be used as a reference for mapping source data to OMOP domains, facilitating data harmonization and interoperability.","pk":["domain_id"],"columns":[{"name":"domain_id","type":"varchar(20)","dictType":"varchar(20)","required":true,"pk":true,"dictPk":true,"desc":"A unique key for each domain.","etl":"","flags":[]},{"name":"domain_name","type":"varchar(255)","dictType":"varchar(255)","required":true,"pk":false,"dictPk":false,"desc":"The name describing the Domain, e.g.\nCondition, Procedure, Measurement\netc.","etl":"","flags":[]},{"name":"domain_concept_id","type":"integer","dictType":"integer","required":true,"pk":false,"dictPk":false,"desc":"A Concept representing the Domain Concept the DOMAIN record belongs to.","etl":"","flags":[]}],"isLookup":true,"pos":null,"summary":"3 columns, PK domain_id. References 1 table(s) incl. CONCEPT via 1 *_concept_id columns. Referenced by 2 table(s).","hub":false},{"id":"dose_era","schema":"CDM","name":"dose_era","area":"derived","description":"A Dose Era is defined as a span of time when the Person is assumed to be exposed to a constant dose of a specific active ingredient.","guidance":"","pk":["dose_era_id"],"columns":[{"name":"dose_era_id","type":"integer","dictType":"integer","required":true,"pk":true,"dictPk":true,"desc":"","etl":"","flags":[]},{"name":"person_id","type":"integer","dictType":"integer","required":true,"pk":false,"dictPk":false,"desc":"","etl":"","flags":[]},{"name":"drug_concept_id","type":"integer","dictType":"integer","required":true,"pk":false,"dictPk":false,"desc":"The Concept Id representing the specific drug ingredient.","etl":"","flags":[]},{"name":"unit_concept_id","type":"integer","dictType":"integer","required":true,"pk":false,"dictPk":false,"desc":"The Concept Id representing the unit of the specific drug ingredient.","etl":"","flags":[]},{"name":"dose_value","type":"NUMERIC","dictType":"float","required":true,"pk":false,"dictPk":false,"desc":"The numeric value of the dosage of the drug_ingredient.","etl":"","flags":[]},{"name":"dose_era_start_date","type":"date","dictType":"date","required":true,"pk":false,"dictPk":false,"desc":"The date the Person started on the specific dosage, with at least 31 days since any prior exposure.","etl":"","flags":[]},{"name":"dose_era_end_date","type":"date","dictType":"date","required":true,"pk":false,"dictPk":false,"desc":"The date the Person was no longer exposed to the dosage of the specific drug ingredient. An era is ended if there are 31 days or more between dosage records.","etl":"The date the Person was no longer exposed to the dosage of the specific drug ingredient. An era is ended if there are 31 days or more between dosage records.","flags":[],"descFrom":"etlConventions (userGuidance empty)"}],"isLookup":false,"pos":null,"summary":"7 columns, PK dose_era_id. References 2 table(s) incl. CONCEPT via 2 *_concept_id columns.","hub":false},{"id":"drug_era","schema":"CDM","name":"drug_era","area":"derived","description":"A Drug Era is defined as a span of time when the Person is assumed to be exposed to a particular active ingredient. A Drug Era is not the same as a Drug Exposure: Exposures are individual records corresponding to the source when Drug was delivered to the Person, while successive periods of Drug Exposures are combined under certain rules to produce continuous Drug Eras. Every record in the DRUG_EXPOSURE table should be part of a drug era based on the dates of exposure.","guidance":"","pk":["drug_era_id"],"columns":[{"name":"drug_era_id","type":"integer","dictType":"integer","required":true,"pk":true,"dictPk":true,"desc":"","etl":"","flags":[]},{"name":"person_id","type":"integer","dictType":"integer","required":true,"pk":false,"dictPk":false,"desc":"","etl":"","flags":[]},{"name":"drug_concept_id","type":"integer","dictType":"integer","required":true,"pk":false,"dictPk":false,"desc":"The drug_concept_id should conform to the concept class 'ingredient' as the drug_era is an era of time where a person is exposed to a particular drug ingredient.","etl":"","flags":[]},{"name":"drug_era_start_date","type":"date","dictType":"date","required":true,"pk":false,"dictPk":false,"desc":"The Drug Era Start Date is the start date of the first Drug Exposure for a given ingredient, with at least 31 days since the previous exposure.","etl":"The Drug Era Start Date is the start date of the first Drug Exposure for a given ingredient, with at least 31 days since the previous exposure.","flags":[],"descFrom":"etlConventions (userGuidance empty)"},{"name":"drug_era_end_date","type":"date","dictType":"date","required":true,"pk":false,"dictPk":false,"desc":"The Drug Era End Date is the end date of the last Drug Exposure. The End Date of each Drug Exposure is either taken from the field drug_exposure_end_date or, as it is typically not available, inferred using the following rules:\nFor pharmacy prescription data, the date when the drug was dispensed plus the number of days of supply are used to extrapolate the End Date for the Drug Exposure. Depending on the country-specific healthcare system, this supply information is either explicitly provided in the day_supply field or inferred from package size or similar information.\nFor Procedure Drugs, usually the drug is administered on a single date (i.e., the administration date).\nA standard Persistence Window of 30 days (gap, slack) is permitted between two subsequent such extrapolated DRUG_EXPOSURE records to be considered to be merged into a single Drug Era.","etl":"The Drug Era End Date is the end date of the last Drug Exposure. The End Date of each Drug Exposure is either taken from the field drug_exposure_end_date or, as it is typically not available, inferred using the following rules:\nFor pharmacy prescription data, the date when the drug was dispensed plus the number of days of supply are used to extrapolate the End Date for the Drug Exposure. Depending on the country-specific healthcare system, this supply information is either explicitly provided in the day_supply field or inferred from package size or similar information.\nFor Procedure Drugs, usually the drug is administered on a single date (i.e., the administration date).\nA standard Persistence Window of 30 days (gap, slack) is permitted between two subsequent such extrapolated DRUG_EXPOSURE records to be considered to be merged into a single Drug Era.","flags":[],"descFrom":"etlConventions (userGuidance empty)"},{"name":"drug_exposure_count","type":"integer","dictType":"integer","required":false,"pk":false,"dictPk":false,"desc":"The count of grouped DRUG_EXPOSURE records that were included in the DRUG_ERA row","etl":"","flags":[]},{"name":"gap_days","type":"integer","dictType":"integer","required":false,"pk":false,"dictPk":false,"desc":"The Gap Days determine how many total drug-free days are observed between all Drug Exposure events that contribute to a DRUG_ERA record. It is assumed that the drugs are \"not stockpiled\" by the patient, i.e. that if a new drug prescription or refill is observed (a new DRUG_EXPOSURE record is written), the remaining supply from the previous events is abandoned.   The difference between Persistence Window and Gap Days is that the former is the maximum drug-free time allowed between two subsequent DRUG_EXPOSURE records, while the latter is the sum of actual drug-free days for the given Drug Era under the above assumption of non-stockpiling.","etl":"The Gap Days determine how many total drug-free days are observed between all Drug Exposure events that contribute to a DRUG_ERA record. It is assumed that the drugs are \"not stockpiled\" by the patient, i.e. that if a new drug prescription or refill is observed (a new DRUG_EXPOSURE record is written), the remaining supply from the previous events is abandoned.   The difference between Persistence Window and Gap Days is that the former is the maximum drug-free time allowed between two subsequent DRUG_EXPOSURE records, while the latter is the sum of actual drug-free days for the given Drug Era under the above assumption of non-stockpiling.","flags":[],"descFrom":"etlConventions (userGuidance empty)"}],"isLookup":false,"pos":null,"summary":"7 columns, PK drug_era_id. References 2 table(s) incl. CONCEPT via 1 *_concept_id columns.","hub":false},{"id":"drug_exposure","schema":"CDM","name":"drug_exposure","area":"clinical","description":"This table captures records about the exposure to a Drug ingested or otherwise introduced into the body. A Drug is a biochemical substance formulated in such a way that when administered to a Person it will exert a certain biochemical effect on the metabolism. Drugs include prescription and over-the-counter medicines, vaccines, and large-molecule biologic therapies. Radiological devices ingested or applied locally do not count as Drugs.","guidance":"The purpose of records in this table is to indicate an exposure to a certain drug as best as possible. In this context a drug is defined as an active ingredient. Drug Exposures are defined by Concepts from the Drug domain, which form a complex hierarchy. As a result, one DRUG_SOURCE_CONCEPT_ID may map to multiple standard concept ids if it is a combination product. Records in this table represent prescriptions written, prescriptions dispensed, and drugs administered by a provider to name a few. The DRUG_TYPE_CONCEPT_ID can be used to find and filter on these types. This table includes additional information about the drug products, the quantity given, and route of administration.","pk":["drug_exposure_id"],"columns":[{"name":"drug_exposure_id","type":"integer","dictType":"integer","required":true,"pk":true,"dictPk":true,"desc":"The unique key given to records of drug dispensings or administrations for a person. Refer to the ETL for how duplicate drugs during the same visit were handled.","etl":"Each instance of a drug dispensing or administration present in the source data should be assigned this unique key. In some cases, a person can have multiple records of the same drug within the same visit. It is valid to keep these duplicates and assign them individual, unique, DRUG_EXPOSURE_IDs, though it is up to the ETL how they should be handled.","flags":[]},{"name":"person_id","type":"integer","dictType":"integer","required":true,"pk":false,"dictPk":false,"desc":"The PERSON_ID of the PERSON for whom the drug dispensing or administration is recorded. This may be a system generated code.","etl":"","flags":[]},{"name":"drug_concept_id","type":"integer","dictType":"integer","required":true,"pk":false,"dictPk":false,"desc":"The DRUG_CONCEPT_ID field is recommended for primary use in analyses, and must be used for network studies. This is the standard concept mapped from the source concept id which represents a drug product or molecule otherwise introduced to the body. The drug concepts can have a varying degree of information about drug strength and dose. This information is relevant in the context of quantity and administration information in the subsequent fields plus strength information from the DRUG_STRENGTH table, provided as part of the standard vocabulary download.","etl":"The standard CONCEPT_ID that represents the DRUG_SOURCE_VALUE. The concept id should be derived either from mapping from the source concept id or by picking the drug concept representing the most amount of detail you have. Records whose source values map to standard concepts with a domain of Drug should go in this table. When the Drug Source Value of the code cannot be translated into Standard Drug Concept IDs, a Drug exposure entry is stored with only the corresponding SOURCE_CONCEPT_ID and DRUG_SOURCE_VALUE and a DRUG_CONCEPT_ID of 0. The Drug Concept with the most detailed content of information is preferred during the mapping process. These are indicated in the CONCEPT_CLASS_ID field of the Concept and are recorded in the following order of precedence: Marketed Product, Branded Pack, Clinical Pack, Branded Drug, Clinical Drug, Branded Drug Component, Clinical Drug Component, Branded Drug Form, Clinical Drug Form, and only if no other information is available Ingredient. Note: If only the drug class is known, the DRUG_CONCEPT_ID field should contain 0. [Accepted Concepts](https://athena.ohdsi.org/search-terms/terms?domain=Drug&standardConcept=Standard&page=1&pageSize=15&query=).","flags":[]},{"name":"drug_exposure_start_date","type":"date","dictType":"date","required":true,"pk":false,"dictPk":false,"desc":"Use this date to determine the start date of the drug record.","etl":"Valid entries include a start date of a prescription, the date a prescription was filled, or the date on which a Drug administration was recorded. It is a valid ETL choice to use the date the drug was ordered as the DRUG_EXPOSURE_START_DATE.","flags":[]},{"name":"drug_exposure_start_datetime","type":"TIMESTAMP","dictType":"datetime","required":false,"pk":false,"dictPk":false,"desc":"This is not required. If a source does not specify datetime the convention is to set to NULL.","etl":"This is not required. If a source does not specify datetime the convention is to set to NULL.","flags":[],"descFrom":"etlConventions (userGuidance empty)"},{"name":"drug_exposure_end_date","type":"date","dictType":"date","required":true,"pk":false,"dictPk":false,"desc":"The DRUG_EXPOSURE_END_DATE denotes the day the drug exposure ended for the patient.","etl":"If this information is not explicitly available in the data, infer the end date from start date and duration.<br>For detailed conventions for how to populate this field, please see the [THEMIS repository](https://ohdsi.github.io/Themis/tag_drug_exposure.html).","flags":[]},{"name":"drug_exposure_end_datetime","type":"TIMESTAMP","dictType":"datetime","required":false,"pk":false,"dictPk":false,"desc":"This is not required. If a source does not specify datetime the convention is to set to NULL.","etl":"This is not required. If a source does not specify datetime the convention is to set to NULL.","flags":[],"descFrom":"etlConventions (userGuidance empty)"},{"name":"verbatim_end_date","type":"date","dictType":"date","required":false,"pk":false,"dictPk":false,"desc":"This is the end date of the drug exposure as it appears in the source data, if it is given","etl":"Put the end date or discontinuation date as it appears from the source data or leave blank if unavailable.","flags":[]},{"name":"drug_type_concept_id","type":"integer","dictType":"integer","required":true,"pk":false,"dictPk":false,"desc":"You can use the TYPE_CONCEPT_ID to delineate between prescriptions written vs. prescriptions dispensed vs. medication history vs. patient-reported exposure, etc.","etl":"Choose the drug_type_concept_id that best represents the provenance of the record, for example whether it came from a record of a prescription written or physician administered drug. [Accepted Concepts](https://athena.ohdsi.org/search-terms/terms?domain=Type+Concept&standardConcept=Standard&page=1&pageSize=15&query=). A more detailed explanation of each Type Concept can be found on the [vocabulary wiki](https://github.com/OHDSI/Vocabulary-v5.0/wiki/Vocab.-TYPE_CONCEPT).","flags":[]},{"name":"stop_reason","type":"varchar(20)","dictType":"varchar(20)","required":false,"pk":false,"dictPk":false,"desc":"The reason a person stopped a medication as it is represented in the source. Reasons include regimen completed, changed, removed, etc. This field will be retired in v6.0.","etl":"This information is often not populated in source data and it is a valid etl choice to leave it blank if the information does not exist.","flags":[]},{"name":"refills","type":"integer","dictType":"integer","required":false,"pk":false,"dictPk":false,"desc":"This is only filled in when the record is coming from a prescription written this field is meant to represent intended refills at time of the prescription.","etl":"","flags":[]},{"name":"quantity","type":"NUMERIC","dictType":"float","required":false,"pk":false,"dictPk":false,"desc":"To find the dose form of a drug the RELATIONSHIP table can be used where the relationship_id is 'Has dose form'. If liquid, quantity stands for the total amount dispensed or ordered of ingredient in the units given by the drug_strength table. If the unit from the source data does not align with the unit in the DRUG_STRENGTH table the quantity should be converted to the correct unit given in DRUG_STRENGTH. For clinical drugs with fixed dose forms (tablets etc.) the quantity is the number of units/tablets/capsules prescribed or dispensed (can be partial, but then only 1/2 or 1/3, not 0.01). Clinical drugs with divisible dose forms (injections) the quantity is the amount of ingredient the patient got. For example, if the injection is 2mg/mL but the patient got 80mL then quantity is reported as 160.\nQuantified clinical drugs with divisible dose forms (prefilled syringes), the quantity is the amount of ingredient similar to clinical drugs. Please see [how to calculate drug dose](https://ohdsi.github.io/CommonDataModel/drug_dose.html) for more information.","etl":"To find the dose form of a drug the RELATIONSHIP table can be used where the relationship_id is 'Has dose form'. If liquid, quantity stands for the total amount dispensed or ordered of ingredient in the units given by the drug_strength table. If the unit from the source data does not align with the unit in the DRUG_STRENGTH table the quantity should be converted to the correct unit given in DRUG_STRENGTH. For clinical drugs with fixed dose forms (tablets etc.) the quantity is the number of units/tablets/capsules prescribed or dispensed (can be partial, but then only 1/2 or 1/3, not 0.01). Clinical drugs with divisible dose forms (injections) the quantity is the amount of ingredient the patient got. For example, if the injection is 2mg/mL but the patient got 80mL then quantity is reported as 160.\nQuantified clinical drugs with divisible dose forms (prefilled syringes), the quantity is the amount of ingredient similar to clinical drugs. Please see [how to calculate drug dose](https://ohdsi.github.io/CommonDataModel/drug_dose.html) for more information.","flags":[],"descFrom":"etlConventions (userGuidance empty)"},{"name":"days_supply","type":"integer","dictType":"integer","required":false,"pk":false,"dictPk":false,"desc":"The number of days of supply of the medication as recorded in the original prescription or dispensing record. Days supply can differ from actual drug duration (i.e. prescribed days supply vs actual exposure).\",\"The field should be left empty if the source data does not contain a verbatim days_supply, and should not be calculated from other fields.<br><br>Negative values are not allowed. If the source has negative days supply the record should be dropped as it is unknown if the patient actually took the drug. Several actions are possible: 1) record is not trustworthy and we remove the record entirely. 2) we trust the record and leave days_supply empty or 3) record needs to be combined with other record (e.g. reversal of prescription). High values (>365 days) should be investigated. If considered an error in the source data (e.g. typo), the value needs to be excluded to prevent creation of unrealistic long eras.","etl":"The number of days of supply of the medication as recorded in the original prescription or dispensing record. Days supply can differ from actual drug duration (i.e. prescribed days supply vs actual exposure).\",\"The field should be left empty if the source data does not contain a verbatim days_supply, and should not be calculated from other fields.<br><br>Negative values are not allowed. If the source has negative days supply the record should be dropped as it is unknown if the patient actually took the drug. Several actions are possible: 1) record is not trustworthy and we remove the record entirely. 2) we trust the record and leave days_supply empty or 3) record needs to be combined with other record (e.g. reversal of prescription). High values (>365 days) should be investigated. If considered an error in the source data (e.g. typo), the value needs to be excluded to prevent creation of unrealistic long eras.","flags":[],"descFrom":"etlConventions (userGuidance empty)"},{"name":"sig","type":"TEXT","dictType":"varchar(MAX)","required":false,"pk":false,"dictPk":false,"desc":"This is the verbatim instruction for the drug as written by the provider.","etl":"Put the written out instructions for the drug as it is verbatim in the source, if available.","flags":[]},{"name":"route_concept_id","type":"integer","dictType":"integer","required":false,"pk":false,"dictPk":false,"desc":"The standard CONCEPT_ID that the ROUTE_SOURCE_VALUE maps to in the route domain. This is meant to represent the route of administration of the drug. [Accepted Concepts](https://athena.ohdsi.org/search-terms/terms?domain=Route&standardConcept=Standard&page=1&pageSize=15&query=)","etl":"The standard CONCEPT_ID that the ROUTE_SOURCE_VALUE maps to in the route domain. This is meant to represent the route of administration of the drug. [Accepted Concepts](https://athena.ohdsi.org/search-terms/terms?domain=Route&standardConcept=Standard&page=1&pageSize=15&query=)","flags":[],"descFrom":"etlConventions (userGuidance empty)"},{"name":"lot_number","type":"varchar(50)","dictType":"varchar(50)","required":false,"pk":false,"dictPk":false,"desc":"An identifier assigned to a particular quantity or lot of drug product from the manufacturer.","etl":"","flags":[]},{"name":"provider_id","type":"integer","dictType":"integer","required":false,"pk":false,"dictPk":false,"desc":"The Provider associated with drug record, e.g. the provider who wrote the prescription or the provider who administered the drug.","etl":"The ETL may need to make a choice as to which PROVIDER_ID to put here. Based on what is available this may or may not be different than the provider associated with the overall VISIT_OCCURRENCE record, for example the ordering vs administering physician on an EHR record.","flags":[]},{"name":"visit_occurrence_id","type":"integer","dictType":"integer","required":false,"pk":false,"dictPk":false,"desc":"The Visit during which the drug was prescribed, administered or dispensed.","etl":"To populate this field drug exposures must be explicitly initiated in the visit.","flags":[]},{"name":"visit_detail_id","type":"integer","dictType":"integer","required":false,"pk":false,"dictPk":false,"desc":"The VISIT_DETAIL record during which the drug exposure occurred. For example, if the person was in the ICU at the time of the drug administration the VISIT_OCCURRENCE record would reflect the overall hospital stay and the VISIT_DETAIL record would reflect the ICU stay during the hospital visit.","etl":"Same rules apply as for the VISIT_OCCURRENCE_ID.","flags":[]},{"name":"drug_source_value","type":"varchar(50)","dictType":"varchar(50)","required":false,"pk":false,"dictPk":false,"desc":"This field houses the verbatim value from the source data representing the drug exposure that occurred. For example, this could be an NDC or Gemscript code.","etl":"This code is mapped to a Standard Drug Concept in the Standardized Vocabularies and the original code is stored here for reference.","flags":[]},{"name":"drug_source_concept_id","type":"integer","dictType":"integer","required":false,"pk":false,"dictPk":false,"desc":"This is the concept representing the drug source value and may not necessarily be standard. This field is discouraged from use in analysis because it is not required to contain Standard Concepts that are used across the OHDSI community, and should only be used when Standard Concepts do not adequately represent the source detail for the Drug necessary for a given analytic use case. Consider using DRUG_CONCEPT_ID instead to enable standardized analytics that can be consistent across the network.","etl":"If the DRUG_SOURCE_VALUE is coded in the source data using an OMOP supported vocabulary put the concept id representing the source value here.","flags":[]},{"name":"route_source_value","type":"varchar(50)","dictType":"varchar(50)","required":false,"pk":false,"dictPk":false,"desc":"This field houses the verbatim value from the source data representing the drug route.","etl":"This information may be called something different in the source data but the field is meant to contain a value indicating when and how a drug was given to a patient. This source value is mapped to a standard concept which is stored in the ROUTE_CONCEPT_ID field.","flags":[]},{"name":"dose_unit_source_value","type":"varchar(50)","dictType":"varchar(50)","required":false,"pk":false,"dictPk":false,"desc":"This field houses the verbatim value from the source data representing the dose unit of the drug given.","etl":"This information may be called something different in the source data but the field is meant to contain a value indicating the unit of dosage of drug given to the patient. **This is an older column and will be deprecated in an upcoming version.**","flags":[]}],"isLookup":false,"pos":null,"summary":"23 columns, PK drug_exposure_id. References 5 table(s) incl. CONCEPT via 4 *_concept_id columns. Referenced by 2 table(s).","hub":false},{"id":"drug_strength","schema":"VOCAB","name":"drug_strength","area":"vocab","description":"The DRUG_STRENGTH table contains structured content about the amount or concentration and associated units of a specific ingredient contained within a particular drug product. This table is supplemental information to support standardized analysis of drug utilization.","guidance":"","pk":[],"columns":[{"name":"drug_concept_id","type":"integer","dictType":"integer","required":true,"pk":false,"dictPk":false,"desc":"The Concept representing the Branded Drug or Clinical Drug Product.","etl":"","flags":[]},{"name":"ingredient_concept_id","type":"integer","dictType":"integer","required":true,"pk":false,"dictPk":false,"desc":"The Concept representing the active ingredient contained within the drug product.","etl":"Combination Drugs will have more than one record in this table, one for each active Ingredient.","flags":[]},{"name":"amount_value","type":"NUMERIC","dictType":"float","required":false,"pk":false,"dictPk":false,"desc":"The numeric value or the amount of active ingredient contained within the drug product.","etl":"","flags":[]},{"name":"amount_unit_concept_id","type":"integer","dictType":"integer","required":false,"pk":false,"dictPk":false,"desc":"The Concept representing the Unit of measure for the amount of active ingredient contained within the drug product.","etl":"","flags":[]},{"name":"numerator_value","type":"NUMERIC","dictType":"float","required":false,"pk":false,"dictPk":false,"desc":"The concentration of the active ingredient contained within the drug product.","etl":"","flags":[]},{"name":"numerator_unit_concept_id","type":"integer","dictType":"integer","required":false,"pk":false,"dictPk":false,"desc":"The Concept representing the Unit of measure for the concentration of active ingredient.","etl":"","flags":[]},{"name":"denominator_value","type":"NUMERIC","dictType":"float","required":false,"pk":false,"dictPk":false,"desc":"The amount of total liquid (or other divisible product, such as ointment, gel, spray, etc.).","etl":"","flags":[]},{"name":"denominator_unit_concept_id","type":"integer","dictType":"integer","required":false,"pk":false,"dictPk":false,"desc":"The Concept representing the denominator unit for the concentration of active ingredient.","etl":"","flags":[]},{"name":"box_size","type":"integer","dictType":"integer","required":false,"pk":false,"dictPk":false,"desc":"The number of units of Clinical Branded Drug or Quantified Clinical or Branded Drug contained in a box as dispensed to the patient.","etl":"","flags":[]},{"name":"valid_start_date","type":"date","dictType":"date","required":true,"pk":false,"dictPk":false,"desc":"The date when the Concept was first\nrecorded. The default value is\n1-Jan-1970.","etl":"","flags":[]},{"name":"valid_end_date","type":"date","dictType":"date","required":true,"pk":false,"dictPk":false,"desc":"The date when then Concept became invalid.","etl":"","flags":[]},{"name":"invalid_reason","type":"varchar(1)","dictType":"varchar(1)","required":false,"pk":false,"dictPk":false,"desc":"Reason the concept was invalidated. Possible values are D (deleted), U (replaced with an update) or NULL when valid_end_date has the default value.","etl":"","flags":[]}],"isLookup":true,"pos":null,"summary":"12 columns, PK none. References 1 table(s) incl. CONCEPT via 5 *_concept_id columns.","hub":false},{"id":"episode","schema":"CDM","name":"episode","area":"clinical","description":"The EPISODE table aggregates lower-level clinical events (VISIT_OCCURRENCE, DRUG_EXPOSURE, PROCEDURE_OCCURRENCE, DEVICE_EXPOSURE) into a higher-level abstraction representing clinically and analytically relevant disease phases,outcomes and treatments. The EPISODE_EVENT table connects qualifying clinical events (VISIT_OCCURRENCE, DRUG_EXPOSURE, PROCEDURE_OCCURRENCE, DEVICE_EXPOSURE) to the appropriate EPISODE entry. For example cancers including their development over time, their treatment, and final resolution.","guidance":"Valid Episode Concepts belong to the 'Episode' domain. For more information on how to populate this table, please see the [article](https://ohdsi.github.io/OncologyWG/model.html#episodes) on the Oncology Workgroup website. If your source data does not have all episodes that are relevant to the therapeutic area, write only those you can easily derive from the data. It is understood that that table is not currently expected to be comprehensive.","pk":["episode_id"],"columns":[{"name":"episode_id","type":"integer","dictType":"integer","required":true,"pk":true,"dictPk":true,"desc":"A unique identifier for each Episode.","etl":"","flags":[]},{"name":"person_id","type":"integer","dictType":"integer","required":true,"pk":false,"dictPk":false,"desc":"The PERSON_ID of the PERSON for whom the episode is recorded.","etl":"","flags":[]},{"name":"episode_concept_id","type":"integer","dictType":"integer","required":true,"pk":false,"dictPk":false,"desc":"The EPISODE_CONCEPT_ID represents the kind abstraction related to the disease phase, outcome or treatment.","etl":"Choose a concept in the Episode domain that best represents the ongoing disease phase, outcome, or treatment. Please see [article] for cancers and [article] for non-cancers describing how these are defined. [Accepted Concepts](https://athena.ohdsi.org/search-terms/terms?domain=Episode&page=1&pageSize=15&query=)","flags":[]},{"name":"episode_start_date","type":"date","dictType":"date","required":true,"pk":false,"dictPk":false,"desc":"The date when the Episode beings.","etl":"Please see [article] for how to define an Episode start date.","flags":[]},{"name":"episode_start_datetime","type":"TIMESTAMP","dictType":"datetime","required":false,"pk":false,"dictPk":false,"desc":"The date and time when the Episode begins.","etl":"","flags":[]},{"name":"episode_end_date","type":"date","dictType":"date","required":false,"pk":false,"dictPk":false,"desc":"The date when the instance of the Episode is considered to have ended.","etl":"Please see [article] for how to define an Episode end date.","flags":[]},{"name":"episode_end_datetime","type":"TIMESTAMP","dictType":"datetime","required":false,"pk":false,"dictPk":false,"desc":"The date when the instance of the Episode is considered to have ended.","etl":"","flags":[]},{"name":"episode_parent_id","type":"integer","dictType":"integer","required":false,"pk":false,"dictPk":false,"desc":"Use this field to find the Episode that subsumes the given Episode record. This is used in the case that an Episode are nested into each other.","etl":"If there are multiple nested levels to how Episodes are represented, the EPISODE_PARENT_ID can be used to record this relationship.","flags":[]},{"name":"episode_number","type":"integer","dictType":"integer","required":false,"pk":false,"dictPk":false,"desc":"For sequences of episodes, this is used to indicate the order the episodes occurred. For example, lines of treatment could be indicated here.","etl":"Please see [article] for the details of how to count episodes.","flags":[]},{"name":"episode_object_concept_id","type":"integer","dictType":"integer","required":true,"pk":false,"dictPk":false,"desc":"A Standard Concept representing the disease phase, outcome, or other abstraction of which the episode consists.  For example, if the EPISODE_CONCEPT_ID is [treatment regimen](https://athena.ohdsi.org/search-terms/terms/32531) then the EPISODE_OBJECT_CONCEPT_ID should contain the chemotherapy regimen concept, like [Afatinib monotherapy](https://athena.ohdsi.org/search-terms/terms/35804392).","etl":"Episode entries from the 'Disease Episode' concept class should have an episode_object_concept_id that comes from the Condition domain.  Episode entries from the 'Treatment Episode' concept class should have an episode_object_concept_id that scome from the 'Procedure' domain or 'Regimen' concept class.","flags":[]},{"name":"episode_type_concept_id","type":"integer","dictType":"integer","required":true,"pk":false,"dictPk":false,"desc":"This field can be used to determine the provenance of the Episode record, as in whether the episode was from an EHR system, insurance claim, registry, or other sources.","etl":"Choose the EPISODE_TYPE_CONCEPT_ID that best represents the provenance of the record. [Accepted Concepts](https://athena.ohdsi.org/search-terms/terms?domain=Type+Concept&standardConcept=Standard&page=1&pageSize=15&query=). A more detailed explanation of each Type Concept can be found on the [vocabulary wiki](https://github.com/OHDSI/Vocabulary-v5.0/wiki/Vocab.-TYPE_CONCEPT).","flags":[]},{"name":"episode_source_value","type":"varchar(50)","dictType":"varchar(50)","required":false,"pk":false,"dictPk":false,"desc":"The source code for the Episode as it appears in the source data. This code is mapped to a Standard Condition Concept in the Standardized Vocabularies and the original code is stored here for reference.","etl":"","flags":[]},{"name":"episode_source_concept_id","type":"integer","dictType":"integer","required":false,"pk":false,"dictPk":false,"desc":"A foreign key to a Episode Concept that refers to the code used in the source.","etl":"Given that the Episodes are user-defined it is unlikely that there will be a Source Concept available. If that is the case then set this field to zero.","flags":[]}],"isLookup":false,"pos":null,"summary":"13 columns, PK episode_id. References 2 table(s) incl. CONCEPT via 4 *_concept_id columns. Referenced by 1 table(s).","hub":false},{"id":"episode_event","schema":"CDM","name":"episode_event","area":"clinical","description":"The EPISODE_EVENT table connects qualifying clinical events (such as CONDITION_OCCURRENCE, DRUG_EXPOSURE, PROCEDURE_OCCURRENCE, MEASUREMENT) to the appropriate EPISODE entry. For example, linking the precise location of the metastasis (cancer modifier in MEASUREMENT) to the disease episode.","guidance":"This connecting table is used instead of the FACT_RELATIONSHIP table for linking low-level events to abstracted Episodes.","pk":[],"columns":[{"name":"episode_id","type":"integer","dictType":"integer","required":true,"pk":false,"dictPk":false,"desc":"Use this field to link the EPISODE_EVENT record to its EPISODE.","etl":"Put the EPISODE_ID that subsumes the EPISODE_EVENT record here.","flags":[]},{"name":"event_id","type":"integer","dictType":"integer","required":true,"pk":false,"dictPk":false,"desc":"This field is the primary key of the linked record in the database. For example, if the Episode Event is a Condition Occurrence, then the CONDITION_OCCURRENCE_ID of the linked record goes in this field.","etl":"Put the primary key of the linked record here.","flags":[]},{"name":"episode_event_field_concept_id","type":"integer","dictType":"integer","required":true,"pk":false,"dictPk":false,"desc":"This field is the CONCEPT_ID that identifies which table the primary key of the linked record came from.","etl":"Put the CONCEPT_ID that identifies which table and field the EVENT_ID came from. [Accepted Concepts](https://athena.ohdsi.org/search-terms/terms?vocabulary=CDM&conceptClass=Field&page=1&pageSize=15&query=)","flags":[]}],"isLookup":false,"pos":null,"summary":"3 columns, PK none. References 5 table(s) incl. CONCEPT via 1 *_concept_id columns.","hub":false},{"id":"fact_relationship","schema":"CDM","name":"fact_relationship","area":"clinical","description":"The FACT_RELATIONSHIP table contains records about the relationships between facts stored as records in any table of the CDM. Relationships can be defined between facts from the same domain, or different domains. Examples of Fact Relationships include: [Person relationships](https://athena.ohdsi.org/search-terms/terms?domain=Relationship&standardConcept=Standard&page=2&pageSize=15&query=) (parent-child), care site relationships (hierarchical organizational structure of facilities within a health system), indication relationship (between drug exposures and associated conditions), usage relationships (of devices during the course of an associated procedure), or facts derived from one another (measurements derived from an associated specimen).","guidance":"","pk":[],"columns":[{"name":"domain_concept_id_1","type":"integer","dictType":"integer","required":true,"pk":false,"dictPk":false,"desc":"","etl":"","flags":[]},{"name":"fact_id_1","type":"integer","dictType":"integer","required":true,"pk":false,"dictPk":false,"desc":"","etl":"","flags":[]},{"name":"domain_concept_id_2","type":"integer","dictType":"integer","required":true,"pk":false,"dictPk":false,"desc":"","etl":"","flags":[]},{"name":"fact_id_2","type":"integer","dictType":"integer","required":true,"pk":false,"dictPk":false,"desc":"","etl":"","flags":[]},{"name":"relationship_concept_id","type":"integer","dictType":"integer","required":true,"pk":false,"dictPk":false,"desc":"","etl":"","flags":[]}],"isLookup":false,"pos":null,"summary":"5 columns, PK none. References 1 table(s) incl. CONCEPT via 3 *_concept_id columns.","hub":false},{"id":"location","schema":"CDM","name":"location","area":"system","description":"The LOCATION table represents a generic way to capture physical location or address information of Persons and Care Sites.","guidance":"The current iteration of the LOCATION table is US centric. Until a major release to correct this, certain fields can be used to represent different international values. <br><br> - STATE can also be used for province or district<br>- ZIP is also the postal code or postcode <br>- COUNTY can also be used to represent region","pk":["location_id"],"columns":[{"name":"location_id","type":"integer","dictType":"integer","required":true,"pk":true,"dictPk":true,"desc":"The unique key given to a unique Location.","etl":"Each instance of a Location in the source data should be assigned this unique key.","flags":[]},{"name":"address_1","type":"varchar(50)","dictType":"varchar(50)","required":false,"pk":false,"dictPk":false,"desc":"This is the first line of the address.","etl":"","flags":[]},{"name":"address_2","type":"varchar(50)","dictType":"varchar(50)","required":false,"pk":false,"dictPk":false,"desc":"This is the second line of the address","etl":"","flags":[]},{"name":"city","type":"varchar(50)","dictType":"varchar(50)","required":false,"pk":false,"dictPk":false,"desc":"","etl":"","flags":[]},{"name":"state","type":"varchar(2)","dictType":"varchar(2)","required":false,"pk":false,"dictPk":false,"desc":"","etl":"","flags":[]},{"name":"zip","type":"varchar(9)","dictType":"varchar(9)","required":false,"pk":false,"dictPk":false,"desc":"Zip codes are handled as strings of up to 9 characters length. For US addresses, these represent either a 3-digit abbreviated Zip code as provided by many sources for patient protection reasons, the full 5-digit Zip or the 9-digit (ZIP + 4) codes. Unless for specific reasons analytical methods should expect and utilize only the first 3 digits. For international addresses, different rules apply.","etl":"Zip codes are handled as strings of up to 9 characters length. For US addresses, these represent either a 3-digit abbreviated Zip code as provided by many sources for patient protection reasons, the full 5-digit Zip or the 9-digit (ZIP + 4) codes. Unless for specific reasons analytical methods should expect and utilize only the first 3 digits. For international addresses, different rules apply.","flags":[],"descFrom":"etlConventions (userGuidance empty)"},{"name":"county","type":"varchar(20)","dictType":"varchar(20)","required":false,"pk":false,"dictPk":false,"desc":"","etl":"","flags":[]},{"name":"location_source_value","type":"varchar(50)","dictType":"varchar(50)","required":false,"pk":false,"dictPk":false,"desc":"Put the verbatim value for the location here, as it shows up in the source.","etl":"Put the verbatim value for the location here, as it shows up in the source.","flags":[],"descFrom":"etlConventions (userGuidance empty)"},{"name":"country_concept_id","type":"integer","dictType":"integer","required":false,"pk":false,"dictPk":false,"desc":"The Concept Id representing the country. Values should conform to the [Geography](https://athena.ohdsi.org/search-terms/terms?domain=Geography&standardConcept=Standard&vocabulary=OSM&vocabulary=SNOMED&conceptClass=2nd+level&conceptClass=Location&page=1&pageSize=500&query=) domain.","etl":"","flags":[]},{"name":"country_source_value","type":"varchar(80)","dictType":"varchar(80)","required":false,"pk":false,"dictPk":false,"desc":"The name of the country.","etl":"","flags":[]},{"name":"latitude","type":"NUMERIC","dictType":"float","required":false,"pk":false,"dictPk":false,"desc":"Must be between -90 and 90.","etl":"Must be between -90 and 90.","flags":[],"descFrom":"etlConventions (userGuidance empty)"},{"name":"longitude","type":"NUMERIC","dictType":"float","required":false,"pk":false,"dictPk":false,"desc":"Must be between -180 and 180.","etl":"Must be between -180 and 180.","flags":[],"descFrom":"etlConventions (userGuidance empty)"}],"isLookup":false,"pos":null,"summary":"12 columns, PK location_id. References 1 table(s) incl. CONCEPT via 1 *_concept_id columns. Referenced by 2 table(s).","hub":false},{"id":"measurement","schema":"CDM","name":"measurement","area":"clinical","description":"The MEASUREMENT table contains records of Measurements, i.e. structured values (numerical or categorical) obtained through systematic and standardized examination or testing of a Person or Person's sample. The MEASUREMENT table contains both orders and results of such Measurements as laboratory tests, vital signs, quantitative findings from pathology reports, etc. Measurements are stored as attribute value pairs, with the attribute as the Measurement Concept and the value representing the result. The value can be a Concept (stored in VALUE_AS_CONCEPT), or a numerical value (VALUE_AS_NUMBER) with a Unit (UNIT_CONCEPT_ID). The Procedure for obtaining the sample is housed in the PROCEDURE_OCCURRENCE table, though it is unnecessary to create a PROCEDURE_OCCURRENCE record for each measurement if one does not exist in the source data. Measurements differ from Observations in that they require a standardized test or some other activity to generate a quantitative or qualitative result. If there is no result, it is assumed that the lab test was conducted but the result was not captured.","guidance":"Measurements are predominately lab tests with a few exceptions, like blood pressure or function tests. Results are given in the form of a value and unit combination. When investigating measurements, look for operator_concept_ids (<, >, etc.).","pk":["measurement_id"],"columns":[{"name":"measurement_id","type":"integer","dictType":"integer","required":true,"pk":true,"dictPk":true,"desc":"The unique key given to a Measurement record for a Person. Refer to the ETL for how duplicate Measurements during the same Visit were handled.","etl":"Each instance of a measurement present in the source data should be assigned this unique key. In some cases, a person can have multiple records of the same measurement within the same visit. It is valid to keep these duplicates and assign them individual, unique, MEASUREMENT_IDs, though it is up to the ETL how they should be handled.","flags":[]},{"name":"person_id","type":"integer","dictType":"integer","required":true,"pk":false,"dictPk":false,"desc":"The PERSON_ID of the Person for whom the Measurement is recorded. This may be a system generated code.","etl":"","flags":[]},{"name":"measurement_concept_id","type":"integer","dictType":"integer","required":true,"pk":false,"dictPk":false,"desc":"The MEASUREMENT_CONCEPT_ID field is recommended for primary use in analyses, and must be used for network studies. This is the standard concept mapped from the source value which represents a measurement.","etl":"The standard CONCEPT_ID that represents the MEASUREMENT_SOURCE_VALUE. The concept id should be derived either from mapping from the source concept id or by picking the measurement concept representing the most amount of detail you have. Only records whose source values map to concepts with a domain of Measurement should go in this table.","flags":[]},{"name":"measurement_date","type":"date","dictType":"date","required":true,"pk":false,"dictPk":false,"desc":"Use this date to determine the date of the measurement.","etl":"If there are multiple dates in the source data associated with a record such as order_date, draw_date, and result_date, choose the one that is closest to the date the sample was drawn from the patient.","flags":[]},{"name":"measurement_datetime","type":"TIMESTAMP","dictType":"datetime","required":false,"pk":false,"dictPk":false,"desc":"This is not required. If a source does not specify datetime the convention is to set to NULL.","etl":"This is not required. If a source does not specify datetime the convention is to set to NULL.","flags":[],"descFrom":"etlConventions (userGuidance empty)"},{"name":"measurement_time","type":"varchar(10)","dictType":"varchar(10)","required":false,"pk":false,"dictPk":false,"desc":"This is present for backwards compatibility and will be deprecated in an upcoming version.","etl":"This is present for backwards compatibility and will be deprecated in an upcoming version.","flags":[],"descFrom":"etlConventions (userGuidance empty)"},{"name":"measurement_type_concept_id","type":"integer","dictType":"integer","required":true,"pk":false,"dictPk":false,"desc":"This field can be used to determine the provenance of the Measurement record, as in whether the measurement was from an EHR system, insurance claim, registry, or other sources.","etl":"Choose the MEASUREMENT_TYPE_CONCEPT_ID that best represents the provenance of the record, for example whether it came from an EHR record or billing claim. [Accepted Concepts](https://athena.ohdsi.org/search-terms/terms?domain=Type+Concept&standardConcept=Standard&page=1&pageSize=15&query=). A more detailed explanation of each Type Concept can be found on the [vocabulary wiki](https://github.com/OHDSI/Vocabulary-v5.0/wiki/Vocab.-TYPE_CONCEPT).","flags":[]},{"name":"operator_concept_id","type":"integer","dictType":"integer","required":false,"pk":false,"dictPk":false,"desc":"The meaning of Concept [4172703](https://athena.ohdsi.org/search-terms/terms/4172703) for '=' is identical to omission of a OPERATOR_CONCEPT_ID value. Since the use of this field is rare, it's important when devising analyses to not to forget testing for the content of this field for values different from =.","etl":"Operators are <, <=, =, >=, > and these concepts belong to the 'Meas Value Operator' domain. [Accepted Concepts](https://athena.ohdsi.org/search-terms/terms?domain=Meas+Value+Operator&standardConcept=Standard&page=1&pageSize=15&query=). The operator_concept_id explictly refers to the value of the measurement. Leave it NULL if there's an exact numeric value given (instead of putting '=') or there's no numeric value at all.","flags":[]},{"name":"value_as_number","type":"NUMERIC","dictType":"float","required":false,"pk":false,"dictPk":false,"desc":"This is the numerical value of the Result of the Measurement, if available. Note that measurements such as blood pressures will be split into their component parts i.e. one record for systolic, one record for diastolic.","etl":"[Convention for negative values](https://ohdsi.github.io/Themis/negative_value_as_number.html)","flags":[]},{"name":"value_as_concept_id","type":"integer","dictType":"integer","required":false,"pk":false,"dictPk":false,"desc":"If the raw data gives a categorial result for measurements those values are captured and mapped to standard concepts. This can be done manually or using the \"Maps to value\" relationship in the vocabulary.","etl":"If there is no categorial result in the source data, set VALUE_AS_CONCEPT_ID to NULL, if there is a categorial result in a source data but without mapping, set VALUE_AS_CONCEPT_ID to 0, else map to a CONCEPT_ID. These are also mapped using the \"Maps to value\" relationship in the vocabulary.","flags":[]},{"name":"unit_concept_id","type":"integer","dictType":"integer","required":false,"pk":false,"dictPk":false,"desc":"At present, there isn't a prescribed unit for individual measurements, such as Hemoglobin A1C, meaning it's not obligatory to express these measurements as a percentage. UNIT_SOURCE_VALUES should be linked to a Standard Concept within the Unit domain that most accurately reflects the unit provided in the source data.","etl":"If the source data does not include units, set UNIT_CONCEPT_ID to NULL. If units are provided but not mapped, set UNIT_CONCEPT_ID to 0. Otherwise, map the units to a CONCEPT_ID. Remember that units are case-sensitive in vocabulary.","flags":[]},{"name":"range_low","type":"NUMERIC","dictType":"float","required":false,"pk":false,"dictPk":false,"desc":"Ranges have the same unit as the VALUE_AS_NUMBER. These ranges are provided by the source and should remain NULL if not given.","etl":"If reference ranges for upper and lower limit of normal as provided (typically by a laboratory) these are stored in the RANGE_HIGH and RANGE_LOW fields. This should be set to NULL if not provided.","flags":[]},{"name":"range_high","type":"NUMERIC","dictType":"float","required":false,"pk":false,"dictPk":false,"desc":"Ranges have the same unit as the VALUE_AS_NUMBER. These ranges are provided by the source and should remain NULL if not given.","etl":"If reference ranges for upper and lower limit of normal as provided (typically by a laboratory) these are stored in the RANGE_HIGH and RANGE_LOW fields. This should be set to NULL if not provided.","flags":[]},{"name":"provider_id","type":"integer","dictType":"integer","required":false,"pk":false,"dictPk":false,"desc":"The provider associated with measurement record, e.g. the provider who ordered the test or the provider who recorded the result.","etl":"The ETL may need to make a choice as to which PROVIDER_ID to put here. Based on what is available this may or may not be different than the provider associated with the overall VISIT_OCCURRENCE record. For example the admitting vs attending physician on an EHR record.","flags":[]},{"name":"visit_occurrence_id","type":"integer","dictType":"integer","required":false,"pk":false,"dictPk":false,"desc":"The visit during which the Measurement occurred.","etl":"Depending on the structure of the source data, this may have to be determined based on dates. If a MEASUREMENT_DATE occurs within the start and end date of a Visit it is a valid ETL choice to choose the VISIT_OCCURRENCE_ID from the visit that subsumes it, even if not explicitly stated in the data. While not required, an attempt should be made to locate the VISIT_OCCURRENCE_ID of the measurement record. If a measurement is related to a visit explicitly in the source data, it is possible that the result date of the Measurement falls outside of the bounds of the Visit dates.","flags":[]},{"name":"visit_detail_id","type":"integer","dictType":"integer","required":false,"pk":false,"dictPk":false,"desc":"The VISIT_DETAIL record during which the Measurement occurred. For example, if the Person was in the ICU at the time the VISIT_OCCURRENCE record would reflect the overall hospital stay and the VISIT_DETAIL record would reflect the ICU stay during the hospital visit.","etl":"Same rules apply as for the VISIT_OCCURRENCE_ID.","flags":[]},{"name":"measurement_source_value","type":"varchar(50)","dictType":"varchar(50)","required":false,"pk":false,"dictPk":false,"desc":"This field contains the exact value from the source data that represents the measurement that occurred.","etl":"This value corresponds to a standardized CONCEPT_ID found in MEASUREMENT_CONCEPT_ID and in the 'Measurement' domain within the Standardized Vocabularies. The original code is retained here for reference purposes.","flags":[]},{"name":"measurement_source_concept_id","type":"integer","dictType":"integer","required":false,"pk":false,"dictPk":false,"desc":"This is the concept representing the MEASUREMENT_SOURCE_VALUE and may not necessarily be standard. This field is discouraged from use in analysis because it is not required to contain Standard Concepts that are used across the OHDSI community, and should only be used when Standard Concepts do not adequately represent the source detail for the Measurement necessary for a given analytic use case. Consider using MEASUREMENT_CONCEPT_ID instead to enable standardized analytics that can be consistent across the network.","etl":"If the MEASUREMENT_SOURCE_VALUE is coded in the source data using a vocabulary supported by OMOP Standardized Vocabularies, insert the CONCEPT_ID representing the source value here.","flags":[]},{"name":"unit_source_value","type":"varchar(50)","dictType":"varchar(50)","required":false,"pk":false,"dictPk":false,"desc":"This field contains the exact value from the source data that represents the unit of measurement used.","etl":"This value corresponds to a standardized CONCEPT_ID found in UNIT_CONCEPT_ID and in the 'Unit' domain within the Standardized Vocabularies. The original code is retained here for reference purposes.","flags":[]},{"name":"unit_source_concept_id","type":"integer","dictType":"integer","required":false,"pk":false,"dictPk":false,"desc":"\"This is the concept representing the UNIT_SOURCE_VALUE and may not necessarily be standard. This field is discouraged from use in analysis because it is not required to contain Standard Concepts that are used across the OHDSI community, and should only be used when Standard Concepts do not adequately represent the source detail for the Measurement necessary for a given analytic use case. Consider using UNIT_CONCEPT_ID instead to enable standardized analytics that can be consistent across the network.\"","etl":"If the UNIT_SOURCE_VALUE is coded in the source data using an OMOP supported vocabulary put the concept id representing the source value here.","flags":[]},{"name":"value_source_value","type":"varchar(50)","dictType":"varchar(50)","required":false,"pk":false,"dictPk":false,"desc":"This field houses the verbatim result value of the Measurement from the source data .","etl":"If both a continuous and categorical result are given in the source data such that both VALUE_AS_NUMBER and VALUE_AS_CONCEPT_ID are both included, store the verbatim value that was mapped to VALUE_AS_CONCEPT_ID here.","flags":[]},{"name":"measurement_event_id","type":"integer","dictType":"integer","required":false,"pk":false,"dictPk":false,"desc":"If the Measurement record is related to another record in the database, this field is the primary key of the linked record.","etl":"Put the primary key of the linked record, if applicable, here.","flags":[]},{"name":"meas_event_field_concept_id","type":"integer","dictType":"integer","required":false,"pk":false,"dictPk":false,"desc":"If the Measurement record is related to another record in the database, this field is the CONCEPT_ID that identifies which table the primary key of the linked record came from.","etl":"Put the CONCEPT_ID that identifies which table and field the MEASUREMENT_EVENT_ID came from.","flags":[]}],"isLookup":false,"pos":null,"summary":"23 columns, PK measurement_id. References 7 table(s) incl. CONCEPT via 8 *_concept_id columns.","hub":false},{"id":"metadata","schema":"CDM","name":"metadata","area":"meta","description":"The METADATA table contains metadata information about a dataset that has been transformed to the OMOP Common Data Model.","guidance":"","pk":["metadata_id"],"columns":[{"name":"metadata_id","type":"integer","dictType":"integer","req ype":"integer","dictType":"integer","required":true,"pk":true,"dictPk":true,"desc":"A unique identifier for each note.","etl":"","flags":[]},{"name":"person_id","type":"integer","dictType":"integer","required":true,"pk":false,"dictPk":false,"desc":"","etl":"","flags":[]},{"name":"note_date","type":"date","dictType":"date","required":true,"pk":false,"dictPk":false,"desc":"The date the note was recorded.","etl":"","flags":[]},{"name":"note_datetime","type":"TIMESTAMP","dictType":"datetime","required":false,"pk":false,"dictPk":false,"desc":"If time is not given set the time to NULL.","etl":"If time is not given set the time to NULL.","flags":[],"descFrom":"etlConventions (userGuidance empty)"},{"name":"note_type_concept_id","type":"integer","dictType":"integer","required":true,"pk":false,"dictPk":false,"desc":"The provenance of the note. Most likely this will be EHR.","etl":"Put the source system of the note, as in EHR record. [Accepted Concepts](https://athena.ohdsi.org/search-terms/terms?standardConcept=Standard&domain=Type+Concept&page=1&pageSize=15&query=). A more detailed explanation of each Type Concept can be found on the [vocabulary wiki](https://github.com/OHDSI/Vocabulary-v5.0/wiki/Vocab.-TYPE_CONCEPT).","flags":[]},{"name":"note_class_concept_id","type":"integer","dictType":"integer","required":true,"pk":false,"dictPk":false,"desc":"A Standard Concept Id representing the HL7 LOINC\nDocument Type Vocabulary classification of the note.","etl":"Map the note classification to a Standard Concept. For more information see the ETL Conventions in the description of the NOTE table. [Accepted Concepts](https://athena.ohdsi.org/search-terms/terms?standardConcept=Standard&conceptClass=Doc+Kind&conceptClass=Doc+Role&conceptClass=Doc+Setting&conceptClass=Doc+Subject+Matter&conceptClass=Doc+Type+of+Service&domain=Meas+Value&page=1&pageSize=15&query=). This Concept can alternatively be represented by concepts with the relationship 'Kind of (LOINC)' to [706391](https://athena.ohdsi.org/search-terms/terms/706391) (Note).","flags":[]},{"name":"note_title","type":"varchar(250)","dictType":"varchar(250)","required":false,"pk":false,"dictPk":false,"desc":"The title of the note.","etl":"","flags":[]},{"name":"note_text","type":"TEXT","dictType":"varchar(MAX)","required":true,"pk":false,"dictPk":false,"desc":"The content of the note.","etl":"","flags":[]},{"name":"encoding_concept_id","type":"integer","dictType":"integer","required":true,"pk":false,"dictPk":false,"desc":"This is the Concept representing the character encoding type.","etl":"Put the Concept Id that represents the encoding character type here. Currently the only option is UTF-8 ([32678](https://athena.ohdsi.org/search-terms/terms/32678)). It the note is encoded in any other type, like ASCII then put 0.","flags":[]},{"name":"language_concept_id","type":"integer","dictType":"integer","required":true,"pk":false,"dictPk":false,"desc":"The language of the note.","etl":"Use Concepts that are descendants of the concept [4182347](https://athena.ohdsi.org/search-terms/terms/4182347) (World Languages).","flags":[]},{"name":"provider_id","type":"integer","dictType":"integer","required":false,"pk":false,"dictPk":false,"desc":"The Provider who wrote the note.","etl":"The ETL may need to make a determination on which provider to put here.","flags":[]},{"name":"visit_occurrence_id","type":"integer","dictType":"integer","required":false,"pk":false,"dictPk":false,"desc":"The Visit during which the note was written.","etl":"","flags":[]},{"name":"visit_detail_id","type":"integer","dictType":"integer","required":false,"pk":false,"dictPk":false,"desc":"The Visit Detail during which the note was written.","etl":"","flags":[]},{"name":"note_source_value","type":"varchar(50)","dictType":"varchar(50)","required":false,"pk":false,"dictPk":false,"desc":"The source value mapped to the NOTE_CLASS_CONCEPT_ID.","etl":"The source value mapped to the NOTE_CLASS_CONCEPT_ID.","flags":[],"descFrom":"etlConventions (userGuidance empty)"},{"name":"note_event_id","type":"integer","dictType":"integer","required":false,"pk":false,"dictPk":false,"desc":"If the Note record is related to another record in the database, this field is the primary key of the linked record.","etl":"Put the primary key of the linked record, if applicable, here.","flags":[]},{"name":"note_event_field_concept_id","type":"integer","dictType":"integer","required":false,"pk":false,"dictPk":false,"desc":"If the Note record is related to another record in the database, this field is the CONCEPT_ID that identifies which table the primary key of the linked record came from.","etl":"Put the CONCEPT_ID that identifies which table and field the NOTE_EVENT_ID came from.","flags":[]}],"isLookup":false,"pos":null,"summary":"16 columns, PK note_id. References 6 table(s) incl. CONCEPT via 5 *_concept_id columns. Referenced by 1 table(s).","hub":false},{"id":"note_nlp","schema":"CDM","name":"note_nlp","area":"clinical","description":"The NOTE_NLP table encodes all output of NLP on clinical notes. Each row represents a single extracted term from a note.","guidance":"","pk":["note_nlp_id"],"columns":[{"name":"note_nlp_id","type":"integer","dictType":"integer","required":true,"pk":true,"dictPk":true,"desc":"A unique identifier for the NLP record.","etl":"","flags":[]},{"name":"note_id","type":"integer","dictType":"integer","required":true,"pk":false,"dictPk":false,"desc":"This is the NOTE_ID for the NOTE record the NLP record is associated to.","etl":"","flags":[]},{"name":"section_concept_id","type":"integer","dictType":"integer","required":false,"pk":false,"dictPk":false,"desc":"The SECTION_CONCEPT_ID should be used to represent the note section contained in the NOTE_NLP record. These concepts can be found as parts of document panels and are based on the type of note written, i.e. a discharge summary. These panels can be found as concepts with the relationship 'Subsumes' to CONCEPT_ID [45875957](https://athena.ohdsi.org/search-terms/terms/45875957).","etl":"The SECTION_CONCEPT_ID should be used to represent the note section contained in the NOTE_NLP record. These concepts can be found as parts of document panels and are based on the type of note written, i.e. a discharge summary. These panels can be found as concepts with the relationship 'Subsumes' to CONCEPT_ID [45875957](https://athena.ohdsi.org/search-terms/terms/45875957).","flags":[],"descFrom":"etlConventions (userGuidance empty)"},{"name":"snippet","type":"varchar(250)","dictType":"varchar(250)","required":false,"pk":false,"dictPk":false,"desc":"A small window of text surrounding the term","etl":"","flags":[]},{"name":"offset","type":"varchar(50)","dictType":"varchar(50)","required":false,"pk":false,"dictPk":false,"desc":"Character offset of the extracted term in the input note","etl":"","flags":[]},{"name":"lexical_variant","type":"varchar(250)","dictType":"varchar(250)","required":true,"pk":false,"dictPk":false,"desc":"Raw text extracted from the NLP tool.","etl":"","flags":[]},{"name":"note_nlp_concept_id","type":"integer","dictType":"integer","required":false,"pk":false,"dictPk":false,"desc":"","etl":"","flags":[]},{"name":"note_nlp_source_concept_id","type":"integer","dictType":"integer","required":false,"pk":false,"dictPk":false,"desc":"","etl":"","flags":[]},{"name":"nlp_system","type":"varchar(250)","dictType":"varchar(250)","required":false,"pk":false,"dictPk":false,"desc":"Name and version of the NLP system that extracted the term. Useful for data provenance.","etl":"Name and version of the NLP system that extracted the term. Useful for data provenance.","flags":[],"descFrom":"etlConventions (userGuidance empty)"},{"name":"nlp_date","type":"date","dictType":"date","required":true,"pk":false,"dictPk":false,"desc":"The date of the note processing.","etl":"","flags":[]},{"name":"nlp_datetime","type":"TIMESTAMP","dictType":"datetime","required":false,"pk":false,"dictPk":false,"desc":"The date and time of the note processing.","etl":"","flags":[]},{"name":"term_exists","type":"varchar(1)","dictType":"varchar(1)","required":false,"pk":false,"dictPk":false,"desc":"Term_exists is defined as a flag that indicates if the patient actually has or had the condition. Any of the following modifiers would make Term_exists false:\nNegation = true\nSubject = [anything other than the patient]\nConditional = true/li>\nRule_out = true\nUncertain = very low certainty or any lower certainties\nA complete lack of modifiers would make Term_exists true.","etl":"Term_exists is defined as a flag that indicates if the patient actually has or had the condition. Any of the following modifiers would make Term_exists false:\nNegation = true\nSubject = [anything other than the patient]\nConditional = true/li>\nRule_out = true\nUncertain = very low certainty or any lower certainties\nA complete lack of modifiers would make Term_exists true.","flags":[],"descFrom":"etlConventions (userGuidance empty)"},{"name":"term_temporal","type":"varchar(50)","dictType":"varchar(50)","required":false,"pk":false,"dictPk":false,"desc":"Term_temporal is to indicate if a condition is present or just in the past. The following would be past:<br><br>\n- History = true\n- Concept_date = anything before the time of the report","etl":"Term_temporal is to indicate if a condition is present or just in the past. The following would be past:<br><br>\n- History = true\n- Concept_date = anything before the time of the report","flags":[],"descFrom":"etlConventions (userGuidance empty)"},{"name":"term_modifiers","type":"varchar(2000)","dictType":"varchar(2000)","required":false,"pk":false,"dictPk":false,"desc":"For the modifiers that are there, they would have to have these values:<br><br>\n- Negation = false\n- Subject = patient\n- Conditional = false\n- Rule_out = false\n- Uncertain = true or high or moderate or even low (could argue about low). Term_modifiers will concatenate all modifiers for different types of entities (conditions, drugs, labs etc) into one string. Lab values will be saved as one of the modifiers.","etl":"For the modifiers that are there, they would have to have these values:<br><br>\n- Negation = false\n- Subject = patient\n- Conditional = false\n- Rule_out = false\n- Uncertain = true or high or moderate or even low (could argue about low). Term_modifiers will concatenate all modifiers for different types of entities (conditions, drugs, labs etc) into one string. Lab values will be saved as one of the modifiers.","flags":[],"descFrom":"etlConventions (userGuidance empty)"}],"isLookup":false,"pos":null,"summary":"14 columns, PK note_nlp_id. References 2 table(s) incl. CONCEPT via 3 *_concept_id columns.","hub":false},{"id":"observation","schema":"CDM","name":"observation","area":"clinical","description":"The OBSERVATION table captures clinical facts about a Person obtained in the context of examination, questioning or a procedure. Any data that cannot be represented by any other domains, such as social and lifestyle facts, medical history, family history, etc. are recorded here.","guidance":"Observations differ from Measurements in that they do not require a standardized test or some other activity to generate clinical fact. Typical observations are medical history, family history, the stated need for certain treatment, social circumstances, lifestyle choices, healthcare utilization patterns, etc. If the generation clinical facts requires a standardized testing such as lab testing or imaging and leads to a standardized result, the data item is recorded in the MEASUREMENT table. If the clinical fact observed determines a sign, symptom, diagnosis of a disease or other medical condition, it is recorded in the CONDITION_OCCURRENCE table. Valid Observation Concepts are not enforced to be from any domain but they must not belong to the Condition, Procedure, Drug, Device, Specimen, or Measurement domains and they must be Standard Concepts. <br><br>The observation table usually records t
