<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Synthea CSV Explorer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: drafting-table app. Filter rail | diagram canvas | inspector. Under 900px the rail becomes a drawer and the inspector a bottom sheet. */
:root{
  --bg:#F3F5F7; --surface:#FFFFFF; --surface-2:#E9EDF2; --ink:#16212C; --muted:#5A6777; --line:#D3DAE2;
  --accent:#2950B8; --edge:#3F5266; --inf:#A86200; --hover:rgba(41,80,184,.07); --hlbg:rgba(41,80,184,.14); --lane:rgba(63,82,102,.045);
  --crit:#B8322A; --warn:#A86200; --low:#5A6777; --info:#24705F; --on-sev:#FFFFFF;
  --a1:#2950B8; --a2:#24705F; --a3:#8A5A00; --a4:#71489F; --a5:#5A6777; --a6:#A3436B;
  --ui:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E141A; --surface:#161F28; --surface-2:#1E2A36; --ink:#E3E9F0; --muted:#92A0B0; --line:#2B3846;
  --accent:#86A6FF; --edge:#8D9FB3; --inf:#E2A445; --hover:rgba(134,166,255,.08); --hlbg:rgba(134,166,255,.18); --lane:rgba(141,159,179,.05);
  --crit:#EF7A70; --warn:#E2A445; --low:#92A0B0; --info:#5CC0A6; --on-sev:#0E141A;
  --a1:#86A6FF; --a2:#5CC0A6; --a3:#E2A445; --a4:#B596E6; --a5:#92A0B0; --a6:#E58BB0; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0E141A; --surface:#161F28; --surface-2:#1E2A36; --ink:#E3E9F0; --muted:#92A0B0; --line:#2B3846;
  --accent:#86A6FF; --edge:#8D9FB3; --inf:#E2A445; --hover:rgba(134,166,255,.08); --hlbg:rgba(134,166,255,.18); --lane:rgba(141,159,179,.05);
  --crit:#EF7A70; --warn:#E2A445; --low:#92A0B0; --info:#5CC0A6; --on-sev:#0E141A;
  --a1:#86A6FF; --a2:#5CC0A6; --a3:#E2A445; --a4:#B596E6; --a5:#92A0B0; --a6:#E58BB0; color-scheme:dark }
[hidden]{display:none!important}
html{height:100%;box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:13.5px/1.45 var(--ui);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
#app{height:100%;display:grid;grid-template-rows:auto 1fr;min-height:0}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
code,.mono{font-family:var(--mono);font-size:.92em}

/* top bar */
.bar{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;padding-block:10px;border-bottom:1px solid var(--line)}
.brand{display:flex;gap:10px;align-items:center;min-width:0;flex:1 1 260px}
.brand svg{flex:none}
.brand h1{font-size:15px;line-height:1.2;margin:0;font-weight:650;letter-spacing:-.01em;text-wrap:balance}
.brand p{margin:0;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ctl{height:32px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:0 10px}
select.ctl{padding-right:6px}
.btn{height:32px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:0 12px;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-right:4px}
.search{position:relative}
.search input{width:240px;max-width:100%}
#qres{position:absolute;z-index:30;top:36px;left:0;width:340px;max-width:86vw;max-height:360px;overflow:auto;margin:0;padding:4px;list-style:none;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 10px 30px rgba(0,0,0,.18)}
#qres li{padding:6px 8px;border-radius:4px;cursor:pointer;display:flex;gap:8px;justify-content:space-between}
#qres li[aria-selected="true"],#qres li:hover{background:var(--hlbg)}
#qres .k{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.menu{position:relative}
.menu ul{position:absolute;right:0;top:36px;z-index:30;list-style:none;margin:0;padding:4px;min-width:230px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 10px 30px rgba(0,0,0,.18)}
.menu li button{width:100%;text-align:left;border:0;background:none;padding:7px 10px;border-radius:4px}
.menu li button:hover,.menu li button:focus-visible{background:var(--hlbg)}
.narrow{display:none}

/* main grid */
main{display:grid;grid-template-columns:230px minmax(0,1fr) 400px;min-height:0;gap:0}
#filters{border-right:1px solid var(--line);overflow:auto;padding:12px 14px 12px 0;min-height:0}
#filters h2{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin:14px 0 6px;font-weight:600}
#filters h2:first-child{margin-top:2px}
.fl{display:flex;align-items:center;gap:8px;padding:3px 0;cursor:pointer}
.fl input{margin:0;accent-color:var(--accent)}
.fl .n{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--muted);font-size:12px}
.sw{width:10px;height:10px;border-radius:2px;flex:none}
.ar0{background:var(--a1)}.ar1{background:var(--a2)}.ar2{background:var(--a3)}.ar3{background:var(--a4)}.ar4{background:var(--a5)}.ar5{background:var(--a6)}
.note{font-size:12px;color:var(--muted);margin:6px 0 0}

#stage{position:relative;min-width:0;min-height:0;overflow:hidden;background:var(--bg)}
#svg{width:100%;height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}
#svg.grabbing{cursor:grabbing}
.zoom{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;gap:4px}
.zoom .btn{width:36px;justify-content:center;padding:0}
#status{position:absolute;left:12px;bottom:10px;font-size:12px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:4px 8px;font-variant-numeric:tabular-nums;max-width:calc(100% - 24px)}
#legend{position:absolute;right:12px;bottom:10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:6px 10px;font-size:11.5px;color:var(--muted);display:flex;gap:12px;align-items:center;flex-wrap:wrap}
#legend span{display:inline-flex;gap:6px;align-items:center}
#tip{position:absolute;z-index:20;pointer-events:none;max-width:340px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 8px 24px rgba(0,0,0,.18);padding:8px 10px;font-size:12.5px}
#tip h4{margin:0 0 2px;font-size:13px}
#tip .m{color:var(--muted);font-size:11.5px}
#tip p{margin:4px 0 0}
#toast{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:6px 12px;border-radius:999px;font-size:12.5px;z-index:25}

/* inspector */
#panel{border-left:1px solid var(--line);display:grid;grid-template-rows:auto 1fr;min-height:0;background:var(--surface)}
.tabs{display:flex;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 12px;border-bottom:2px solid transparent;color:var(--muted);white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.tabs .close{margin-left:auto;display:none}
.pane{overflow:auto;padding:14px 16px 24px;min-height:0}
.pane h2{font-size:18px;margin:2px 0 4px;font-family:var(--mono);font-weight:600;word-break:break-word}
.pane h3{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin:18px 0 6px;font-weight:600;display:flex;gap:8px;align-items:center}
.pane p{margin:4px 0}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;border:1px solid var(--line);border-radius:999px;padding:1px 8px;color:var(--muted)}
.tag{font-size:10px;letter-spacing:.06em;text-transform:uppercase;border:1px dashed var(--muted);border-radius:3px;padding:0 4px;color:var(--muted);font-weight:500}
.sev{display:inline-block;min-width:44px;text-align:center;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border-radius:3px;padding:1px 5px;color:var(--on-sev)}
.sev.high{background:var(--crit)}.sev.med{background:var(--warn)}.sev.low{background:var(--low)}.sev.info{background:var(--info)}
.src{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:0 4px;border-radius:3px;border:1px solid}
.src.doc{color:var(--accent);border-color:var(--accent)}.src.inf{color:var(--inf);border-color:var(--inf);border-style:dashed}
.lnk{border:0;background:none;padding:0;color:var(--accent);font-family:var(--mono);font-size:12.5px;text-decoration:underline;text-underline-offset:2px;text-decoration-thickness:1px}
ul.list{list-style:none;margin:0;padding:0;display:grid;gap:6px}
ul.list li{line-height:1.4}
.sub{color:var(--muted);font-size:12px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:8px 0 0}
.kv dt{color:var(--muted);font-size:12px}.kv dd{margin:0;font-family:var(--mono);font-size:12.5px;word-break:break-word}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:12px 0}
.stat{border:1px solid var(--line);border-radius:var(--r);padding:8px 10px}
.stat b{display:block;font-size:20px;font-variant-numeric:tabular-nums;line-height:1.1}
.stat span{font-size:11.5px;color:var(--muted)}
.ctab{width:100%;border-collapse:collapse;font-size:12.5px}
.ctab th{text-align:left;font-weight:600;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;border-bottom:1px solid var(--line);padding:4px 6px;position:sticky;top:-14px;background:var(--surface)}
.ctab td{border-bottom:1px solid var(--line);padding:5px 6px;vertical-align:top}
.ctab tr.r{cursor:pointer}.ctab tr.r:hover td{background:var(--hover)}
.ctab .nm{font-family:var(--mono);word-break:break-all}
.ctab .ds{color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ctab tr.x td{background:var(--surface-2);font-size:12.5px}
.ctab tr.flag .nm{color:var(--warn)}
.ktag{font:700 9.5px var(--mono);color:var(--accent)}
.wrap{overflow-x:auto}
details>summary{cursor:pointer;color:var(--muted)}
.grp{border:1px solid var(--line);border-radius:var(--r);margin:0 0 8px}
.grp>summary{padding:8px 10px;display:flex;gap:8px;align-items:center;color:var(--ink);font-weight:600}
.grp>summary .n{margin-left:auto;color:var(--muted);font-weight:400;font-variant-numeric:tabular-nums}
.grp ul{padding:0 10px 10px}
.iss{display:grid;grid-template-columns:auto 1fr;gap:2px 8px;align-items:start}
.iss .ev{grid-column:2;font-size:11.5px;color:var(--muted)}
.path{border:1px solid var(--line);border-radius:var(--r);padding:10px;display:grid;gap:4px}
.path.on{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.path h4{margin:0;font-size:13.5px}
.chk{display:grid;grid-template-columns:auto 1fr;gap:4px 8px;font-size:12.5px}
.ok{color:var(--info);font-weight:700}.bad{color:var(--crit);font-weight:700}
input.filter{width:100%;margin:2px 0 8px}

/* modal */
#modal{position:fixed;inset:0;z-index:50;background:rgba(10,14,18,.45);display:grid;place-items:center;padding:20px max(16px,env(safe-area-inset-left,0px))}
#modal .box{background:var(--surface);border:1px solid var(--line);border-radius:10px;width:min(760px,100%);max-height:88%;display:grid;grid-template-rows:auto 1fr auto;min-height:0}
#modal header,#modal footer{padding:12px 16px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#modal header h2{margin:0;font-size:15px;flex:1}
#modal .mb{overflow:auto;padding:0 16px;min-height:0}
#modal textarea{width:100%;min-height:260px;font:12px/1.4 var(--mono);border:1px solid var(--line);border-radius:var(--r);background:var(--bg);padding:8px}
#modal img{max-width:100%;border:1px solid var(--line);border-radius:var(--r);background:var(--bg)}

@media (max-width:900px){
  main{grid-template-columns:minmax(0,1fr);position:relative}
  .narrow{display:inline-flex}
  .search input{width:170px}
  #filters{position:absolute;z-index:40;left:0;top:0;bottom:0;width:min(280px,85%);background:var(--surface);padding:12px 14px;border:1px solid var(--line);box-shadow:8px 0 24px rgba(0,0,0,.2);transform:translateX(-110%);transition:transform .2s}
  #filters.open{transform:none}
  #panel{position:absolute;z-index:35;left:0;right:0;bottom:0;height:56%;border:1px solid var(--line);border-radius:12px 12px 0 0;box-shadow:0 -8px 24px rgba(0,0,0,.18);transform:translateY(105%);transition:transform .2s;padding-bottom:env(safe-area-inset-bottom,0px)}
  #panel.open{transform:none}
  .tabs .close{display:inline-flex;position:sticky;right:0}
  .tabs button{padding:10px 9px}
  #legend{display:none}
}
@media (max-width:520px){ .lblw{display:none} .brand p{white-space:normal} }
@media (prefers-reduced-motion:reduce){ *{transition:none!important} }
</style>
</head>
<body>


<div id="app">
  <header class="bar">
    <div class="brand">
      <svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true"><rect x="1" y="5" width="11" height="20" rx="2" fill="none" stroke="currentColor" stroke-width="1.6"/><rect x="18" y="5" width="11" height="20" rx="2" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M12 15h6M12 11l3 4-3 4M18 12v6" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
      <div style="min-width:0"><h1 id="mname"></h1><p id="msub"></p></div>
    </div>
    <div class="tools">
      <div class="search">
        <input id="q" class="ctl" type="search" placeholder="Search tables, columns  ( / )" aria-label="Search tables and columns" role="combobox" aria-expanded="false" aria-controls="qres" aria-autocomplete="list" autocomplete="off">
        <ul id="qres" role="listbox" hidden></ul>
      </div>
      <label><span class="lbl lblw">Columns</span><select id="colmode" class="ctl" aria-label="Column display">
        <option value="names">Names only</option><option value="keys">Keys only</option><option value="all">All columns</option></select></label>
      <label><span class="lbl lblw">Layout</span><select id="layout" class="ctl" aria-label="Layout">
        <option value="original">Original</option><option value="area">By subject area</option><option value="auto">Auto-arrange</option>
        <option value="focus">Focus</option><option value="custom">Custom</option></select></label>
      <select id="hops" class="ctl" aria-label="Focus depth" hidden><option value="1">1 hop</option><option value="2">2 hops</option></select>
      <div class="menu">
        <button id="btnExport" class="btn" aria-haspopup="true" aria-expanded="false" aria-controls="exMenu">Export</button>
        <ul id="exMenu" hidden>
          <li><button data-ex="png">PNG of visible diagram</button></li>
          <li><button data-ex="rels">Relationships CSV</button></li>
          <li><button data-ex="cols">Merged columns CSV</button></li>
          <li><button data-ex="issues">Data issues CSV</button></li>
          <li><button data-ex="layout">Layout JSON</button></li>
          <li><button data-ex="import">Import layout JSON</button></li>
        </ul>
      </div>
      <button id="btnTheme" class="btn" aria-label="Theme: follow system">Theme: Auto</button>
      <button id="btnFilters" class="btn narrow" aria-controls="filters" aria-expanded="false">Filters</button>
      <button id="btnPanel" class="btn narrow" aria-controls="panel" aria-expanded="false">Details</button>
    </div>
  </header>
  <main>
    <aside id="filters" aria-label="Filters"></aside>
    <section id="stage" aria-label="Diagram">
      <svg id="svg" role="application" aria-label="Entity relationship diagram. Drag to pan, scroll or pinch to zoom.">
        <g id="vp"><g id="lanes"></g><g id="edges"></g><g id="nodes"></g></g>
      </svg>
      <div class="zoom">
        <button id="zin" class="btn" aria-label="Zoom in">+</button>
        <button id="zout" class="btn" aria-label="Zoom out">&minus;</button>
        <button id="zfit" class="btn" aria-label="Fit diagram to screen" style="font-size:12px">Fit</button>
      </div>
      <div id="legend" aria-label="Legend">
        <span><svg width="34" height="10" aria-hidden="true"><path d="M2 5H32" stroke="var(--edge)" stroke-width="1.6"/></svg>Documented</span>
        <span><svg width="34" height="10" aria-hidden="true"><path d="M2 5H32" stroke="var(--inf)" stroke-width="1.6" stroke-dasharray="6 4"/></svg>Inferred</span>
        <span><svg width="26" height="14" aria-hidden="true"><path d="M2 2L12 7L2 12M2 7H24M18 3V11M21 3V11" fill="none" stroke="var(--edge)" stroke-width="1.4"/></svg>many to one</span>
      </div>
      <div id="status" aria-live="polite"></div>
      <div id="tip" role="tooltip" hidden></div>
      <div id="toast" role="status" hidden></div>
    </section>
    <aside id="panel" aria-label="Inspector">
      <div class="tabs" role="tablist">
        <button role="tab" id="t-table" aria-controls="p-table" aria-selected="true">Table</button>
        <button role="tab" id="t-paths" aria-controls="p-paths" aria-selected="false">Query paths</button>
        <button role="tab" id="t-issues" aria-controls="p-issues" aria-selected="false">Data issues</button>
        <button role="tab" id="t-help" aria-controls="p-help" aria-selected="false">Help</button>
        <button class="close btn" id="panelClose" aria-label="Close inspector" style="margin:4px;padding:0 10px;flex:none">&times;</button>
      </div>
      <div class="pane" id="p-table" role="tabpanel" aria-labelledby="t-table"></div>
      <div class="pane" id="p-paths" role="tabpanel" aria-labelledby="t-paths" hidden></div>
      <div class="pane" id="p-issues" role="tabpanel" aria-labelledby="t-issues" hidden></div>
      <div class="pane" id="p-help" role="tabpanel" aria-labelledby="t-help" hidden></div>
    </aside>
  </main>
  <div id="modal" hidden role="dialog" aria-modal="true" aria-labelledby="mtitle">
    <div class="box"><header><h2 id="mtitle"></h2><button class="btn" id="mclose">Close</button></header><div class="mb" id="mbody"></div><footer id="mfoot"></footer></div>
  </div>

].join('\n');
var st = document.createElement('style'); st.textContent = SVG_CSS; document.head.appendChild(st);

/* ---------- model indexes ---------- */
var T = new Map();
M.tables.forEach(function(t){ T.set(t.id, t); t.out = []; t.inc = []; t.iss = []; t.joinCols = new Set(); });
var areaIdx = new Map(M.subjectAreas.map(function(a,i){ return [a.id, i % 6]; }));
var areaLabel = new Map(M.subjectAreas.map(function(a){ return [a.id, a.label]; }));
var R = M.relationships;
var RBY = new Map();
R.forEach(function(r){
  RBY.set(r.id, r);
  var f = T.get(r.from), to = T.get(r.to);
  f.out.push(r); to.inc.push(r);
  r.hub = !!to.hub && r.from !== r.to;
  r.fromCols.forEach(function(c){ f.joinCols.add(c); });
  r.toCols.forEach(function(c){ to.joinCols.add(c); });
});
M.issues.forEach(function(i){ var t = T.get(i.table); if (t) t.iss.push(i); });
var colTables = new Map();
M.tables.forEach(function(t){ t.columns.forEach(function(c){ var k = nk(c.name); if (!colTables.has(k)) colTables.set(k, []); colTables.get(k).push(t.id); }); });
var schemas = Array.from(new Set(M.tables.map(function(t){ return t.schema; })));
var SEVRANK = {high:0, med:1, low:2, info:3};

/* ---------- per-viewer storage (optional) ---------- */
var store = {
  get: function(k){ try { var v = localStorage.getItem('erd:' + M.meta.short + ':' + k); return v ? JSON.parse(v) : null; } catch(e){ return null; } },
  set: function(k, v){ try { localStorage.setItem('erd:' + M.meta.short + ':' + k, JSON.stringify(v)); return true; } catch(e){ return false; } }
};

/* ---------- state ---------- */
var prefs = store.get('prefs') || {};
var S = {
  colMode: prefs.colMode || (M.tables.length > 25 ? 'names' : 'keys'),
  layout: prefs.layout || (M.meta.hasPositions ? 'original' : 'area'),
  hops: 1, sel: null, hover: null, hoverEdge: null, path: null, q: '', matches: null, flash: null,
  f: { schemas: new Set(schemas), areas: new Set(M.subjectAreas.map(function(a){ return a.id; })), doc: true, inf: true,

};
if (S.layout === 'original' && !M.meta.hasPositions) S.layout = 'area';
if (S.layout === 'focus') S.layout = 'area';
function savePrefs(){ store.set('prefs', { colMode: S.colMode, layout: S.layout === 'focus' ? 'area' : S.layout, showHub: S.f.showHub }); }

var svg = $('#svg'), vp = $('#vp'), gN = $('#nodes'), gE = $('#edges'), gL = $('#lanes'), stage = $('#stage'), tip = $('#tip');

/* ---------- geometry ---------- */
var ROW = 18, HEAD = 34, PADB = 6, CW = 6.95, MAXROWS = 18;

  for (var i = 0; i < t.out.length; i++){ var r = t.out[i]; if (r.hub && r.fromCols[0] === c.name && S.sel !== t.id) return r.to; }
  return null;
}
function visibleCols(t){
  if (S.colMode === 'names') return { rows: [], more: 0 };
  var cols = S.colMode === 'all' ? t.columns : t.columns.filter(function(c){ return c.pk || t.joinCols.has(c.name) || c.fkMarker; });
  if (S.flash && S.flash.t === t.id && S.colMode !== 'all' && cols.indexOf(t.columns[t.columns.findIndex(function(c){ return c.name === S.flash.col; })]) < 0){
    cols = cols.concat(t.columns.filter(function(c){ return c.name === S.flash.col; }));
  }
  if (cols.length > MAXROWS) return { rows: cols.slice(0, MAXROWS - 1), more: cols.length - (MAXROWS - 1) };
  return { rows: cols, more: 0 };
}
function measure(t){
  var v = visibleCols(t);
  var w = t.name.length * 8 + 70;
  v.rows.forEach(function(c){ w = Math.max(w, (c.name.length + Math.min(shortType(c).length, 14)) * CW + 62); });
  w = Math.round(clamp(w, 170, 330));
  var n = v.rows.length + (v.more ? 1 : 0);
  var h = HEAD + n * ROW + (n ? PADB : 0);
  var d = { w: w, h: h, v: v };
  S.dims.set(t.id, d);
  return d;
}
function center(id){ var p = S.pos.get(id), d = S.dims.get(id); return { x: p.x + d.w / 2, y: p.y + d.h / 2 }; }

/* ---------- visibility ---------- */
function relPassesSource(r){ return (r.source === 'doc' && S.f.doc) || (r.source === 'inf' && S.f.inf); }
function computeVis(){
  var f = S.f, vis = new Set();
  M.tables.forEach(function(t){
    if (!f.schemas.has(t.schema) || !f.areas.has(t.area)) return;
    if (f.hideLookup && t.isLookup) return;
    if (f.hideIsolated && !t.out.concat(t.inc).some(relPassesSource)) return;
    if (S.layout === 'focus' && S.focusSet && !S.focusSet.has(t.id)) return;
    vis.add(t.id);
  });

}
function relVisible(r){
  if (!relPassesSource(r) || !S.vis.has(r.from) || !S.vis.has(r.to)) return false;
  if (r.hub && !S.f.showHub){
    if (S.path && S.path.rels.indexOf(r.id) >= 0) return true;
    if (S.sel === r.from) return true;
    return false;
  }
  return true;
}

/* ---------- layouts ---------- */
function visTables(){ return M.tables.filter(function(t){ return S.vis.has(t.id); }); }
function degree(t){ return t.out.length + t.inc.length; }
function layoutArea(){
  /* 1. build each lane as a roughly square block of columns; 2. shelf-pack lanes to the viewport aspect ratio */
  S.lanes = [];
  var LG = 60, CG = 40, RG = 26, TOP = 60, blocks = [];
  M.subjectAreas.forEach(function(a){
    var ts = visTables().filter(function(t){ return t.area === a.id; });
    if (!ts.length) return;
    ts.sort(function(p, q){ return degree(q) - degree(p) || p.name.localeCompare(q.name); });
    var colW = Math.max.apply(null, ts.map(function(t){ return S.dims.get(t.id).w; }));
    var avgH = ts.reduce(function(s, t){ return s + S.dims.get(t.id).h + RG; }, 0) / ts.length;
    var nc = clamp(Math.round(Math.sqrt(ts.length * avgH / (colW + CG))), 1, ts.length);
    var hs = [], rel = []; for (var i = 0; i < nc; i++) hs.push(TOP);
    ts.forEach(function(t){
      var ci = hs.indexOf(Math.min.apply(null, hs));
      rel.push([t.id, 20 + ci * (colW + CG), hs[ci]]);
      hs[ci] += S.dims.get(t.id).h + RG;
    });
    blocks.push({ w: nc * colW + (nc - 1) * CG + 40, h: Math.max.apply(null, hs) + 10, rel: rel, label: a.label, ai: areaIdx.get(a.id) });
  });
  if (!blocks.length) return;
  var aspect = (svg.clientWidth || 1200) / Math.max(1, (svg.clientHeight || 800));
  var area = blocks.reduce(function(s, b){ return s + (b.w + LG) * (b.h + LG); }, 0);
  var TW = Math.max(Math.max.apply(null, blocks.map(function(b){ return b.w; })), Math.sqrt(area * aspect) * 1.05);
  var x = 0, y = 0, shelfH = 0;
  blocks.forEach(function(b){
    if (x > 0 && x + b.w > TW){ x = 0; y += shelfH + LG; shelfH = 0; }
    b.rel.forEach(function(r){ S.pos.set(r[0], { x: x + r[1], y: y + r[2] }); });
    S.lanes.push({ x: x, y: y, w: b.w, h: b.h, label: b.label, ai: b.ai });
    x += b.w + LG; shelfH = Math.max(shelfH, b.h);
  });
}
function layoutAuto(){
  layoutArea(); S.lanes = [];
  var ts = visTables(), n = ts.length; if (!n) return;
  var idx = new Map(ts.map(function(t, i){ return [t.id, i]; }));
  var P = ts.map(function(t){ return center(t.id); });
  var D = ts.map(function(t){ return S.dims.get(t.id); });
  var cx = P.reduce(function(s, p){ return s + p.x; }, 0) / n, cy = P.reduce(function(s, p){ return s + p.y; }, 0) / n;
  P.forEach(function(p){ p.x -= cx; p.y -= cy; });
  var E = [];
  R.forEach(function(r){ if (relPassesSource(r) && idx.has(r.from) && idx.has(r.to) && r.from !== r.to) E.push([idx.get(r.from), idx.get(r.to), r.hub ? 0.08 : 1]); });
  var deg = ts.map(function(t){ return degree(t); }), maxd = Math.max.apply(null, deg.concat([1]));
  /* ideal edge length scales with the boxes actually drawn (names-only boxes are far smaller than keys/all) */
  var L = D.reduce(function(s, d){ return s + 0.75 * d.w + 0.6 * d.h; }, 0) / n + 70, REP = 0.06 * L * L * L;
  for (var it = 0; it < 420; it++){
    var a = 1 - it / 420, F = P.map(function(){ return { x: 0, y: 0 }; });
    for (var i = 0; i < n; i++) for (var j = i + 1; j < n; j++){
      var dx = P[i].x - P[j].x, dy = P[i].y - P[j].y, d2 = dx * dx + dy * dy + 100, d = Math.sqrt(d2);
      var f = REP / d2;
      F[i].x += f * dx / d; F[i].y += f * dy / d; F[j].x -= f * dx / d; F[j].y -= f * dy / d;
    }
    E.forEach(function(e){
      var p = P[e[0]], q = P[e[1]], dx = q.x - p.x, dy = q.y - p.y, d = Math.sqrt(dx * dx + dy * dy) + .01;
      var f = 0.035 * e[2] * (d - L);
      F[e[0]].x += f * dx / d; F[e[0]].y += f * dy / d; F[e[1]].x -= f * dx / d; F[e[1]].y -= f * dy / d;
    });
    for (i = 0; i < n; i++){
      var g = (deg[i] ? 0.012 : 0.03) * (1 + 5 * deg[i] / maxd);
      F[i].x -= g * P[i].x; F[i].y -= g * P[i].y * 1.6;
      var m = Math.sqrt(F[i].x * F[i].x + F[i].y * F[i].y), cap = 60 * a + 2;
      if (m > cap){ F[i].x *= cap / m; F[i].y *= cap / m; }
      P[i].x += F[i].x; P[i].y += F[i].y;
    }
  }
  /* collision removal on real rectangles */
  var PAD = 30;
  for (var pass = 0; pass < 300; pass++){
    var moved = false;
    for (i = 0; i < n; i++) for (j = i + 1; j < n; j++){
      var ox = (D[i].w + D[j].w) / 2 + PAD - Math.abs(P[i].x - P[j].x);
      var oy = (D[i].h + D[j].h) / 2 + PAD - Math.abs(P[i].y - P[j].y);
      if (ox > 0 && oy > 0){
        moved = true;
        if (ox < oy){ var sx = (P[i].x < P[j].x ? -1 : 1) * ox / 2; P[i].x += sx; P[j].x -= sx; }
        else { var sy = (P[i].y < P[j].y ? -1 : 1) * oy / 2; P[i].y += sy; P[j].y -= sy; }
      }
    }
    if (!moved) break;
  }
  ts.forEach(function(t, i){ S.pos.set(t.id, { x: Math.round(P[i].x - D[i].w / 2), y: Math.round(P[i].y - D[i].h / 2) }); });
}
function focusRoot(){
  if (S.sel && T.has(S.sel)) return S.sel;
  var best = null;
  M.tables.forEach(function(t){ if (!best || degree(t) > degree(best)) best = t; });
  return best.id;
}
function computeFocusSet(){
  var root = focusRoot(); S.sel = root;
  var lvl = new Map([[root, 0]]), frontier = [root];
  for (var h = 1; h <= S.hops; h++){
    var nx = [];
    frontier.forEach(function(id){
      var t = T.get(id);
      t.out.concat(t.inc).forEach(function(r){
        if (!relPassesSource(r)) return;
        if (r.hub && !S.f.showHub && r.to !== root && r.from !== root) return;
        var o = r.from === id ? r.to : r.from;

function layoutFocus(){
  S.lanes = [];

  S.pos.set(root, { x: -d0.w / 2, y: -d0.h / 2 });
  [1, 2].forEach(function(h){
    var ring = visTables().filter(function(t){ return S.focusLvl.get(t.id) === h; });
    if (!ring.length) return;
    ring.sort(function(a, b){ return areaIdx.get(a.area) - areaIdx.get(b.area) || a.name.localeCompare(b.name); });
    var perim = ring.reduce(function(s, t){ var d = S.dims.get(t.id); return s + Math.max(d.w, d.h) + 40; }, 0);
    var rad = Math.max(h * 380, perim / (2 * Math.PI));
    ring.forEach(function(t, i){
      var ang = -Math.PI / 2 + 2 * Math.PI * i / ring.length, d = S.dims.get(t.id);
      S.pos.set(t.id, { x: Math.round(rad * 1.25 * Math.cos(ang) - d.w / 2), y: Math.round(rad * Math.sin(ang) - d.h / 2) });
    });

function redrawHubAware(){ if (!S.f.showHub){ M.tables.forEach(measure); renderNodes(); renderEdges(); } applyHL(); renderStatus(); }
function select(id, fromCanvas){
  S.sel = id; S.path = null;
  if (S.layout === 'focus'){ renderAll(); }
  else redrawHubAware();
  renderTablePane(); renderPathsPane(); showTab('table'); openPanel();
}
function openPanel(){ if (window.matchMedia('(max-width:900px)').matches){ $('#panel').classList.add('open'); $('#btnPanel').setAttribute('aria-expanded', 'true'); } }
function showTab(n){
  ['table', 'paths', 'issues', 'help'].forEach(function(k){ $('#t-' + k).setAttribute('aria-selected', String(k === n)); $('#p-' + k).hidden = k !== n; });
}
$$('.tabs [role=tab]').forEach(function(b){ b.addEventListener('click', function(){ showTab(b.id.slice(2)); }); });
$('.tabs').addEventListener('keydown', function(e){
  if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
  var tabs = $$('.tabs [role=tab]'), i = tabs.indexOf(document.activeElement); if (i < 0) return;
  var n = tabs[(i + (e.key === 'ArrowRight' ? 1 : tabs.length - 1)) % tabs.length]; n.focus(); n.click();
});

function relItem(r, dirOut){
  var other = dirOut ? r.to : r.from;
  return '<li><button class="lnk" data-goto="' + esc(other) + '">' + esc(other) + '</button> <span class="sub">via</span> <code>' + esc((dirOut ? r.fromCols : r.toCols).join(',')) + '</code>' +
    (dirOut ? '' : ' <span class="sub">\u2190</span> <code>' + esc(r.fromCols.join(',')) + '</code>') +
    ' <span class="src ' + r.source + '">' + r.source + '</span> <span class="sub">' + esc(r.card) + (r.role ? ' \u00b7 ' + esc(r.role) : '') + '</span>' +
    (r.condition ? '<div class="sub">when <code>' + esc(r.condition) + '</code></div>' : '') + '</li>';
}
function issueItem(i, withTable){
  return '<li class="iss"><span class="sev ' + i.sev + '">' + i.sev + '</span><span>' +
    (withTable ? '<button class="lnk" data-goto="' + esc(i.table) + '"' + (i.column ? ' data-col="' + esc(i.column) + '"' : '') + '>' + esc(i.table + (i.column ? '.' + i.column : '')) + '</button> ' : (i.column ? '<code>' + esc(i.column) + '</code> ' : '')) +
    esc(i.msg) + '</span><span class="ev">' + esc(i.cat) + ' \u00b7 ' + esc(i.evidence) + '</span></li>';
}
function overview(){
  var doc = R.filter(function(r){ return r.source === 'doc'; }).length, sev = { high: 0, med: 0, low: 0, info: 0 };
  M.issues.forEach(function(i){ sev[i.sev]++; });
  var cols = M.tables.reduce(function(s, t){ return s + t.columns.length; }, 0);
  return '<p class="sub">Nothing selected. Click or tap a table to inspect it.</p><h2 style="font-family:var(--ui)">' + esc(M.meta.name) + '</h2><p>' + esc(M.meta.blurb) + '</p>' +
    '<div class="stats"><div class="stat"><b>' + M.tables.length + '</b><span>tables</span></div><div class="stat"><b>' + cols + '</b><span>columns</span></div><div class="stat"><b>' + R.length + '</b><span>joins</span></div>' +
    '<div class="stat"><b>' + doc + '</b><span>documented</span></div><div class="stat"><b>' + (R.length - doc) + '</b><span>inferred</span></div><div class="stat"><b>' + M.issues.length + '</b><span>issues</span></div></div>' +
    '<p><span class="sev high">high</span> ' + sev.high + ' &nbsp; <span class="sev med">med</span> ' + sev.med + ' &nbsp; <span class="sev low">low</span> ' + sev.low + ' &nbsp; <span class="sev info">info</span> ' + sev.info + '</p>' +
    (M.meta.hubNote ? '<p class="note">' + esc(M.meta.hubNote) + '</p>' : '') +
    '<h3>Most connected</h3><ul class="list">' + M.tables.slice().sort(function(a, b){ return degree(b) - degree(a); }).slice(0, 6).map(function(t){
      return '<li><button class="lnk" data-goto="' + esc(t.id) + '">' + esc(t.name) + '</button> <span class="sub">' + degree(t) + ' joins</span></li>'; }).join('') + '</ul>';
}
function renderTablePane(){
  var p = $('#p-table'), t = S.sel && T.get(S.sel);
  if (!t){ p.innerHTML = overview(); return; }
  var outs = t.out.slice().sort(function(a, b){ return a.to.localeCompare(b.to); });
  var byTable = new Map(); t.inc.forEach(function(r){ if (!byTable.has(r.from)) byTable.set(r.from, []); byTable.get(r.from).push(r); });
  var incHtml = Array.from(byTable.keys()).sort().map(function(k){
    var rs = byTable.get(k);
    if (rs.length === 1) return relItem(rs[0], false);
    return '<li><button class="lnk" data-goto="' + esc(k) + '">' + esc(k) + '</button> <span class="sub">via ' + rs.length + ' columns:</span> ' + rs.map(function(r){ return '<code>' + esc(r.fromCols[0]) + '</code>'; }).join(', ') + '</li>';
  }).join('');
  var iss = t.iss.slice().sort(function(a, b){ return SEVRANK[a.sev] - SEVRANK[b.sev]; });
  p.innerHTML =
    '<div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center"><span class="chip"><span class="sw ar' + areaIdx.get(t.area) + '"></span>' + esc(areaLabel.get(t.area)) + '</span><span class="chip">' + esc(t.schema) + '</span>' + (t.isLookup ? '<span class="chip">lookup</span>' : '') + (t.hub ? '<span class="chip">hub</span>' : '') + '</div>' +
    '<h2>' + esc(t.name) + '</h2>' + (t.description ? '<p>' + esc(t.description) + '</p>' : '<p class="sub">No table description in the dictionary.</p>') +
    (t.guidance ? '<details><summary>Usage guidance</summary><p>' + esc(t.guidance) + '</p></details>' : '') +
    '<h3>Summary <span class="tag">Derived</span></h3><p>' + esc(t.summary) + '</p>' +
    '<dl class="kv"><dt>Primary key</dt><dd>' + esc(t.pk.join(', ') || 'none declared') + '</dd><dt>Columns</dt><dd>' + t.columns.length + '</dd></dl>' +
    '<h3>References (' + outs.length + ')</h3>' + (outs.length ? '<ul class="list">' + outs.map(function(r){ return relItem(r, true); }).join('') + '</ul>' : '<p class="sub">None.</p>') +
    '<h3>Referenced by (' + t.inc.length + ')</h3>' + (incHtml ? '<ul class="list">' + incHtml + '</ul>' : '<p class="sub">None.</p>') +
    '<h3>Data issues (' + iss.length + ')</h3>' + (iss.length ? '<ul class="list">' + iss.map(function(i){ return issueItem(i, false); }).join('') + '</ul>' : '<p class="sub">None found.</p>') +
    '<h3>Columns</h3><input id="cfilter" class="ctl filter" type="search" placeholder="Filter columns" aria-label="Filter columns">' +
    '<div class="wrap"><table class="ctab"><thead><tr><th>Key</th><th>Column</th><th>Type</th><th>Description</th></tr></thead><tbody id="ctbody"></tbody></table></div>';
  renderColRows(t, '');
  $('#cfilter').addEventListener('input', function(e){ renderColRows(t, e.target.value); });
}
function renderColRows(t, q){
  q = q.toLowerCase();
  var rows = t.columns.filter(function(c){ return !q || c.name.toLowerCase().indexOf(q) >= 0 || (c.desc || '').toLowerCase().indexOf(q) >= 0; });
  $('#ctbody').innerHTML = rows.map(function(c){
    var fk = t.out.some(function(r){ return r.fromCols[0] === c.name; });
    return '<tr class="r' + (c.flags && c.flags.length ? ' flag' : '') + '" data-col="' + esc(c.name) + '" tabindex="0"><td class="ktag">' + (c.pk ? 'PK' : '') + (fk ? (c.pk ? ' ' : '') + 'FK' : '') + '</td><td class="nm">' + esc(c.name) + (c.required ? ' <span class="sub">*</span>' : '') +
      '</td><td class="nm">' + esc(c.type || c.dictType || '') + '</td><td><span class="ds">' + esc(c.desc || '') + '</span></td></tr>';
  }).join('') || '<tr><td colspan="4" class="sub">No columns match.</td></tr>';
}
function colDetail(t, cn){
  var c = t.columns.find(function(x){ return x.name === cn; });
  var others = (colTables.get(nk(cn)) || []).filter(function(x){ return x !== t.id; });
  var joins = t.out.concat(t.inc).filter(function(r){ return (r.from === t.id && r.fromCols.indexOf(cn) >= 0) || (r.to === t.id && r.toCols.indexOf(cn) >= 0); });
  return '<tr class="x"><td></td><td colspan="3">' +
    (c.desc ? '<p>' + esc(c.desc) + '</p>' : '') + (c.descFrom ? '<p class="sub">Description taken from ' + esc(c.descFrom) + '.</p>' : '') +
    (c.etl && c.etl !== c.desc ? '<details><summary>ETL conventions</summary><p>' + esc(c.etl) + '</p></details>' : '') +
    '<p class="sub">Model type: <code>' + esc(c.type || 'n/a') + '</code> \u00b7 Dictionary type: <code>' + esc(c.dictType || 'n/a') + '</code> \u00b7 ' + (c.required ? 'required' : 'optional') + (c.dictName && c.dictName !== c.name ? ' \u00b7 dictionary name: <code>' + esc(c.dictName) + '</code>' : '') + '</p>' +
    (c.flags && c.flags.length ? '<p style="color:var(--warn)">Flags: ' + esc(c.flags.join(', ')) + '</p>' : '') +
    (joins.length ? '<p>Joins: ' + joins.map(function(r){ return relLine(r) + ' <span class="src ' + r.source + '">' + r.source + '</span>'; }).join('<br>') + '</p>' : '') +
    '<p>' + (others.length ? 'Also in: ' + others.map(function(o){ return '<button class="lnk" data-goto="' + esc(o) + '" data-col="' + esc(T.get(o).columns.find(function(x){ return nk(x.name) === nk(cn); }).name) + '">' + esc(o) + '</button>'; }).join(', ') : '<span class="sub">No other table has this column.</span>') + '</p></td></tr>';
}
function showColumn(tid, cn){
  if (S.sel !== tid) select(tid);
  var tr = $('#ctbody tr[data-col="' + cssq(cn) + '"]'); if (!tr) return;
  toggleColRow(tr, true);
  tr.scrollIntoView({ block: 'nearest' });
}
function toggleColRow(tr, forceOpen){
  var nx = tr.nextElementSibling;
  if (nx && nx.classList.contains('x')){ if (!forceOpen) nx.remove(); return; }
  tr.insertAdjacentHTML('afterend', colDetail(T.get(S.sel), tr.getAttribute('data-col')));
}
$('#p-table').addEventListener('click', function(e){
  var tr = e.target.closest('tr.r'); if (tr && !e.target.closest('button')) toggleColRow(tr);
});
$('#p-table').addEventListener('keydown', function(e){ var tr = e.target.closest('tr.r'); if (tr && (e.key === 'Enter' || e.key === ' ')){ e.preventDefault(); toggleColRow(tr); } });
document.addEventListener('click', function(e){
  var b = e.target.closest('[data-goto]'); if (!b) return;
  goTo(b.getAttribute('data-goto'), b.getAttribute('data-col'));
});
function ensureVisible(id){
  var t = T.get(id), changed = false;
  if (!S.f.areas.has(t.area)){ S.f.areas.add(t.area); changed = true; }
  if (!S.f.schemas.has(t.schema)){ S.f.schemas.add(t.schema); changed = true; }
  if (S.f.hideLookup && t.isLookup){ S.f.hideLookup = false; changed = true; }
  if (S.f.hideIsolated){ S.f.hideIsolated = false; changed = true; }
  return changed;
}
function goTo(id, col){
  if (!T.has(id)) return;
  var changed = ensureVisible(id);
  S.path = null; S.sel = id; S.flash = col ? { t: id, col: col } : null;
  if (S.layout === 'focus' || changed || col) renderAll(true); else redrawHubAware();
  centerOn(id);
  renderTablePane(); renderPathsPane(); showTab('table'); openPanel();
  if (col) showColumn(id, col);
  if (changed) toast('Filters adjusted to show ' + id);
  if (col) setTimeout(function(){ S.flash = null; }, 50);
}

/* ---------- query paths ---------- */

  p.innerHTML = '<p class="sub">Preset join paths. Selecting one highlights its tables and joins and zooms to them.</p>' +

      var rs = q.rels.map(function(id){ return RBY.get(id); }), inf = rs.some(function(r){ return r.source === 'inf'; });
      return '<div class="path' + (S.path && S.path.id === q.id ? ' on' : '') + '"><h4>' + esc(q.label) + (inf ? ' <span class="src inf">has inferred</span>' : '') + '</h4><p class="sub">' + esc(q.desc) + '</p>' +
        '<div class="sub mono" style="word-break:break-word">' + rs.map(function(r){ return esc(r.from + '.' + r.fromCols[0] + ' \u2192 ' + r.to); }).join('<br>') + '</div>' +
        '<p><button class="btn" data-path="' + esc(q.id) + '" aria-pressed="' + (S.path && S.path.id === q.id) + '">Show path</button></p></div>';

$('#p-paths').addEventListener('click', function(e){
  if (e.target.id === 'pclear'){ S.path = null; applyHL(); renderPathsPane(); redrawHubAware(); return; }

});

/* ---------- issues ---------- */
function renderIssuesPane(){
  var p = $('#p-issues'), groups = new Map();
  M.issues.slice().sort(function(a, b){ return SEVRANK[a.sev] - SEVRANK[b.sev]; }).forEach(function(i){ if (!groups.has(i.cat)) groups.set(i.cat, []); groups.get(i.cat).push(i); });
  var sev = { high: 0, med: 0, low: 0, info: 0 }; M.issues.forEach(function(i){ sev[i.sev]++; });
  var cats = Array.from(groups.keys()).sort(function(a, b){ return SEVRANK[groups.get(a)[0].sev] - SEVRANK[groups.get(b)[0].sev] || groups.get(b).length - groups.get(a).length; });
  p.innerHTML = '<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><span class="sev high">high</span>' + sev.high + '<span class="sev med">med</span>' + sev.med + '<span class="sev low">low</span>' + sev.low + '<span class="sev info">info</span>' + sev.info +
    '<button class="btn" data-ex="issues" style="margin-left:auto">Export CSV</button></div>' +
    '<p class="sub">Generated by reconciling the two sources, then grouped. Click an item to jump to it.</p>' +
    cats.map(function(c){ var it = groups.get(c), open = it[0].sev === 'high';
      return '<details class="grp"' + (open ? ' open' : '') + '><summary><span class="sev ' + it[0].sev + '">' + it[0].sev + '</span>' + esc(c) + '<span class="n">' + it.length + '</span></summary><ul class="list">' + it.map(function(i){ return issueItem(i, true); }).join('') + '</ul></details>';
    }).join('') +
    '<h3>Validation checklist</h3><div class="chk">' + (M.validation || []).map(function(v){ return '<span class="' + (v.ok ? 'ok' : 'bad') + '">' + (v.ok ? 'PASS' : 'FAIL') + '</span><span>' + esc(v.check) + ' <span class="sub">(' + esc(v.detail) + ')</span></span>'; }).join('') + '</div>';
}

/* ---------- search ---------- */
var qi = $('#q'), qres = $('#qres'), qitems = [], qsel = -1;
function runSearch(){
  var q = qi.value.trim().toLowerCase(); S.q = q; qitems = []; qsel = -1;
  if (!q){ qres.hidden = true; qi.setAttribute('aria-expanded', 'false'); S.matches = null; applyHL(); return; }
  var m = new Set();
  M.tables.forEach(function(t){ if (t.name.toLowerCase().indexOf(q) >= 0){ qitems.push({ t: t.id }); m.add(t.id); } });
  M.tables.forEach(function(t){ t.columns.forEach(function(c){ if (c.name.toLowerCase().indexOf(q) >= 0 || nk(c.name).indexOf(nk(q)) >= 0){ qitems.push({ t: t.id, c: c.name }); m.add(t.id); } }); });
  S.matches = m; applyHL();
  var shown = qitems.slice(0, 40);
  qres.innerHTML = shown.length ? shown.map(function(it, i){
    return '<li role="option" id="qo' + i + '" data-i="' + i + '" aria-selected="false"><span class="mono">' + esc(it.c ? it.c : it.t) + '</span><span class="k">' + (it.c ? esc(it.t) : 'table') + '</span></li>'; }).join('') +
    (qitems.length > 40 ? '<li class="k" aria-disabled="true">' + (qitems.length - 40) + ' more, refine the search</li>' : '')
    : '<li class="k" aria-disabled="true">No matches</li>';
  qres.hidden = false; qi.setAttribute('aria-expanded', 'true');
}
function pickSearch(i){
  var it = qitems[i]; if (!it) return;
  qres.hidden = true; qi.setAttribute('aria-expanded', 'false');
  goTo(it.t, it.c || null);
}
qi.addEventListener('input', runSearch);
qi.addEventListener('keydown', function(e){
  var n = Math.min(qitems.length, 40);
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp'){
    e.preventDefault(); if (!n) return;
    qsel = (qsel + (e.key === 'ArrowDown' ? 1 : n - 1) + (qsel < 0 && e.key === 'ArrowUp' ? 1 : 0)) % n;
    $$('#qres li[role=option]').forEach(function(li, i){ li.setAttribute('aria-selected', String(i === qsel)); });
    var cur = $('#qo' + qsel); if (cur){ cur.scrollIntoView({ block: 'nearest' }); qi.setAttribute('aria-activedescendant', 'qo' + qsel); }
  } else if (e.key === 'Enter'){ e.preventDefault(); pickSearch(qsel < 0 ? 0 : qsel); }
  else if (e.key === 'Escape'){ qi.value = ''; runSearch(); qi.blur(); }
});
qres.addEventListener('mousedown', function(e){ var li = e.target.closest('[data-i]'); if (li){ e.preventDefault(); pickSearch(+li.getAttribute('data-i')); } });
qi.addEventListener('blur', function(){ setTimeout(function(){ qres.hidden = true; qi.setAttribute('aria-expanded', 'false'); }, 120); });

/* ---------- controls ---------- */
var lsel = $('#layout');
if (!M.meta.hasPositions){ var o = lsel.querySelector('[value=original]'); o.disabled = true; o.textContent = 'Original (no coordinates in sources)'; }
lsel.value = S.layout; $('#colmode').value = S.colMode;
lsel.addEventListener('change', function(){ S.layout = lsel.value; if (S.layout !== 'focus') S.focusSet = null; S.path = S.layout === 'focus' ? null : S.path; savePrefs(); renderAll(); renderPathsPane(); });
$('#colmode').addEventListener('change', function(e){ S.colMode = e.target.value; savePrefs(); renderAll(S.layout === 'custom' || S.layout === 'original'); });
$('#hops').addEventListener('change', function(e){ S.hops = +e.target.value; renderAll(); });
$('#zin').addEventListener('click', function(){ zoomAt(1.25, svg.clientWidth / 2, svg.clientHeight / 2); });
$('#zout').addEventListener('click', function(){ zoomAt(0.8, svg.clientWidth / 2, svg.clientHeight / 2); });
$('#zfit').addEventListener('click', function(){ fit(); });
var THEMES = ['', 'dark', 'light'], tIdx = Math.max(0, THEMES.indexOf(prefs.theme || ''));
function applyTheme(){ var th = THEMES[tIdx]; if (th) document.documentElement.setAttribute('data-theme', th); else if (prefs.themeSet) document.documentElement.removeAttribute('data-theme');
  $('#btnTheme').textContent = 'Theme: ' + (th ? th[0].toUpperCase() + th.slice(1) : 'Auto'); $('#btnTheme').setAttribute('aria-label', 'Theme: ' + (th || 'follow system') + '. Click to change.'); }
if (prefs.theme) applyTheme();
$('#btnTheme').addEventListener('click', function(){ tIdx = (tIdx + 1) % 3; prefs.theme = THEMES[tIdx]; prefs.themeSet = true; applyTheme(); var p = store.get('prefs') || {}; p.theme = prefs.theme; store.set('prefs', p); });
function toggleDrawer(open){ $('#filters').classList.toggle('open', open); $('#btnFilters').setAttribute('aria-expanded', String(open)); }
$('#btnFilters').addEventListener('click', function(){ toggleDrawer(!$('#filters').classList.contains('open')); });
$('#btnPanel').addEventListener('click', function(){ var o = !$('#panel').classList.contains('open'); $('#panel').classList.toggle('open', o); $('#btnPanel').setAttribute('aria-expanded', String(o)); });
$('#panelClose').addEventListener('click', function(){ $('#panel').classList.remove('open'); $('#btnPanel').setAttribute('aria-expanded', 'false'); });
gN.addEventListener('keydown', function(e){
  var n = e.target.closest && e.target.closest('.node'); if (!n) return;
  if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); select(n.getAttribute('data-id')); }
});
gN.addEventListener('focusin', function(e){ var n = e.target.closest('.node'); if (n){ S.hover = n.getAttribute('data-id'); applyHL(); } });
gN.addEventListener('focusout', function(){ S.hover = null; applyHL(); });
document.addEventListener('keydown', function(e){
  var typing = /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
  if (e.key === 'Escape'){
    if (!$('#modal').hidden){ closeModal(); return; }
    if (!$('#exMenu').hidden){ closeMenu(); return; }
    S.sel = null; S.path = null; S.hoverEdge = null; hideTip(); renderTablePane(); renderPathsPane(); redrawHubAware(); return;
  }
  if (typing) return;
  if (e.key === '/'){ e.preventDefault(); qi.focus(); }
  else if (e.key === '+' || e.key === '='){ zoomAt(1.25, svg.clientWidth / 2, svg.clientHeight / 2); }
  else if (e.key === '-'){ zoomAt(0.8, svg.clientWidth / 2, svg.clientHeight / 2); }
  else if (e.key === '0'){ fit(); }
});
function toast(msg){ var t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(function(){ t.hidden = true; }, 2600); }

/* ---------- custom layout persistence ---------- */
function saveCustom(){
  var o = {}; S.pos.forEach(function(p, id){ o[id] = { x: p.x, y: p.y }; });
  S.customMem = o;
  var ok = store.set('custom', o);
  if (S.layout !== 'custom'){ S.layout = 'custom'; lsel.value = 'custom'; S.lanes = []; renderLanes(); }
  toast(ok ? 'Position saved to the Custom layout in this browser' : 'Position kept for this session only (browser storage unavailable)');
  savePrefs();
}

/* ---------- export / import ---------- */
var exBtn = $('#btnExport'), exMenu = $('#exMenu');
function closeMenu(){ exMenu.hidden = true; exBtn.setAttribute('aria-expanded', 'false'); }
exBtn.addEventListener('click', function(){ var o = exMenu.hidden; exMenu.hidden = !o; exBtn.setAttribute('aria-expanded', String(o)); if (o) exMenu.querySelector('button').focus(); });
document.addEventListener('click', function(e){
  if (!e.target.closest('.menu')) closeMenu();
  var b = e.target.closest('[data-ex]'); if (!b) return;
  closeMenu(); doExport(b.getAttribute('data-ex'));
});
function csv(rows){ return rows.map(function(r){ return r.map(function(v){ v = v == null ? '' : String(v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }).join(','); }).join('\n'); }
function doExport(kind){
  var base = M.meta.short;
  if (kind === 'rels') textModal('Relationships CSV', base + '_relationships.csv', csv([['id', 'from_table', 'from_columns', 'to_table', 'to_columns', 'cardinality', 'source', 'confidence', 'role', 'condition', 'evidence', 'flags']].concat(
    R.map(function(r){ return [r.id, r.from, r.fromCols.join('|'), r.to, r.toCols.join('|'), r.card, r.source === 'doc' ? 'documented' : 'inferred', r.confidence || '', r.role, r.condition, r.evidence, (r.flags || []).join('|')]; }))), 'text/csv');
  else if (kind === 'cols') textModal('Merged columns CSV', base + '_columns.csv', csv([['table', 'area', 'column', 'model_type', 'dictionary_type', 'required', 'pk', 'flags', 'other_tables_with_column', 'description']].concat(
    [].concat.apply([], M.tables.map(function(t){ return t.columns.map(function(c){ return [t.id, areaLabel.get(t.area), c.name, c.type, c.dictType, c.required, c.pk, (c.flags || []).join('|'), (colTables.get(nk(c.name)) || []).length - 1, c.desc]; }); })))), 'text/csv');
  else if (kind === 'issues') textModal('Data issues CSV', base + '_issues.csv', csv([['id', 'severity', 'category', 'table', 'column', 'message', 'evidence']].concat(M.issues.map(function(i){ return [i.id, i.sev, i.cat, i.table, i.column, i.msg, i.evidence]; }))), 'text/csv');
  else if (kind === 'layout'){ var o = { model: M.meta.short, layout: S.layout, positions: {} }; S.pos.forEach(function(p, id){ if (S.vis.has(id)) o.positions[id] = p; }); textModal('Layout JSON', base + '_layout.json', JSON.stringify(o, null, 1), 'application/json'); }
  else if (kind === 'import') importModal();
  else if (kind === 'png') pngExport();
}
/* In the Claude artifact viewer, saves go through the downloads capability (viewer confirms).
   As a standalone file, a plain download link works. Copy is always offered as a fallback. */
var DL = null;
try { if (window.claude && window.claude.use) window.claude.use('downloads').then(function(n){ DL = n; }, function(){}); } catch(e){}
function dataUrlToBlob(u){ var p = u.split(','), bin = atob(p[1]), a = new Uint8Array(bin.length); for (var i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i); return new Blob([a], { type: 'image/png' }); }
function download(name, data, type){
  var msg = function(t){ var m = $('#mmsg'); if (m) m.textContent = t; };
  var isUrl = typeof data === 'string' && data.indexOf('data:') === 0;
  if (DL){
    DL.save({ filename: name, data: isUrl ? dataUrlToBlob(data) : data }).then(function(){ msg('Saved ' + name); }, function(e){
      var c = e && e.code;
      msg(c === 'declined' ? 'Save cancelled.' : c === 'rate_limited' ? 'A save prompt is already open. Try again in a moment.' : 'Saving is not available here. Use Copy instead.');
    });
    return;
  }
  try { var url = isUrl ? data : URL.createObjectURL(new Blob([data], { type: type }));
    var a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
    msg('Download started. If nothing appeared, use Copy.'); } catch(e){ msg('Download failed here. Use Copy instead.'); }
}
function openModal(title, body, foot){ $('#mtitle').textContent = title; $('#mbody').innerHTML = body; $('#mfoot').innerHTML = foot; $('#modal').hidden = false; $('#mclose').focus(); }
function closeModal(){ $('#modal').hidden = true; exBtn.focus(); }
$('#mclose').addEventListener('click', closeModal);
$('#modal').addEventListener('click', function(e){ if (e.target.id === 'modal') closeModal(); });
function textModal(title, name, text, type){
  openModal(title, '<p class="sub">' + (text.split('\n').length - 1) + ' rows. Download saves a file where the page allows it; Copy always works.</p><textarea id="mtext" readonly aria-label="' + esc(title) + '"></textarea>',
    '<button class="btn primary" id="mdl">Download ' + esc(name) + '</button><button class="btn" id="mcopy">Copy</button><span class="sub" id="mmsg" role="status"></span>');
  $('#mtext').value = text;
  $('#mdl').onclick = function(){ download(name, text, type); };
  $('#mcopy').onclick = function(){
    var ta = $('#mtext');
    var done = function(){ $('#mmsg').textContent = 'Copied'; };
    var fallback = function(){ ta.focus(); ta.select(); try { document.execCommand('copy'); done(); } catch(e){ $('#mmsg').textContent = 'Text selected. Press Ctrl or Cmd + C.'; } };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, fallback); else fallback();
  };
}
function importModal(){
  openModal('Import layout JSON', '<p class="sub">Paste a layout exported from this explorer, or choose a file. Positions load into the Custom layout.</p><textarea id="mtext" aria-label="Layout JSON"></textarea><p><input type="file" id="mfile" accept=".json,application/json"></p>',
    '<button class="btn primary" id="mapply">Apply layout</button><span class="sub" id="mmsg" role="status"></span>');
  $('#mfile').onchange = function(e){ var f = e.target.files[0]; if (!f) return; var rd = new FileReader(); rd.onload = function(){ $('#mtext').value = rd.result; }; rd.readAsText(f); };
  $('#mapply').onclick = function(){
    try {
      var o = JSON.parse($('#mtext').value), pos = o.positions || o, n = 0, c = {};
      Object.keys(pos).forEach(function(id){ if (T.has(id) && isFinite(pos[id].x) && isFinite(pos[id].y)){ c[id] = { x: +pos[id].x, y: +pos[id].y }; n++; } });
      if (!n) throw new Error('No positions matched tables in this model.');
      S.customMem = c; store.set('custom', c); S.layout = 'custom'; lsel.value = 'custom'; savePrefs(); renderAll(); closeModal(); toast('Imported ' + n + ' table positions');
    } catch(err){ $('#mmsg').textContent = 'Could not import: ' + err.message; }
  };
}
function resolvedCss(){
  var cs = getComputedStyle(document.documentElement);
  return SVG_CSS.replace(/var\(--([\w-]+)\)/g, function(_, n){ return cs.getPropertyValue('--' + n).trim(); });
}
function pngExport(){
  var b = bbox(Array.from(S.vis)); if (!b) return;
  var pad = 90, W = b.w + pad * 2, H = b.h + pad * 2;
  var clone = svg.cloneNode(true);
  clone.setAttribute('xmlns', NS); clone.setAttribute('width', W); clone.setAttribute('height', H);
  clone.setAttribute('viewBox', (b.x - pad) + ' ' + (b.y - pad) + ' ' + W + ' ' + H);
  clone.removeAttribute('style');
  clone.querySelector('#vp').removeAttribute('transform');
  clone.classList.remove('lod');
  var s = document.createElementNS(NS, 'style'); s.textContent = resolvedCss(); clone.insertBefore(s, clone.firstChild);
  var bg = document.createElementNS(NS, 'rect'); bg.setAttribute('class', 'bg'); bg.setAttribute('x', b.x - pad); bg.setAttribute('y', b.y - pad); bg.setAttribute('width', W); bg.setAttribute('height', H);
  clone.insertBefore(bg, s.nextSibling);
  $$('.hit', clone).forEach(function(h){ if (h.tagName === 'path') h.remove(); });
  var xml = new XMLSerializer().serializeToString(clone);
  var img = new Image(), scale = clamp(Math.min(2, 8000 / Math.max(W, H)), 0.25, 2);
  img.onload = function(){
    var c = document.createElement('canvas'); c.width = Math.round(W * scale); c.height = Math.round(H * scale);
    var ctx = c.getContext('2d'); ctx.scale(scale, scale); ctx.drawImage(img, 0, 0);
    var url; try { url = c.toDataURL('image/png'); } catch(e){ toast('PNG export failed: ' + e.message); return; }
    window.__lastPng = url.length;
    openModal('PNG of visible diagram', '<p class="sub">' + Math.round(W * scale) + ' \u00d7 ' + Math.round(H * scale) + ' px, current highlight state included. If Download does nothing here, right-click or long-press the image to save it.</p><img alt="Exported diagram" src="' + url + '">',
      '<button class="btn primary" id="mdl">Download PNG</button><span class="sub" id="mmsg" role="status"></span>');
    $('#mdl').onclick = function(){ download(M.meta.short + '_erd.png', url, 'image/png'); };
  };
  img.onerror = function(){ toast('PNG export failed while rendering the diagram'); };
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(xml);
}

/* ---------- boot ---------- */
$('#mname').textContent = M.meta.name + ' explorer';
$('#msub').textContent = M.tables.length + ' tables \u00b7 ' + R.length + ' joins \u00b7 ' + M.issues.length + ' data issues \u00b7 rev ' + M.meta.commit;
renderAll();
renderTablePane(); renderPathsPane(); renderIssuesPane(); renderHelpPane();
var ro = new ResizeObserver(function(){ if (!ro.done){ ro.done = true; fit(); } });
ro.observe(svg);
window.__erd = { S: S, M: M, fit: fit, select: select, goTo: goTo, doExport: doExport };
})();
</script>
